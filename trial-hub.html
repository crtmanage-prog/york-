.ws-cta{height:46px;padding:0 22px;border-radius:12px;border:none;background:#D2E739;color:#0A0A09;display:inline-flex;align-items:center;gap:8px;font-family:Unbounded,sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.ws-cta:hover{filter:brightness(.97)}
.ws-ghost{height:44px;padding:0 18px;border-radius:12px;border:1px solid rgba(17,18,14,.09);background:transparent;color:#0A0A09;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.ws-ghost:hover{background:rgba(255,255,255,.7)}

/* Prepare */
.ws-student{border-radius:20px;padding:14px 18px}
.ws-student summary{cursor:pointer;font-weight:600;font-size:14px}
.ws-blk.sel{border:1px solid #D2E739;box-shadow:inset 0 0 0 1px #D2E739}
.ws-blk{cursor:pointer}
.ws-chip{font:inherit;font-size:12px}
.ws-prep{display:flex;gap:16px;align-items:flex-start}
.ws-prep-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ws-prog{border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ws-prog .row{display:flex;justify-content:space-between;align-items:baseline}
.ws-prog .row b{font-family:Unbounded,sans-serif;font-size:15px;font-weight:700}
.ws-prog .row em{font-family:Unbounded,sans-serif;font-size:22px;font-weight:700;color:#5B6B0A;font-style:normal}
.ws-prog .bar{height:10px;border-radius:999px;background:rgba(17,18,14,.09);overflow:hidden}
.ws-prog .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8FA21C,#D2E739)}
.ws-prog small{font-size:13px;color:#6B6C64}
.ws-blk{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px}
.ws-blk.is-empty{border:1px dashed rgba(242,184,75,.45)}
.ws-blk .grab{cursor:grab;color:#A8AAA4;display:flex}
.ws-blk .ck{display:flex;color:#5B6B0A}
.ws-blk.is-empty .ck{color:#B7791F}
.ws-blk .no{width:22px;font-size:12px;color:#6B6C64}
.ws-blk .tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ws-blk .tx b{font-size:14px;font-weight:600}
.ws-blk .tx span{font-size:13px;color:#6B6C64;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-blk.is-empty .tx span{color:#B7791F}
.ws-blk .min{font-size:12px;color:#6B6C64;width:46px;text-align:right}
.ws-blk .addlib{height:32px;padding:0 12px;border-radius:999px;border:1px solid #D2E739;background:transparent;color:#5B6B0A;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.ws-blk .x{all:unset;cursor:pointer;color:#A8AAA4;padding:4px;display:flex}
.ws-blk .x:hover{color:#0A0A09}
.ws-blk.dragging{opacity:.4}
.ws-libpanel{width:300px;flex-shrink:0;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;position:sticky;top:16px}
.ws-libpanel .hd{display:flex;justify-content:space-between;align-items:center}
.ws-libpanel .hd b{font-family:Unbounded,sans-serif;font-size:15px;font-weight:700}
.ws-libpanel .hd button{all:unset;cursor:pointer;color:#6B6C64;display:flex}
.ws-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;background:#F7F7F2;border:1px solid rgba(17,18,14,.09)}
.ws-search input{border:0;background:none;outline:none;flex:1;min-width:0;font:inherit;font-size:13px}
.ws-chips{display:flex;gap:6px;flex-wrap:wrap}
.ws-chip{padding:4px 10px;border-radius:999px;border:1px solid rgba(17,18,14,.09);background:transparent;color:#0A0A09;font-size:12px;font-weight:600;cursor:pointer}
.ws-chip.on{background:#D2E739}
.ws-li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(17,18,14,.09)}
.ws-li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.ws-li .tx b{font-size:13px;font-weight:600}
.ws-li .tx span{font-size:11px;color:#6B6C64}
.ws-li button.add{width:30px;height:30px;border-radius:999px;border:1px solid #D2E739;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ws-li button.add:hover{background:#D2E739}
.ws-libpanel .foot{font-size:12px;color:#6B6C64}
@media (max-width:1000px){ .ws-prep{flex-direction:column} .ws-libpanel{width:100%;position:static} }

/* Live (светлый) */
.live{position:fixed;inset:0;z-index:52;display:none;border-radius:0}
.live.open{display:flex}
.live{background:radial-gradient(circle at 60% -5%, rgba(215,239,66,.45), transparent 38%),radial-gradient(circle at 100% 70%, rgba(215,239,66,.18), transparent 35%),#F3F2ED;color:#0A0A09;flex-direction:column;overflow:auto}
.live .lv-head{padding:16px 24px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid rgba(17,18,14,.09)}
.live .lv-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.live .lv-brand{font-family:Unbounded,sans-serif;font-size:15px;font-weight:800}
.live .lv-brand i{color:#5B6B0A;font-style:normal}
.live .lv-who{font-size:13px;color:#6B6C64}
.live .lv-time{font-family:Unbounded,sans-serif;font-size:22px;font-weight:700;color:#5B6B0A}
.live .lv-total{font-size:13px;color:#6B6C64}
.live .lv-end{height:36px;padding:0 14px;border-radius:10px;border:1px solid rgba(17,18,14,.09);background:transparent;color:#0A0A09;font-size:13px;cursor:pointer}
.live .lv-seg{display:flex;gap:4px}
.live .lv-seg .s{min-width:0;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit}
.live .lv-seg .s i{display:block;height:8px;border-radius:999px;background:rgba(17,18,14,.09)}
.live .lv-seg .s.done i{background:rgba(210,231,57,.35)}
.live .lv-seg .s.cur i{background:#D2E739}
.live .lv-seg .s.skip i{opacity:.4}
.live .lv-seg .s span{font-size:11px;color:#6B6C64;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live .lv-seg .s.cur span{color:#5B6B0A}
.live .lv-body{flex:1;min-height:0;display:flex;gap:16px;padding:18px 24px}
.live .lv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.live .lv-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.live .lv-now{padding:4px 10px;border-radius:999px;background:#D2E739;font-size:12px;font-weight:700}
.live .lv-bt{font-family:Unbounded,sans-serif;font-size:20px;font-weight:700;margin:0}
.live .lv-left{font-size:13px;color:#6B6C64}
.live .lv-ib{width:36px;height:36px;border-radius:10px;border:1px solid rgba(17,18,14,.09);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.live .lv-ab{height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(17,18,14,.09);background:transparent;color:#0A0A09;display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.live .lv-stage{flex:1;border-radius:20px;background:#fff;border:1px solid rgba(17,18,14,.08);padding:28px 32px;overflow:auto;min-height:320px}
.live .lv-foot{display:flex;justify-content:space-between;gap:12px}
.live aside.lv-side{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.live .lv-card{border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.live .lv-card .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B6B0A}
.live .lv-card p{margin:0;font-size:14px;line-height:1.5}
.live .lv-card h3{font-family:Unbounded,sans-serif;font-size:15px;font-weight:700;margin:0}
.live .lv-plan .r{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;background:none;border:0;padding:0;font:inherit;font-size:13px;text-align:left;color:#0A0A09}
.live .lv-plan .r .n{width:16px}
.live .lv-plan .r .t{flex:1}
.live .lv-plan .r small{font-size:11px;color:#6B6C64}
.live .lv-plan .r.done{color:#6B6C64}
.live .lv-plan .r.done .t{text-decoration:line-through}
.live .lv-plan .r.cur{color:#5B6B0A}
.live .lv-plan .r.skip .t{text-decoration:line-through;opacity:.6}
.live .lv-notes textarea{min-height:90px;border-radius:10px;background:#F7F7F2;border:1px solid rgba(17,18,14,.09);padding:10px;font:inherit;font-size:13px;resize:vertical;color:#0A0A09}
.live .lv-qs{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:10px}
.live .lv-qs li{position:relative;background:#F7F7F2;border-left:4px solid #D2E739;border-radius:10px;padding:12px 40px 12px 16px;font-size:18px}
.live .lv-qs li button{all:unset;cursor:pointer;position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#A8AAA4;font-size:13px}
.live .lv-it h2{font-family:Unbounded,sans-serif;font-size:24px;margin:0 0 10px}
.live .lv-it .oc{color:#6B6C64;font-style:italic;margin:0 0 12px}
.live .lv-it ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.live .lv-it ul li{background:#F7F7F2;border-radius:10px;padding:9px 14px;font-weight:600}
@media (max-width:1000px){ .live .lv-body{flex-direction:column} .live aside.lv-side{width:100%} }

/* Модалки (светлые) */
.ws-bg{position:fixed;inset:0;background:rgba(10,10,9,.28);z-index:55;display:none}
.ws-bg.open{display:block}
.ws-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:92vh;overflow:auto;z-index:56;display:none;flex-direction:column;gap:14px;border-radius:24px;padding:24px;background:rgba(255,255,255,.96);box-shadow:0 30px 80px rgba(17,18,14,.25);border:1px solid rgba(17,18,14,.09)}
.ws-modal.open{display:flex}
.ws-modal h2{font-family:Unbounded,sans-serif;font-size:20px;font-weight:700;margin:0;display:flex;justify-content:space-between;align-items:center}
.ws-modal h2 button{all:unset;cursor:pointer;color:#6B6C64;display:flex}
.ws-seg{display:flex;padding:3px;border-radius:12px;background:#F7F7F2;border:1px solid rgba(17,18,14,.09);gap:3px}
.ws-seg button{flex:1;height:34px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:600;cursor:pointer}
.ws-seg button.on{background:#D2E739}
.ws-hint{font-size:13px;color:#6B6C64;margin:0}
.ws-radio{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#F7F7F2;border:1px solid rgba(17,18,14,.09);cursor:pointer;text-align:left;font:inherit;width:100%}
.ws-radio.on{border-color:#D2E739;background:rgba(210,231,57,.2);box-shadow:inset 0 0 0 1px #D2E739}
.ws-radio .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #6B6C64;flex:none;position:relative}
.ws-radio.on .dot{border-color:#0A0A09}
.ws-radio.on .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0A0A09}
.ws-radio b{font-size:13px;font-weight:600;display:block}
.ws-radio small{font-size:11px;color:#6B6C64}
.ws-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ws-fields.one{grid-template-columns:1fr}
.ws-fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6B6C64}
.ws-fields input,.ws-fields select,.ws-fields textarea{height:40px;border-radius:10px;border:1px solid rgba(17,18,14,.09);background:#F7F7F2;padding:0 12px;font:inherit;font-size:14px;color:#0A0A09;text-transform:none;letter-spacing:0;font-weight:400;min-width:0}
.ws-fields textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.ws-suggest{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:rgba(210,231,57,.38);font-size:13px}
.ws-mfoot{display:flex;justify-content:flex-end;gap:10px}

/* Library */
.ws-lib-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.ws-lib-head h1{font-family:Unbounded,sans-serif;font-size:26px;font-weight:700;margin:0 0 4px}
.ws-lib-head p{font-size:14px;color:#6B6C64;margin:0}
.ws-lib-search{display:flex;align-items:center;gap:10px;height:44px;width:min(420px,100%);padding:0 16px;border-radius:12px;box-sizing:border-box}
.ws-lib-search input{border:0;background:none;outline:none;flex:1;font:inherit;font-size:14px}
.ws-lib{display:flex;gap:18px;align-items:flex-start}
.ws-filters{width:230px;flex-shrink:0;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ws-filters .lb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6C64}
.ws-filters hr{border:0;height:1px;background:rgba(17,18,14,.09);margin:0}
.ws-check{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;background:none;border:0;padding:0;font:inherit;font-size:13px;text-align:left}
.ws-check i{width:18px;height:18px;border-radius:5px;border:1.5px solid #6B6C64;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none}
.ws-check.on i{border-color:#0A0A09;background:#D2E739}
.ws-lvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ws-pill{height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(17,18,14,.09);background:rgba(255,255,255,.85);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.ws-pill.on{background:#D2E739}
.ws-wrap{display:flex;gap:6px;flex-wrap:wrap}
.ws-reset{font-size:13px;color:#6B6C64;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit;font-size:13px}
.ws-libmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.ws-sortrow{display:flex;align-items:center;gap:8px;font-size:13px;color:#6B6C64}
.ws-sortrow .sp{flex:1}
.ws-sortrow button{background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:#0A0A09;cursor:pointer}
.ws-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1200px){ .ws-cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){ .ws-lib{flex-direction:column} .ws-filters{width:100%} .ws-cards{grid-template-columns:1fr} }
.ws-card{border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.ws-card .top{height:64px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start}
.ws-card .ic{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center}
.ws-card .star{all:unset;cursor:pointer;display:flex;color:#0A0A09}
.ws-card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.ws-card .ty{font-size:12px;color:#6B6C64}
.ws-card .nm{font-family:Unbounded,sans-serif;font-size:14px;font-weight:700}
.ws-card .mt{display:flex;align-items:center;gap:8px;font-size:12px;color:#6B6C64;flex-wrap:wrap}
.ws-card .mt b{padding:2px 8px;border-radius:6px;border:1px solid rgba(17,18,14,.09);font-size:11px;color:#0A0A09}
.ws-card .mt .sp{flex:1}
.ws-card .addb{height:30px;padding:0 12px;border-radius:999px;border:0;background:#D2E739;color:#0A0A09;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.ws-drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:57;background:rgba(255,255,255,.97);box-shadow:-20px 0 60px rgba(17,18,14,.15);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;overflow:auto;padding:22px;gap:14px}
.ws-drawer.open{transform:none}
.ws-drawer .pill{align-self:flex-start;padding:3px 10px;border-radius:999px;background:#E9F59E;font-size:11px;font-weight:700}
.ws-drawer .hdr{display:flex;align-items:center;gap:10px}
.ws-drawer .hdr .sp{flex:1}
.ws-drawer .hdr button{all:unset;cursor:pointer;display:flex}
.ws-drawer h2{font-family:Unbounded,sans-serif;font-size:22px;margin:0}
.ws-drawer .prev{border-radius:16px;background:#F7F7F2;border:1px solid rgba(17,18,14,.09);padding:16px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5}
.ws-drawer .prev ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ws-drawer .prev li{background:#fff;border-radius:8px;padding:7px 10px;font-weight:600;font-size:13px}
.ws-drawer .lb{font-size:12px;font-weight:700}
.ws-drawer .addbox{margin-top:auto;border-radius:16px;border:1px solid rgba(17,18,14,.09);padding:12px;display:flex;flex-direction:column;gap:6px}
.ws-drawer .addbox .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6C64}
.ws-drawer .addrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.ws-drawer .addrow:hover,.ws-drawer .addrow.first{background:rgba(210,231,57,.38)}
.ws-drawer .addrow span{flex:1}
.ws-dbg{position:fixed;inset:0;background:rgba(10,10,9,.2);z-index:56;display:none}
.ws-dbg.open{display:block}

/* Reports */
.ws-rep{display:flex;gap:18px;align-items:flex-start}
.ws-rep-l{flex:1;min-width:0}
.ws-rep-tbl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ws-rep-cols,.ws-rep-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 70px 60px 110px;gap:10px;align-items:center;padding:0 14px}
.ws-rep-cols{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6B6C64;margin-top:12px}
.ws-rep-row{padding:12px 14px;border-radius:14px;cursor:pointer;font-size:13px;text-align:left;font:inherit;font-size:13px;width:100%;color:#0A0A09}
.ws-rep-row.sel{border:1px solid #D2E739;box-shadow:inset 0 0 0 1px #D2E739}
.ws-rep-row b{font-size:14px}
.ws-rep-row .mu{color:#6B6C64}
.ws-rep-row .lvl{padding:2px 8px;border-radius:6px;border:1px solid rgba(17,18,14,.09);background:#fff;font-size:11px;font-weight:700;justify-self:start}
.ws-badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;justify-self:start}
.ws-badge.draft{background:rgba(242,184,75,.22);color:#B7791F}
.ws-badge.sent{background:rgba(210,231,57,.38);color:#0A0A09}
.ws-rep-d{width:360px;flex-shrink:0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
.ws-rep-d .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6B6C64}
.ws-rep-d h2{font-family:Unbounded,sans-serif;font-size:20px;margin:0}
.ws-rep-d .sub{font-size:13px;color:#6B6C64;margin-top:-8px}
.ws-rep-d .sec{border-top:1px solid rgba(17,18,14,.09);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.ws-rep-d .sec .lb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6C64}
.ws-rep-d .sec div.v{font-size:14px;line-height:1.5}
.ws-rep-d .btns{display:flex;gap:10px}
.ws-rep-d .btns>*{flex:1;justify-content:center}
@media (max-width:1000px){ .ws-rep{flex-direction:column} .ws-rep-d{width:100%;position:static} .ws-rep-cols{display:none} .ws-rep-row{grid-template-columns:1fr 1fr} }

/* Отчёт (шаг Report) */
.ws-report{display:flex;gap:16px;align-items:flex-start}
.ws-report-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.ws-rsec{border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ws-rsec h3{font-family:Unbounded,sans-serif;font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.ws-rsec h3 i{width:22px;height:22px;border-radius:50%;background:#D2E739;font-size:11px;display:flex;align-items:center;justify-content:center;font-style:normal}
.ws-rsec textarea{min-height:84px;border-radius:12px;background:#F7F7F2;border:1px solid rgba(17,18,14,.09);padding:12px;font:inherit;font-size:14px;resize:vertical}
.ws-rside{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
@media (max-width:1000px){ .ws-report{flex-direction:column} .ws-rside{width:100%} }
.gl-today{border-radius:20px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.gl-today-lbl{font-family:Unbounded,sans-serif;font-size:11px;color:#6B6C64;text-transform:uppercase;letter-spacing:.04em;flex:none}
.gl-today-list{display:flex;flex-wrap:wrap;gap:10px;flex:1}
.gl-today-item{display:flex;align-items:center;gap:10px;background:rgba(215,239,66,.25);border:1px solid rgba(157,178,26,.3);border-radius:100px;padding:6px 8px 6px 16px}
.gl-today-item .t{font-family:Unbounded,sans-serif;font-size:13px;font-weight:700}
.gl-today-item .n{font-size:13px;color:#3A3B33}
.gl-today-add{border:0;background:#0A0A09;color:#D7EF42;border-radius:100px;padding:6px 14px;font-family:Unbounded,sans-serif;font-size:11.5px;font-weight:700;cursor:pointer}
@media (max-width:760px){ .gl-steps{flex-direction:column;align-items:stretch} .gl-step{flex:none} .gl-hero-btn{width:100%;justify-content:center} }
main.page{padding:26px 28px 70px;max-width:1240px;margin:0 auto}
@media (min-width:1300px){ main.page{padding:30px 40px 80px} }
.page-title{font-family:Unbounded,sans-serif;font-size:26px;font-weight:700;margin:0 0 4px}
.page-sub{color:var(--ink-3);margin:0 0 20px;font-size:14.5px;max-width:70ch}
.h-sec{font-family:Unbounded,sans-serif;font-size:16px;font-weight:700;margin:30px 0 12px}

/* мобильная навигация: липкая верхняя полоска */
.mobile-top{display:none}
@media (max-width:900px){
  .sidebar{display:none}
  .mobile-top{display:block;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .mobile-top .mt-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
  .mobile-top nav{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
  .mobile-top nav::-webkit-scrollbar{display:none}
  .mobile-top .nav-btn{width:auto;flex:none;border:1.5px solid var(--line);border-radius:100px;padding:6px 12px;font-size:13px}
  .mobile-top .nav-btn .nc{display:none}
  main.page{padding:18px 16px 60px}
  .page-title{font-size:21px}
}

/* ---------- общие элементы ---------- */
.btn{font-family:Unbounded,sans-serif;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:100px;padding:9px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);transition:transform .15s ease,background .15s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--dark)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.star{border:1.5px solid var(--line);background:#fff;border-radius:100px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:16px;flex:none;transition:.15s}
.star:hover{border-color:var(--ink)}
.star.on{background:var(--accent);border-color:var(--accent)}
.muted{color:var(--ink-3);font-size:13px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:var(--panel);color:var(--ink-2);white-space:nowrap}
.lv-A0A1{background:#EAF3FF;color:#1D5FA5}
.lv-A2{background:#EAF7E5;color:#3B7A1E}
.lv-B1{background:#FFF4DE;color:#96650B}
.lv-B2{background:#F1EAFB;color:#6B3FA0}
.lv-C1{background:#FBEAEA;color:var(--red)}
.tag{font-size:12px;color:var(--ink-3);font-weight:600}
.empty{text-align:center;padding:36px 20px;color:var(--ink-3);font-size:14px;border:1.5px dashed var(--line);border-radius:var(--r)}
.notice{background:#FFF4DE;color:#7A520A;border-radius:14px;padding:12px 16px;font-size:13.5px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}

/* hero-карточки как в кабинете */
.hero-cards{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:16px}
@media (max-width:680px){ .hero-cards{grid-template-columns:1fr} }
.hero-card{border-radius:16px;padding:22px;min-height:110px;display:flex;flex-direction:column}
.hc-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.hc-value{font-family:Unbounded,sans-serif;font-weight:800;font-size:17px;margin-top:auto;padding-top:16px;line-height:1.3}
.hc-note{font-size:13px;margin-top:6px;opacity:.72}
.hc-dark{background:var(--dark);color:#fff}
.hc-dark .hc-value{color:var(--accent)}
.hc-light{background:#fff;border:1px solid var(--line)}
.hc-lime{background:var(--accent)}
.hero-card .btn{align-self:flex-start;margin-top:12px}
.goal-hero{background:var(--dark);color:#fff;border-radius:22px;padding:clamp(22px,4vw,40px);margin-bottom:16px}
.goal-hero .hc-label{color:rgba(255,255,255,.65)}
.goal-hero blockquote{margin:14px 0 0;font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(20px,3vw,32px);line-height:1.25;color:var(--accent);max-width:28ch}
.stats{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){ .stats{grid-template-columns:repeat(2,1fr)} }
@media (max-width:420px){ .stats{grid-template-columns:1fr} }
.stat{background:var(--panel);border-radius:16px;padding:18px}
.stat .si{font-size:22px}
.stat b{display:block;font-family:Unbounded,sans-serif;font-size:14px;margin:8px 0 4px}
.stat p{margin:0;font-size:13.5px;color:var(--ink-2)}

/* разделы на дашборде */
.sec-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;text-decoration:none;transition:border-color .15s,transform .15s}
.sec-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.sec-card .si{font-size:26px}
.sec-card h3{margin:6px 0 0;font-size:15px}
.sec-card p{margin:0;color:var(--ink-2);font-size:13.5px}
.sec-card .cnt{margin-top:auto;padding-top:10px;font-size:12px;font-weight:700;color:var(--ink-3)}

/* опыт ученика */
.journey{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.jstep{border-radius:16px;padding:20px;background:var(--panel);position:relative}
.jstep:nth-child(2){background:var(--accent-soft)}
.jstep:nth-child(3){background:var(--accent)}
.jstep .at{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.jstep .feel{font-family:Unbounded,sans-serif;font-weight:700;font-size:16px;margin-top:10px;line-height:1.3}

/* ---------- FilterBar ---------- */
.filterbar{border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;background:#fff;margin-bottom:16px}
.fb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb-lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);width:100%;margin-bottom:-2px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:100px;padding:7px 14px;font-weight:600;font-size:13.5px;transition:.15s}
.pill:hover{border-color:var(--ink)}
.pill.lv{font-family:Unbounded,sans-serif;font-weight:700;font-size:12.5px}
.pill small{font-family:'Golos Text',sans-serif;font-weight:500;opacity:.65;margin-left:4px}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.soft[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--dark)}
.fb-search{display:flex;gap:8px;align-items:center}
.search{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;font-size:15px;background:#fff;min-width:0}
.search:focus{outline:none;border-color:var(--ink)}
.result-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}

/* ---------- LessonCard / ActivityCard / GrammarCard ---------- */
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.card:hover{border-color:rgba(28,28,28,.3)}
.card-top{display:flex;align-items:center;gap:8px}
.card-top .grow{flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.card h3 .ic{font-size:22px;line-height:1}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:hover{text-decoration:underline;text-underline-offset:3px}
.outcome{margin:0;font-size:14px;color:var(--ink-2);font-style:italic}
.lead{font-size:13.5px;background:var(--panel);border-radius:12px;padding:9px 12px}
.lead b,.kv b{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);display:block;font-style:normal}
.kv{font-size:13.5px}
.phrases{margin:0;padding:12px 14px;list-style:none;background:var(--panel);border-radius:12px;display:grid;gap:4px;font-weight:500;font-size:14px}
.phrases li::before{content:"› ";color:var(--ink-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.mistakes{display:grid;gap:6px}
.mistake{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13.5px}
.mistake .bad{color:var(--red);text-decoration:line-through;text-decoration-color:rgba(209,75,63,.45)}
.mistake .good{font-weight:600;background:#EAF7E5;border-radius:8px;padding:3px 8px}
@media (max-width:520px){ .mistake{grid-template-columns:1fr} .mistake .arr{display:none} }

/* ---------- TimelineBlock ---------- */
.timeline{display:grid;gap:0;position:relative}
.tl{display:grid;grid-template-columns:92px 1fr;gap:18px;position:relative;padding-bottom:18px}
.tl::before{content:"";position:absolute;left:45px;top:44px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl-time{justify-self:center;background:var(--dark);color:var(--accent);font-family:Unbounded,sans-serif;font-weight:700;font-size:12.5px;border-radius:100px;padding:8px 12px;height:max-content;white-space:nowrap;position:relative;z-index:1}
.tl-body{border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;background:#fff}
.tl-body h3{margin:0 0 4px;font-size:16px}
.tl-body > p{margin:0 0 12px;color:var(--ink-2)}
.tl-bar{height:6px;border-radius:6px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.tl-bar span{display:block;height:100%;background:var(--accent)}
.tl-groups{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tl-group{background:var(--panel);border-radius:12px;padding:12px 14px}
.tl-group b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.tl-group ul{margin:6px 0 0;padding-left:18px}
.tl-group li{margin:2px 0}
.tl-example{margin-top:14px}
@media (max-width:600px){ .tl{grid-template-columns:1fr;gap:8px} .tl::before{display:none} .tl-time{justify-self:start} }

/* ---------- TeacherChecklist ---------- */
.checklist{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cl-group{border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px}
.cl-group h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.cl-item{display:flex;gap:12px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.cl-item:first-of-type{border-top:0}
.cl-item input{appearance:none;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:7px;display:grid;place-items:center;flex:none;margin:0;cursor:pointer}
.cl-item input:checked{background:var(--accent);border-color:var(--accent)}
.cl-item input:checked::after{content:"✓";font-weight:700;font-size:14px}
.cl-item input:checked + span{color:var(--ink-3);text-decoration:line-through}
.progress{height:8px;border-radius:8px;background:var(--panel);overflow:hidden;margin:6px 0 18px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ---------- ResourceCard ---------- */
.res{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.res .ri{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--panel);display:grid;place-items:center;flex:none}
.res h3{margin:0 0 4px;font-size:14.5px}
.res p{margin:0 0 10px;font-size:13.5px;color:var(--ink-2)}

/* ---------- боковая панель карточки (drawer) ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(9,10,9,.35);z-index:45;display:none}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:46;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.drawer-head{display:flex;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-head .grow{flex:1}
.drawer-body{overflow:auto;padding:20px 22px 40px;display:grid;gap:16px;align-content:start}
.drawer-body h2{margin:0;font-size:22px;line-height:1.25}
.drawer-body .ic{font-size:40px;line-height:1}
.field-row{display:grid;gap:4px}
.field-row > b{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#B3261E}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:100px;padding:5px 12px;font-size:13px;font-weight:500}

/* show mode — мини-урок */
.show{position:fixed;inset:0;background:var(--panel);z-index:50;display:none;flex-direction:column}
.show.open{display:flex}
.show-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.show-bar .grow{flex:1}
.clock{font-family:Unbounded,sans-serif;font-size:13px;font-weight:600;background:var(--panel);border-radius:999px;padding:6px 12px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--line)}
.steps::-webkit-scrollbar{display:none}
.stp{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.stp.done{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.stp.cur{background:var(--ink);color:var(--accent);border-color:var(--ink)}
.show-scroll{flex:1;overflow:auto}
.show-body{max-width:1100px;margin:0 auto;padding:clamp(18px,4vw,40px) 20px 32px;font-size:clamp(17px,1.9vw,22px)}
.step{display:none}
.step.cur{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-family:Unbounded,sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px}
.show h2{font-size:clamp(26px,4.4vw,52px);line-height:1.1;margin:0 0 16px;font-weight:700}
.show-ic{font-size:clamp(52px,8vw,96px);line-height:1;margin-bottom:10px}
.show-idea{font-size:clamp(18px,2.3vw,28px);color:var(--ink-2);margin:0 0 24px;max-width:42ch}
.show-phrases{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.show-phrases li{font-size:clamp(20px,3vw,38px);font-weight:600;background:var(--card);border-left:8px solid var(--accent);border-radius:14px;padding:10px 20px;line-height:1.25}
.show-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--card)}
.show-foot .btn{padding:10px 20px;font-size:15px}

/* разминка / говорим */
.bubbles{display:grid;gap:14px}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:18px 24px;font-size:clamp(22px,3.2vw,40px);font-weight:600;border:1.5px solid var(--line);max-width:900px}
.bubble:nth-child(even){justify-self:end;border-radius:22px 22px 6px 22px;background:var(--accent-soft);border-color:var(--accent)}
.speak{display:grid;gap:14px}
.speak-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.speak-card .q{font-size:clamp(19px,2.4vw,28px);font-weight:600}
.speak-card .h{color:var(--ink-2);grid-column:1}
.speak-card .h::before{content:""}
.timer{grid-row:1 / span 2;grid-column:2;font-family:Unbounded,sans-serif;font-weight:600;border:1.5px solid var(--ink);border-radius:999px;padding:10px 16px;background:transparent;min-width:96px}
.timer.run{background:var(--accent)}
.timer.over{background:var(--ink);color:var(--accent)}
@media (max-width:600px){ .speak-card{grid-template-columns:1fr} .timer{grid-row:auto;grid-column:1;justify-self:start} }

/* схемы */
.note{margin-top:18px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:.92em}
.note::before{content:""}
.v-compare{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.v-col{background:var(--card);border-radius:var(--r);padding:18px 20px;border-top:8px solid var(--accent)}
.v-col:nth-child(2){border-top-color:var(--ink)}
.v-col .ic{font-size:2.2em;line-height:1}
.v-col h4{font-family:Unbounded,sans-serif;font-size:1em;margin:8px 0 2px}
.v-col .sub{color:var(--ink-3);font-size:.85em;margin-bottom:10px}
.v-col ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.v-col li{background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:600}
.v-formula{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.v-part{flex:1 1 160px;background:var(--card);border-radius:var(--r);padding:14px 16px;position:relative;border:1.5px solid var(--line)}
.v-part:nth-child(odd){background:var(--accent-soft);border-color:var(--accent)}
.v-part b{font-family:Unbounded,sans-serif;font-size:.8em;display:block;color:var(--ink-2);margin-bottom:4px}
.v-part span{font-weight:600;font-size:1.1em}
.v-scale{display:grid;gap:8px;border-left:10px solid;border-image:linear-gradient(var(--accent-soft),var(--ink)) 1;padding-left:16px}
.v-step{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;background:var(--card);border-radius:12px;padding:10px 16px}
.v-step b{font-size:1.15em;min-width:9em}
.v-step span{color:var(--ink-2)}
.v-up{display:grid;gap:10px}
.v-up-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.v-up-row .from{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.v-up-row .arr{font-size:1.3em}
.v-up-row .to{background:var(--accent);border-radius:12px;padding:8px 14px;font-weight:600}
@media (max-width:600px){ .v-up-row{grid-template-columns:1fr} .v-up-row .arr{display:none} }
.v-table{display:grid;gap:8px}
.v-row{display:grid;grid-template-columns:2.2em 1fr 1fr;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:10px 16px}
.v-row .e{font-size:1.5em}
.v-row :nth-child(2){font-weight:600}
.v-row :nth-child(3){color:var(--ink-2)}
@media (max-width:600px){ .v-row{grid-template-columns:2em 1fr} .v-row :nth-child(3){grid-column:2} }

/* задания */
.task-score{display:inline-block;margin-left:10px;font-family:'Golos Text',sans-serif;text-transform:none;letter-spacing:0;background:var(--accent);color:var(--ink);border-radius:999px;padding:2px 10px}
.items{display:grid;gap:12px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;transition:border-color .2s}
.item.ok{border-color:#7FB800}
.item .pic{font-size:1.9em;grid-row:span 2}
.item .q{font-weight:600}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--ink-3);text-align:center;color:var(--ink-3)}
.gap.filled{border-color:#7FB800;color:var(--ink);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--ink);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.95em}
.opt:hover:not(:disabled){background:var(--accent-soft)}
.opt.right{background:#C8EA7A;border-color:#7FB800}
.opt.wrong{background:#FBD9D5;border-color:#D9534F;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.build{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;gap:10px}
.build.ok{border-color:#7FB800}
.build.bad{border-color:#D9534F}
.line{min-height:52px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px;align-items:center}
.build.ok .line{border-bottom-color:#7FB800}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.w{border:1.5px solid var(--ink);background:var(--accent-soft);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.95em}
.line .w{background:var(--card)}
.build.ok .w{background:#C8EA7A;border-color:#7FB800;cursor:default}
.build-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ink-3);text-decoration:underline;font-size:.8em;padding:0}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-col{display:grid;gap:10px;align-content:start}
.m{border:1.5px solid var(--ink);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;text-align:left;font-size:.95em}
.m.sel{background:var(--accent);}
.m.done{background:#C8EA7A;border-color:#7FB800;opacity:.75;cursor:default}
.m.wrong{background:#FBD9D5;border-color:#D9534F;animation:shake .35s}
.reveal{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.reveal .q{font-weight:600}
.reveal .a{width:100%;background:var(--accent-soft);border-radius:10px;padding:8px 14px;font-weight:600;display:none}
.reveal.open .a{display:block;animation:fadein .25s}
.result-big{font-family:Unbounded,sans-serif;font-size:clamp(24px,4vw,46px);line-height:1.2;background:var(--accent);border-radius:var(--r);padding:clamp(18px,3vw,32px);margin:0 0 20px}
.result-big::before{content:"✓ ";}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#B3261E}
/* активности */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.big-q{font-size:clamp(22px,3.2vw,38px);font-weight:600;margin:0 0 16px;line-height:1.25}
.helper{margin-top:22px;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:10px 16px;color:var(--ink-2);font-size:.9em}
.play-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.play-row .muted{margin-right:auto}
.timer.big{font-size:1.2em;padding:14px 24px}
.facts{display:grid;gap:12px}
.fact{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 20px;text-align:left;font-size:clamp(18px,2.4vw,28px);font-weight:600}
.fact .n{font-family:Unbounded,sans-serif;background:var(--ink);color:var(--accent);border-radius:50%;width:1.8em;height:1.8em;display:grid;place-items:center;font-size:.7em}
.fact .t[contenteditable]{min-height:1.4em;outline:none;border-bottom:2px dashed var(--line)}
.fact .t[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-3)}
.fact .verdict{font-family:Unbounded,sans-serif;font-size:.7em}
.fact.truth{border-color:#7FB800;background:#EEF8D8}
.fact.lie{border-color:#D9534F;background:#FBE3E0}
.fact.guess{border-color:var(--ink);background:var(--accent-soft)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.vs-opt{border:2px solid var(--ink);background:var(--card);border-radius:var(--r);padding:clamp(18px,3vw,36px);font-size:clamp(20px,2.8vw,34px);font-weight:600;line-height:1.2}
.vs-opt:hover{background:var(--accent-soft)}
.vs-opt.picked{background:var(--accent)}
.vs-or{align-self:center;font-family:Unbounded,sans-serif;font-weight:700;font-size:1.2em}
@media (max-width:600px){ .vs{grid-template-columns:1fr} .vs-or{justify-self:center} }
.rank{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.rank-item{display:flex;gap:14px;align-items:center;border:1.5px solid var(--ink);background:var(--card);border-radius:14px;padding:12px 18px;font-size:clamp(19px,2.4vw,28px);font-weight:600;text-align:left}
.rank-item .pos{font-family:Unbounded,sans-serif;width:1.7em;height:1.7em;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:.8em}
.rank-item.on{background:var(--accent-soft)}
.rank-item.on .pos{background:var(--ink);color:var(--accent);border:0}
.sit-card{background:var(--ink);color:#fff;border-radius:var(--r);padding:clamp(20px,4vw,40px)}
.sit-card p{font-size:clamp(22px,3.4vw,42px);font-weight:600;margin:10px 0 18px;line-height:1.2}
.sit-lbl{color:var(--accent);font-family:Unbounded,sans-serif;font-size:.9em}
.sit-role{display:inline-block;background:var(--accent);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85em}
.pic-grid{display:grid;gap:20px}
@media (min-width:900px){ .pic-grid{grid-template-columns:1.2fr 1fr;align-items:start} }
.scene{background:linear-gradient(#E8F4FF,#FFF8E6);border-radius:var(--r);border:1.5px solid var(--line);padding:clamp(16px,3vw,32px);text-align:center;font-size:clamp(40px,7vw,78px);line-height:1.35;display:grid;gap:4px}
.scene div{letter-spacing:.12em}
.pic-grid .bubble{font-size:clamp(18px,2.2vw,26px)}
.clues{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.clue{border:2px dashed var(--ink);background:var(--card);border-radius:var(--r);padding:22px;font-size:clamp(18px,2.2vw,26px);font-weight:600;min-height:110px}
.clue:not(.open){color:var(--ink-3)}
.clue.open{border-style:solid;background:var(--accent-soft);cursor:default;animation:fadein .3s}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side{border-radius:var(--r);padding:18px;display:grid;gap:12px;justify-items:start}
.side h4{margin:0;font-family:Unbounded,sans-serif;font-size:1.1em}
.side.for{background:#EEF8D8;border:1.5px solid #7FB800}
.side.against{background:#FBE3E0;border:1.5px solid #D9534F}
.side .timer{grid-row:auto;grid-column:auto}
@media (max-width:600px){ .sides{grid-template-columns:1fr} }
.exit{display:grid;gap:14px;margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.exit-box{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.exit-box input{font:inherit;border:0;border-bottom:2px solid var(--line);padding:6px 2px;background:transparent;min-width:0}
.exit-box input:focus{outline:none;border-color:var(--accent)}
.exit-mini{background:var(--card);border:1.5px dashed var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:18px}
.exit-mini b{margin-right:8px}

.fw{display:grid;gap:10px}
.fw-row{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;flex-wrap:wrap}
.fw-t{flex:1;min-width:200px;font-size:clamp(18px,2.2vw,26px);font-weight:600}
.fw-row.yes{border-color:#7FB800;background:#EEF8D8}
.fw-row.no{border-color:#D9534F;background:#FBE3E0}
.op-scale{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:600px){ .op-scale{grid-template-columns:1fr} }

/* =====================================================================
   КОНСТРУКТОР УРОКА + РЕЖИМ УРОКА + ОТЧЁТ — тёмная неоновая тема
   поверх общей светлой библиотеки (намеренный контраст: это "кабина
   пилота" для учителя, а не то, что видит ученик при показе экрана).
   ===================================================================== */
.yb{
  --yb-accent:var(--accent); --yb-accent2:#8FE000;
  --yb-ink:#F6F8EC; --yb-ink2:rgba(246,248,236,.74); --yb-ink3:rgba(246,248,236,.52);
  --yb-card:rgba(255,255,255,.055); --yb-card-hov:rgba(255,255,255,.09); --yb-line:rgba(255,255,255,.14);
  background:
    radial-gradient(1100px circle at 12% -12%, rgba(215,239,66,.20), transparent 58%),
    radial-gradient(800px circle at 102% 4%, rgba(143,224,0,.14), transparent 55%),
    linear-gradient(180deg,#0A0C06 0%,#10120A 100%);
  color:var(--yb-ink);
  border-radius:24px;
}
.yb h1,.yb h2,.yb h3,.yb h4{color:var(--yb-ink)}
.yb .muted,.yb p{color:var(--yb-ink2)}
.yb-glow{text-shadow:0 0 22px rgba(215,239,66,.45)}
.yb-card{background:var(--yb-card);border:1.5px solid var(--yb-line);border-radius:18px;backdrop-filter:blur(2px)}
.yb-btn{font-family:Unbounded,sans-serif;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:100px;padding:10px 18px;border:1.5px solid var(--yb-line);background:rgba(255,255,255,.04);color:var(--yb-ink);transition:transform .15s,background .15s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.yb-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}
.yb-btn.on{background:var(--yb-accent);border-color:var(--yb-accent);color:#0A0C06;box-shadow:0 0 24px rgba(215,239,66,.45)}
.yb-btn.on:hover{box-shadow:0 0 32px rgba(215,239,66,.6)}
.yb-btn.danger{border-color:rgba(255,107,91,.5);color:#FF9D8F}
.yb-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* --- Dashboard: CTA + недавние уроки --- */
.yb-hero{padding:clamp(24px,4vw,42px);margin-bottom:18px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.yb-hero-txt{max-width:46ch}
.yb-hero-txt .tag{color:var(--yb-accent);font-family:Unbounded,sans-serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.yb-hero-txt h2{font-size:clamp(22px,3vw,32px);margin:8px 0 6px;line-height:1.2}
.yb-recent{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-bottom:8px}
.yb-rc{padding:16px 18px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.yb-rc:hover{background:var(--yb-card-hov)}
.yb-rc .nm{font-family:Unbounded,sans-serif;font-size:14px}
.yb-rc .meta{font-size:12px;color:var(--yb-ink3)}
.yb-rc .st{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px}
.yb-rc .st.draft{background:rgba(255,255,255,.1);color:var(--yb-ink2)}
.yb-rc .st.done{background:var(--yb-accent);color:#0A0C06}

/* --- Builder: форма ученика + таймлайн блоков --- */
.yb-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;align-items:start}
@media (max-width:900px){ .yb-grid{grid-template-columns:1fr} }
.yb-field{display:grid;gap:5px;margin-bottom:12px}
.yb-field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--yb-ink3)}
.yb-field input,.yb-field select,.yb-field textarea{font:inherit;font-size:14.5px;background:rgba(255,255,255,.06);border:1.5px solid var(--yb-line);border-radius:12px;padding:10px 13px;color:var(--yb-ink);min-width:0}
.yb-field select option{background:#14160D;color:#F6F8EC}
.yb-field textarea{resize:vertical;min-height:60px}
.yb-field input::placeholder,.yb-field textarea::placeholder{color:var(--yb-ink3)}
.yb-field input:focus,.yb-field select:focus,.yb-field textarea:focus{outline:none;border-color:var(--yb-accent)}
.yb-blocks{display:grid;gap:10px}
.yb-block{padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:grab}
.yb-block.dragging{opacity:.4}
.yb-block .gh{color:var(--yb-ink3);font-size:16px;cursor:grab;user-select:none}
.yb-block .kind{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--yb-accent)}
.yb-block .ttl{font-family:Unbounded,sans-serif;font-size:14px;margin-top:2px}
.yb-block .dur{font-size:12px;color:var(--yb-ink3);margin-top:2px}
.yb-block .acts{display:flex;gap:4px}
.yb-block .acts button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--yb-ink2);font-size:13px}
.yb-block .acts button:hover{background:rgba(255,255,255,.1)}
.yb-add-row{display:flex;justify-content:center;padding:4px 0}
.yb-empty{border:1.5px dashed var(--yb-line);border-radius:16px;padding:24px;text-align:center;color:var(--yb-ink3);font-size:13.5px}

/* --- модалка выбора материала --- */
.yb-modal-bg{position:fixed;inset:0;background:rgba(5,6,3,.6);z-index:55;display:none}
.yb-modal-bg.open{display:block}
.yb-modal{position:fixed;top:4vh;left:50%;transform:translateX(-50%);width:min(760px,92vw);max-height:92vh;z-index:56;display:none;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.yb-modal.open{display:flex}
.yb-modal.yb{background:radial-gradient(900px circle at 10% -10%, rgba(215,239,66,.18), transparent 58%),linear-gradient(165deg,#0E1009 0%,#12140A 100%)}
.yb-modal-head{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--yb-line)}
.yb-modal-head input{flex:1;font:inherit;font-size:14.5px;background:rgba(255,255,255,.06);border:1.5px solid var(--yb-line);border-radius:12px;padding:9px 13px;color:var(--yb-ink)}
.yb-modal-tabs{display:flex;gap:6px;padding:10px 18px 0}
.yb-modal-body{overflow:auto;padding:14px 18px 20px;display:grid;gap:8px}
.yb-pick{padding:11px 14px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;background:rgba(255,255,255,.03)}
.yb-pick:hover{background:var(--yb-card-hov)}
.yb-pick .ic{font-size:19px}
.yb-pick .grow{flex:1;min-width:0}
.yb-pick .t{font-weight:600;font-size:13.5px}
.yb-pick .s{font-size:11.5px;color:var(--yb-ink3)}


/* --- отчёт о пробном --- */
.yb-report{max-width:640px;margin:0 auto;width:100%}
.yb-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.yb-chip{background:rgba(255,255,255,.07);border:1px solid var(--yb-line);border-radius:100px;padding:6px 14px;font-size:13px;display:flex;align-items:center;gap:6px}
.yb-chip button{all:unset;cursor:pointer;color:var(--yb-ink3);font-size:12px}
.yb-fmt{display:flex;gap:8px}
.yb-fmt button{flex:1}

/* --- "Сегодня у вас" — пробные текущего учителя, если он залогинен в этом браузере --- */
.yb-today{padding:16px 20px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.yb-today-lbl{font-family:Unbounded,sans-serif;font-size:12px;color:var(--yb-accent);text-transform:uppercase;letter-spacing:.04em;flex:none}
.yb-today-list{display:flex;flex-wrap:wrap;gap:10px;flex:1}
.yb-today-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--yb-line);border-radius:100px;padding:6px 8px 6px 16px}
.yb-today-item .t{font-family:Unbounded,sans-serif;font-size:13px}
.yb-today-item .n{font-size:13px;color:var(--yb-ink2)}

/* --- доработки: меню блока, обязательные блоки, превью, звезда --- */
.ws-menu{position:fixed;z-index:80;min-width:190px;background:rgba(255,255,255,.98);border:1px solid rgba(17,18,14,.09);border-radius:12px;box-shadow:0 18px 40px rgba(17,18,14,.18);padding:6px;display:flex;flex-direction:column}
.ws-menu button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600}
.ws-menu button:hover{background:rgba(210,231,57,.38)}
.ws-menu button.danger{color:#B3261E}
.ws-menu hr{border:0;height:1px;background:rgba(17,18,14,.09);margin:4px 0}
.ws-blk .x{font-size:18px;line-height:1;width:28px;height:28px;align-items:center;justify-content:center;border-radius:8px}
.ws-blk .x:hover{background:rgba(17,18,14,.06)}
.reqb{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;font-style:normal;font-size:10.5px;font-weight:600;color:#6B6C64;margin-left:8px;padding:2px 8px;border-radius:999px;background:rgba(17,18,14,.06);white-space:nowrap}
.ws-blk .eyeb,.ws-li button.eye{all:unset;cursor:pointer;width:30px;height:30px;border-radius:999px;border:1px solid rgba(17,18,14,.09);display:flex;align-items:center;justify-content:center;flex:none;color:#3A3B33}
.ws-blk .eyeb:hover,.ws-li button.eye:hover{background:rgba(17,18,14,.06)}
.pv-blk{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pv-h{display:flex;align-items:center;gap:10px}
.pv-h .no{width:22px;height:22px;border-radius:50%;background:#D2E739;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pv-h b{flex:1;font-size:14px}.pv-m{font-size:12px;color:#6B6C64}
.pv-ul{margin:0;padding-left:18px;font-size:13px;display:grid;gap:3px}
.gl-trow-act{gap:8px;align-items:center}
.gl-trow-x{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A8AAA4}
.gl-trow-x:hover{background:rgba(179,38,30,.1);color:#B3261E}
.gl-trow-x[data-tledit]:hover{background:rgba(210,231,57,.38);color:#0A0A09}
.gl-trow .pr .txt{width:auto}
button.star{border:0;background:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#0A0A09;flex:none;padding:0;cursor:pointer}
button.star svg{fill:none;transition:fill .12s}
button.star.on{background:none;border:0}
button.star.on svg{fill:#0A0A09}
button.star:hover{border:0;background:rgba(17,18,14,.06)}

<script>
/* ======================= утилиты ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, def){ try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};
const lvClass = lv => 'lv-' + String(lv).replace(/[^A-Z0-9]/gi, '');

/* ---------- перевод: ищем фразу в translations.json ---------- */
const trOf = x => (DB && DB.translations && typeof x === 'string' && DB.translations[x]) || '';
const ru = x => { const r = trOf(x); return r ? `<span class="ru">${esc(r)}</span>` : ''; };            // строкой ниже
const ruI = x => { const r = trOf(x); return r ? ` <span class="ru ru-i">— ${esc(r)}</span>` : ''; };  // в той же строке
const T = x => esc(x) + ru(x);                                                                          // английский + перевод
const ruOn = () => store.get('york-hub-ru', true);
function setRu(on){
  store.set('york-hub-ru', on);
  document.body.classList.toggle('no-ru', !on);
  document.querySelectorAll('[data-ru-toggle]').forEach(b => {
    b.setAttribute('aria-pressed', on);
    const rt = b.querySelector('.rt'); if (rt) rt.textContent = on ? 'Перевод: вкл' : 'Перевод: выкл';
    const rts = b.querySelector('.rt-short'); if (rts) rts.textContent = on ? 'RU вкл' : 'RU выкл';
  });
}

let DB = null;            // загруженный контент
let byId = {};            // все темы и активности по id
let currentRoute = '';    // текущий раздел (для возврата после урока)

/* ======================= закладки ======================= */
const Saved = {
  ids: new Set(store.get('york-hub-saved', [])),
  has(id){ return this.ids.has(id); },
  toggle(id){ this.ids.has(id) ? this.ids.delete(id) : this.ids.add(id); store.set('york-hub-saved', [...this.ids]); },
};
const starBtn = id => `<button class="star${Saved.has(id) ? ' on' : ''}" data-star="${esc(id)}" title="${Saved.has(id) ? 'Убрать из избранного' : 'В избранное'}" aria-pressed="${Saved.has(id)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.3L12 17.5 6.5 20.4l1-6.3L3 9.7l6.2-.9z"></path></svg></button>`;

/* ======================= частота использования («часто используете») ======================= */
const Usage = {
  counts: store.get('york-hub-usage', {}),
  bump(id){ if (!id) return; this.counts[id] = (this.counts[id] || 0) + 1; store.set('york-hub-usage', this.counts); },
  top(n, filterFn){
    return Object.entries(this.counts)
      .filter(([id, c]) => c > 0 && byId[id] && (!filterFn || filterFn(byId[id])))
      .sort((a, b) => b[1] - a[1])
      .slice(0, n)
      .map(([id]) => byId[id]);
  },
};

/* ======================= загрузка контента ======================= */
const EMOJI_RE = /[\u{1F300}-\u{1FAFF}✅❌❓❔⏱⬆⛶✏⚠⚙✨❗⭐❤⌚⏰☑✔](?:️|‍)* ?/gu;
// эмодзи-иконки больше не используем: чистим icon/label/how (содержимое заданий — картинки-эмодзи — не трогаем)
function stripUiEmoji(o){
  if (Array.isArray(o)) { o.forEach(stripUiEmoji); return; }
  if (o && typeof o === 'object') {
    for (const k of Object.keys(o)) {
      if (k === 'icon') o[k] = '';
      else if ((k === 'label' || k === 'how') && typeof o[k] === 'string') o[k] = o[k].replace(EMOJI_RE, '');
      else stripUiEmoji(o[k]);
    }
  }
}
async function loadContent(){
  const entries = await Promise.all(Object.entries(CONTENT_FILES).map(async ([key, url]) => {
    let res;
    try { res = await fetch(url, { cache: 'no-cache' }); }
    catch(e){ throw new Error(`Не удалось загрузить ${url} — нет соединения или страница открыта как файл (нужен сайт или локальный сервер).`); }
    if (!res.ok) throw new Error(`Файл ${url} не найден (ошибка ${res.status}).`);
    const text = await res.text();
    try { return [key, JSON.parse(text)]; }
    catch(e){ throw new Error(`Ошибка в файле ${url}: ${e.message}. Скорее всего, лишняя или пропущенная запятая/кавычка.`); }
  }));
  const out = Object.fromEntries(entries);
  stripUiEmoji(out);
  return out;
}

// Проверяем обязательные поля: кривую запись показываем списком, а не ломаем всю страницу
function validate(db){
  const problems = [];
  const levels = new Set(db.meta.levels), cats = new Set(db.meta.categories.map(c => c.id));
  const actCats = new Set(db.activities.categories.map(c => c.id));
  const ids = new Set();
  db.lessons = db.lessons.filter((l, i) => {
    const miss = ['id', 'level', 'category', 'title', 'outcome'].filter(k => !l[k]);
    if (miss.length) { problems.push(`lessons.json, тема №${i + 1}: нет полей ${miss.join(', ')}`); return false; }
    if (!levels.has(l.level)) { problems.push(`lessons.json, «${l.title}»: неизвестный уровень ${l.level}`); return false; }
    if (!cats.has(l.category)) { problems.push(`lessons.json, «${l.title}»: неизвестная категория ${l.category}`); return false; }
    if (ids.has(l.id)) { problems.push(`lessons.json: повторяется id ${l.id}`); return false; }
    ids.add(l.id); l.explanation = l.explanation || []; return true;
  });
  db.activities.items = db.activities.items.filter((a, i) => {
    const miss = ['id', 'category', 'title', 'levels', 'play'].filter(k => !a[k]);
    if (miss.length) { problems.push(`activities.json, активность №${i + 1}: нет полей ${miss.join(', ')}`); return false; }
    if (!actCats.has(a.category)) { problems.push(`activities.json, «${a.title}»: неизвестная категория ${a.category}`); return false; }
    if (!PLAY[a.play.type]) { problems.push(`activities.json, «${a.title}»: неизвестный тип экрана ${a.play.type}`); return false; }
    if (ids.has(a.id)) { problems.push(`activities.json: повторяется id ${a.id}`); return false; }
    ids.add(a.id); a.phrases = a.phrases || []; return true;
  });
  return problems;
}

/* ======================= компоненты ======================= */
const Components = {
  LevelBadge: lv => `<span class="badge ${lvClass(lv)}">${esc(lv)}</span>`,
  LevelRange(levels){
    const all = DB.meta.levels;
    const txt = levels.length === all.length ? 'Any level' : levels.length > 1 ? `${levels[0]} – ${levels[levels.length - 1]}` : levels[0];
    return `<span class="badge ${levels.length === 1 ? lvClass(levels[0]) : ''}">${esc(txt)}</span>`;
  },
  CategoryTag(catId){
    const c = DB.meta.categories.find(x => x.id === catId);
    return c ? `<span class="tag">${c.icon} ${esc(c.label)}</span>` : '';
  },

  LessonCard(l){
    return `<article class="card">
      <div class="card-top"><div class="grow">${Components.LevelBadge(l.level)}${Components.CategoryTag(l.category)}</div>${starBtn(l.id)}</div>
      <h3><span class="ic">${l.icon || ''}</span><span><button data-open="${esc(l.id)}">${esc(l.title)}</button>${ru(l.title)}</span></h3>
      <p class="outcome">«${esc(l.outcome)}»</p>
      ${l.leadIn ? `<div class="lead"><b>Lead-in question</b>${T(l.leadIn)}</div>` : ''}
      <div class="actions">
        <button class="btn primary" data-show="${esc(l.id)}">▶ Show to student</button>
        <button class="btn ghost" data-open="${esc(l.id)}">Open card</button>
      </div>
    </article>`;
  },

  ActivityCard(a){
    const cat = DB.activities.categories.find(c => c.id === a.category);
    return `<article class="card">
      <div class="card-top"><div class="grow">${Components.LevelRange(a.levels)}<span class="tag">${cat ? cat.icon + ' ' + esc(cat.label) : ''}${a.sub ? ' · ' + esc(a.sub) : ''}</span></div>${starBtn(a.id)}</div>
      <h3><span class="ic">${a.icon || ''}</span><span>${T(a.title)}</span></h3>
      <div class="kv"><b>Goal</b>${esc(a.goal)}</div>
      <div class="kv"><b>How to run</b>${esc(a.how)}</div>
      ${a.phrases.length ? `<ul class="phrases">${a.phrases.map(p => `<li>${T(p)}</li>`).join('')}</ul>` : ''}
      <div class="actions">
        <button class="btn primary" data-show="${esc(a.id)}">▶ Show to student</button>
        ${a.phrases.length ? `<button class="btn ghost" data-copy="${esc(a.id)}">Copy phrases</button>` : ''}
      </div>
    </article>`;
  },

  GrammarCard(l){
    const note = l.lesson && l.lesson.visual && l.lesson.visual.note;
    return `<article class="card">
      <div class="card-top"><div class="grow">${Components.LevelBadge(l.level)}<span class="tag">${esc(l.section || '')}</span></div>${starBtn(l.id)}</div>
      <h3><span class="ic">${l.icon || ''}</span><span><button data-open="${esc(l.id)}">${esc(l.title)}</button>${ru(l.title)}</span></h3>
      <div class="kv"><b>Explanation</b>${esc(l.idea)}${note ? ' ' + esc(note) : ''}</div>
      <div class="kv"><b>Examples</b></div><ul class="phrases">${l.explanation.map(p => `<li>${T(p)}</li>`).join('')}</ul>
      ${l.mistakes ? `<div class="kv"><b>Common mistakes</b></div>${Components.Mistakes(l.mistakes)}` : ''}
      ${l.speaking ? `<div class="lead"><b>Speaking task</b>${T(l.speaking)}</div>` : ''}
      <div class="actions"><button class="btn primary" data-show="${esc(l.id)}">▶ Show to student</button></div>
    </article>`;
  },

  Mistakes: list => `<div class="mistakes">${list.map(([bad, good]) =>
    `<div class="mistake"><span class="bad">✗ ${esc(bad)}</span><span class="arr">→</span><span class="good">✓ ${esc(good)}${ru(good)}</span></div>`).join('')}</div>`,

  // FilterBar: конфиг рядов → элемент. Каждый ряд сам сообщает о выборе через onChange.
  FilterBar({ rows = [], search, saved }){
    const el = document.createElement('section');
    el.className = 'filterbar';
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'fb-row';
      row.innerHTML = `<span class="fb-lbl">${esc(r.label)}</span>`;
      r.options.forEach(o => {
        const b = document.createElement('button');
        b.className = 'pill ' + (r.cls || '');
        b.innerHTML = esc(o.label) + (o.hint ? `<small>${esc(o.hint)}</small>` : '');
        b.setAttribute('aria-pressed', r.value === o.value);
        b.onclick = () => r.onChange(r.value === o.value && r.toggle ? null : o.value);
        row.appendChild(b);
      });
      el.appendChild(row);
    });
    const sr = document.createElement('div');
    sr.className = 'fb-search';
    sr.innerHTML = `<input class="search" type="search" placeholder="${esc(search.placeholder)}" value="${esc(search.value)}" autocomplete="off">`;
    const input = sr.querySelector('input');
    input.oninput = () => search.onChange(input.value);
    if (saved) {
      const sb = document.createElement('button');
      sb.className = 'pill soft';
      sb.textContent = '★ Saved';
      sb.setAttribute('aria-pressed', saved.value);
      sb.onclick = () => saved.onChange(!saved.value);
      sr.appendChild(sb);
    }
    el.appendChild(sr);
    return el;
  },

  TimelineBlock(b, total){
    const pct = ((b.to - b.from) / total) * 100;
    const ex = b.exampleLesson && byId[b.exampleLesson];
    return `<div class="tl">
      <div class="tl-time">${b.from}–${b.to} min</div>
      <div class="tl-body">
        <h3>${T(b.title)}</h3>
        <p>${esc(b.text)}</p>
        <div class="tl-bar" title="${b.to - b.from} минут из ${total}"><span style="width:${pct}%;margin-left:${(b.from / total) * 100}%"></span></div>
        <div class="tl-groups">${(b.groups || []).map(g => `<div class="tl-group"><b>${esc(g.label)}</b><ul>${g.items.map(i => `<li>${T(i)}</li>`).join('')}</ul></div>`).join('')}</div>
        ${ex ? `<div class="tl-example"><p class="muted" style="margin:0 0 8px">Пример карточки темы:</p>${Components.LessonCard(ex)}</div>` : ''}
        ${b.link ? `<div class="actions" style="margin-top:12px"><a class="btn ghost" href="#/${esc(b.link)}">Open Speaking Activities →</a></div>` : ''}
      </div>
    </div>`;
  },

  // TeacherChecklist: отметки хранятся в браузере преподавателя, «Новый урок» сбрасывает
  TeacherChecklist(groups){
    const el = document.createElement('div');
    const state = store.get('york-hub-checklist', {});
    const total = groups.reduce((n, g) => n + g.items.length, 0);
    el.innerHTML = `<div class="result-line"><b id="clCount"></b><button class="btn ghost" id="clReset">↺ New lesson</button></div>
      <div class="progress"><span id="clBar"></span></div>
      <div class="checklist">${groups.map(g => `<div class="cl-group"><h3><span>${T(g.title)}</span></h3>
        ${g.items.map((it, i) => { const key = g.id + ':' + i; return `<label class="cl-item"><input type="checkbox" data-key="${esc(key)}" ${state[key] ? 'checked' : ''}><span>${T(it)}</span></label>`; }).join('')}
      </div>`).join('')}</div>`;
    const upd = () => {
      const n = el.querySelectorAll('input:checked').length;
      el.querySelector('#clCount').textContent = `${n} / ${total} done`;
      el.querySelector('#clBar').style.width = (n / total * 100) + '%';
    };
    el.querySelectorAll('input').forEach(i => i.onchange = () => { state[i.dataset.key] = i.checked; store.set('york-hub-checklist', state); upd(); });
    el.querySelector('#clReset').onclick = () => { el.querySelectorAll('input').forEach(i => { i.checked = false; }); for (const k in state) delete state[k]; store.set('york-hub-checklist', state); upd(); };
    upd();
    return el;
  },

  ResourceCard(r, cat){
    return `<div class="res"><span class="ri">${cat ? cat.icon : ''}</span><div>
      <h3>${T(r.title)}</h3><p>${esc(r.description || '')}</p>
      ${r.url ? `<a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener">Open →</a>`
              : `<button class="btn ghost" disabled title="Ссылку ещё не добавили в materials.json">Link coming soon</button>`}
    </div></div>`;
  },
};

/* ======================= страницы ======================= */
const filters = {
  lessons: store.get('york-hub-lessons-filters', { level: null, category: null, situation: null, q: '', saved: false }),
  activities: { category: null, level: null, q: '', saved: false },
  grammar: { level: null, q: '' },
  library: { type: 'all', level: null, q: '', saved: false },
};
const saveLessonFilters = () => store.set('york-hub-lessons-filters', { ...filters.lessons, q: '' });

// карточка задания в "Избранные задания" на Dashboard — цвет иконки по типу, как в мокапе
function favRow(x){
  const kind = x.play ? 'Активность' : (x.category === 'grammar' ? 'Грамматика' : 'Мини-урок');
  const color = x.play ? '#EFE7FB' : (x.category === 'grammar' ? '#CDB8F0' : '#D7EF42');
  const lvl = x.play ? (x.levels.length > 1 ? `${x.levels[0]}–${x.levels[x.levels.length - 1]}` : x.levels[0]) : x.level;
  return `<a href="#" class="gl-row" data-show="${esc(x.id)}">
      <span class="gl-row-ic" style="background:${color}"></span>
      <span class="gl-row-txt"><b>${esc(x.title)}</b><span>${esc(kind)}</span></span>
      <span class="gl-row-lv">${esc(lvl)}</span>
      <button class="gl-row-add" data-quickadd="${esc(x.id)}" aria-label="В урок">${svgIcon('<path d="M12 5v14M5 12h14"></path>')}</button>
    </a>`;
}
// "+" у задания — добавляет в черновик урока, который уже собирается, иначе создаёт новый
function quickAddToLesson(x){
  const draft = Plans.list().find(p => p.status !== 'done' && p.template);
  if (!draft) {
    const p = Plans.create();
    p.template = 'standard'; p.blocks = buildBlocks('standard'); p.step = 'prepare';
    const bl = p.blocks.find(z => z.mode === 'slot' && acceptFilter(z.accept)(x)) || p.blocks.find(z => z.mode === 'slot');
    bl.itemId = x.id; Plans.save(p);
    toast(`«${x.title}» добавлено в новый урок`);
    return;
  }
  const slot = draft.blocks.find(z => z.mode === 'slot' && !z.itemId && acceptFilter(z.accept)(x));
  if (slot) slot.itemId = x.id;
  else draft.blocks.push({ id: uid('b'), key: x.play ? 'practice' : 'topic', title: x.play ? 'Дополнительная активность' : 'Дополнительный мини-урок', duration: itemMin(x), mode: 'slot', accept: 'any', qkind: null, questions: [], itemId: x.id, note: '', skipped: false, visited: false });
  Plans.save(draft);
  toast(`«${x.title}» добавлено в урок «${draft.student.name || 'без имени'}»`);
}

const Pages = {
  home: {
    title: 'Dashboard', icon: '',

/* ======================= фильтрация ======================= */
const norm = s => String(s || '').toLowerCase();
const matches = (q, ...fields) => !q.trim() || fields.flat().some(x => norm(x).includes(norm(q.trim())));
const grammarLessons = () => DB.lessons.filter(l => l.category === 'grammar');

function filterLessons(){
  const f = filters.lessons;
  let list = DB.lessons;
  if (f.situation) {
    const s = DB.meta.situations.find(x => x.key === f.situation);
    list = s ? s.topics.map(id => byId[id]).filter(Boolean) : list;
  }
  if (f.level) list = list.filter(l => l.level === f.level);
  if (f.category) list = list.filter(l => l.category === f.category);
  if (f.saved) list = list.filter(l => Saved.has(l.id));
  return list.filter(l => matches(f.q, l.title, l.section, l.idea, l.explanation, l.outcome));
}
function filterActivities(){
  const f = filters.activities;
  return DB.activities.items.filter(a =>
    (!f.category || a.category === f.category) && (!f.level || a.levels.includes(f.level)) && (!f.saved || Saved.has(a.id)) &&
    matches(f.q, a.title, a.goal, a.how, a.phrases, a.sub));
}
function filterGrammar(){
  const f = filters.grammar;
  return grammarLessons().filter(l => (!f.level || l.level === f.level) && matches(f.q, l.title, l.idea, l.explanation));
}
function libraryItems(F){
  const type = F.type || 'all';
  let lessons = (type === 'all' || type === 'lessons') ? DB.lessons.filter(l => l.category !== 'grammar') : [];
  let grammar = (type === 'all' || type === 'grammar') ? grammarLessons() : [];
  let activities = (type === 'all' || type === 'activities') ? DB.activities.items : [];
  let materials = (type === 'all' || type === 'materials') ? DB.materials.items : [];
  if (F.level) {
    lessons = lessons.filter(l => l.level === F.level);
    grammar = grammar.filter(l => l.level === F.level);
    activities = activities.filter(a => a.levels.includes(F.level));
  }
  if (F.saved) {
    lessons = lessons.filter(l => Saved.has(l.id));
    grammar = grammar.filter(l => Saved.has(l.id));
    activities = activities.filter(a => Saved.has(a.id));
    materials = [];
  }
  if (F.q && F.q.trim()) {
    lessons = lessons.filter(l => matches(F.q, l.title, l.idea, l.outcome));
    grammar = grammar.filter(l => matches(F.q, l.title, l.idea, l.explanation));
    activities = activities.filter(a => matches(F.q, a.title, a.goal, a.how, a.phrases));
    materials = materials.filter(m => matches(F.q, m.title, m.description));
  }
  return { lessons, grammar, activities, materials };
}
function refreshGrid(root, cards, total, noun){
  root.querySelector('.grid').innerHTML = cards.join('') || '<div class="empty">Ничего не нашлось — сбросьте фильтры.</div>';
  root.querySelector('.result-line .muted').textContent = `${cards.length} of ${total} ${noun}`;
}
