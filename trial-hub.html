<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YORK! — Trial Lesson Hub</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   TRIAL LESSON HUB — внутренний раздел для преподавателей YORK!

   Весь контент лежит в JSON-файлах в папке trial-hub/content/:
     meta.json        — уровни, цели уровней, категории, ситуации ученика
     lessons.json     — микро-темы (банк уроков) + интерактивный урок для ученика
     activities.json  — разговорные активности и их категории
     structure.json   — цель, принципы, таймлайн 30-минутного урока, опыт ученика
     checklist.json   — чек-лист преподавателя
     materials.json   — материалы (рабочие листы, домашки)
     translations.json — переводы английских фраз на русский (показываются серой строкой)
   Чтобы добавить тему или активность — добавьте объект в нужный JSON,
   код страницы менять не нужно. Схема полей — trial-hub/content/README.md.
   ===================================================================== */
const CONTENT_FILES = {
  meta: 'trial-hub/content/meta.json',
  lessons: 'trial-hub/content/lessons.json',
  activities: 'trial-hub/content/activities.json',
  structure: 'trial-hub/content/structure.json',
  checklist: 'trial-hub/content/checklist.json',
  materials: 'trial-hub/content/materials.json',
  translations: 'trial-hub/content/translations.json',   // «английский текст» → «перевод»
};
</script>
<style>
/* Оформление повторяет кабинет учителя (teacher.html). */
:root{
  --accent:#D7EF42; --accent-soft:#F1F8C6; --ink:#1C1C1C; --ink-2:rgba(28,28,28,.72); --ink-3:rgba(28,28,28,.55);
  --panel:#F7F8EF; --card:#FFFFFF; --line:rgba(28,28,28,.12); --r:18px; --red:#D14B3F; --dark:#090A09;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font:15px/1.5 'Golos Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:Unbounded,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
[hidden]{display:none !important}

/* ---------- перевод на русский ---------- */
.ru{display:block;font-size:.8em;line-height:1.3;color:var(--ink-3);font-weight:400;font-style:normal;font-family:'Golos Text',sans-serif;margin-top:2px;letter-spacing:0;text-transform:none}
.ru-i{display:inline;margin:0}
.ru-prompt{font-size:1em;color:var(--ink-2);font-weight:500}
.ru-prompt::before{content:"🇷🇺 ";}
body.no-ru .ru{display:none !important}
.item:not(.ok) .ru-after{display:none}
.hc-dark .ru,.goal-hero .ru,.sit-card .ru,.tl-time .ru{color:rgba(255,255,255,.62)}
.goal-hero > .ru{font-size:15px;margin-top:10px}
.ru-toggle[aria-pressed="true"]{background:var(--panel)}

/* ---------- каркас: сайдбар как в кабинете, но с подписями (Notion-стиль) ---------- */
.shell{min-height:100vh;display:flex;max-width:1500px;margin:0 auto}
.sidebar{width:232px;flex-shrink:0;margin:16px 0 16px 16px;background:#fff;border:1px solid var(--line);border-radius:18px;
  display:flex;flex-direction:column;gap:2px;padding:18px 12px;position:sticky;top:16px;align-self:flex-start;max-height:calc(100vh - 32px);overflow:auto}
.sb-logo{font-family:Unbounded,sans-serif;font-weight:900;font-size:15px;padding:0 10px 4px;text-decoration:none}
.sb-logo span{background:var(--accent);padding:0 4px;border-radius:6px}
.sb-sub{font-size:12px;color:var(--ink-3);padding:0 10px 14px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:11px;padding:9px 10px;font-weight:600;font-size:14px;color:var(--ink-2);text-align:left;text-decoration:none}
.nav-btn .ni{width:22px;text-align:center;font-size:15px}
.nav-btn .nc{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:600}
.nav-btn:hover{background:var(--panel)}
.nav-btn.active{background:var(--accent);color:var(--dark)}
.nav-btn.active .nc{color:var(--dark)}
.sb-sep{height:1px;background:var(--line);margin:10px 6px}
.main-col{flex:1;min-width:0}
main.page{padding:26px 28px 70px;max-width:1240px;margin:0 auto}
@media (min-width:1300px){ main.page{padding:30px 40px 80px} }
.page-title{font-family:Unbounded,sans-serif;font-size:26px;font-weight:700;margin:0 0 4px}
.page-sub{color:var(--ink-3);margin:0 0 20px;font-size:14.5px;max-width:70ch}
.h-sec{font-family:Unbounded,sans-serif;font-size:16px;font-weight:700;margin:30px 0 12px}

/* мобильная навигация: липкая верхняя полоска */
.mobile-top{display:none}
@media (max-width:900px){
  .sidebar{display:none}
  .mobile-top{display:block;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .mobile-top .mt-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
  .mobile-top nav{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
  .mobile-top nav::-webkit-scrollbar{display:none}
  .mobile-top .nav-btn{width:auto;flex:none;border:1.5px solid var(--line);border-radius:100px;padding:6px 12px;font-size:13px}
  .mobile-top .nav-btn .nc{display:none}
  main.page{padding:18px 16px 60px}
  .page-title{font-size:21px}
}

/* ---------- общие элементы ---------- */
.btn{font-family:Unbounded,sans-serif;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:100px;padding:9px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);transition:transform .15s ease,background .15s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--dark)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.star{border:1.5px solid var(--line);background:#fff;border-radius:100px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:16px;flex:none;transition:.15s}
.star:hover{border-color:var(--ink)}
.star.on{background:var(--accent);border-color:var(--accent)}
.muted{color:var(--ink-3);font-size:13px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:var(--panel);color:var(--ink-2);white-space:nowrap}
.lv-A0A1{background:#EAF3FF;color:#1D5FA5}
.lv-A2{background:#EAF7E5;color:#3B7A1E}
.lv-B1{background:#FFF4DE;color:#96650B}
.lv-B2{background:#F1EAFB;color:#6B3FA0}
.lv-C1{background:#FBEAEA;color:var(--red)}
.tag{font-size:12px;color:var(--ink-3);font-weight:600}
.empty{text-align:center;padding:36px 20px;color:var(--ink-3);font-size:14px;border:1.5px dashed var(--line);border-radius:var(--r)}
.notice{background:#FFF4DE;color:#7A520A;border-radius:14px;padding:12px 16px;font-size:13.5px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}

/* hero-карточки как в кабинете */
.hero-cards{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:16px}
@media (max-width:680px){ .hero-cards{grid-template-columns:1fr} }
.hero-card{border-radius:16px;padding:22px;min-height:110px;display:flex;flex-direction:column}
.hc-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.hc-value{font-family:Unbounded,sans-serif;font-weight:800;font-size:17px;margin-top:auto;padding-top:16px;line-height:1.3}
.hc-note{font-size:13px;margin-top:6px;opacity:.72}
.hc-dark{background:var(--dark);color:#fff}
.hc-dark .hc-value{color:var(--accent)}
.hc-light{background:#fff;border:1px solid var(--line)}
.hc-lime{background:var(--accent)}
.hero-card .btn{align-self:flex-start;margin-top:12px}
.goal-hero{background:var(--dark);color:#fff;border-radius:22px;padding:clamp(22px,4vw,40px);margin-bottom:16px}
.goal-hero .hc-label{color:rgba(255,255,255,.65)}
.goal-hero blockquote{margin:14px 0 0;font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(20px,3vw,32px);line-height:1.25;color:var(--accent);max-width:28ch}
.stats{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){ .stats{grid-template-columns:repeat(2,1fr)} }
@media (max-width:420px){ .stats{grid-template-columns:1fr} }
.stat{background:var(--panel);border-radius:16px;padding:18px}
.stat .si{font-size:22px}
.stat b{display:block;font-family:Unbounded,sans-serif;font-size:14px;margin:8px 0 4px}
.stat p{margin:0;font-size:13.5px;color:var(--ink-2)}

/* разделы на дашборде */
.sec-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;text-decoration:none;transition:border-color .15s,transform .15s}
.sec-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.sec-card .si{font-size:26px}
.sec-card h3{margin:6px 0 0;font-size:15px}
.sec-card p{margin:0;color:var(--ink-2);font-size:13.5px}
.sec-card .cnt{margin-top:auto;padding-top:10px;font-size:12px;font-weight:700;color:var(--ink-3)}

/* опыт ученика */
.journey{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.jstep{border-radius:16px;padding:20px;background:var(--panel);position:relative}
.jstep:nth-child(2){background:var(--accent-soft)}
.jstep:nth-child(3){background:var(--accent)}
.jstep .at{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.jstep .feel{font-family:Unbounded,sans-serif;font-weight:700;font-size:16px;margin-top:10px;line-height:1.3}

/* ---------- FilterBar ---------- */
.filterbar{border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;background:#fff;margin-bottom:16px}
.fb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb-lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);width:100%;margin-bottom:-2px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:100px;padding:7px 14px;font-weight:600;font-size:13.5px;transition:.15s}
.pill:hover{border-color:var(--ink)}
.pill.lv{font-family:Unbounded,sans-serif;font-weight:700;font-size:12.5px}
.pill small{font-family:'Golos Text',sans-serif;font-weight:500;opacity:.65;margin-left:4px}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.soft[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--dark)}
.fb-search{display:flex;gap:8px;align-items:center}
.search{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;font-size:15px;background:#fff;min-width:0}
.search:focus{outline:none;border-color:var(--ink)}
.result-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}

/* ---------- LessonCard / ActivityCard / GrammarCard ---------- */
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.card:hover{border-color:rgba(28,28,28,.3)}
.card-top{display:flex;align-items:center;gap:8px}
.card-top .grow{flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.card h3 .ic{font-size:22px;line-height:1}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:hover{text-decoration:underline;text-underline-offset:3px}
.outcome{margin:0;font-size:14px;color:var(--ink-2);font-style:italic}
.lead{font-size:13.5px;background:var(--panel);border-radius:12px;padding:9px 12px}
.lead b,.kv b{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);display:block;font-style:normal}
.kv{font-size:13.5px}
.phrases{margin:0;padding:12px 14px;list-style:none;background:var(--panel);border-radius:12px;display:grid;gap:4px;font-weight:500;font-size:14px}
.phrases li::before{content:"› ";color:var(--ink-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.mistakes{display:grid;gap:6px}
.mistake{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13.5px}
.mistake .bad{color:var(--red);text-decoration:line-through;text-decoration-color:rgba(209,75,63,.45)}
.mistake .good{font-weight:600;background:#EAF7E5;border-radius:8px;padding:3px 8px}
@media (max-width:520px){ .mistake{grid-template-columns:1fr} .mistake .arr{display:none} }

/* ---------- TimelineBlock ---------- */
.timeline{display:grid;gap:0;position:relative}
.tl{display:grid;grid-template-columns:92px 1fr;gap:18px;position:relative;padding-bottom:18px}
.tl::before{content:"";position:absolute;left:45px;top:44px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl-time{justify-self:center;background:var(--dark);color:var(--accent);font-family:Unbounded,sans-serif;font-weight:700;font-size:12.5px;border-radius:100px;padding:8px 12px;height:max-content;white-space:nowrap;position:relative;z-index:1}
.tl-body{border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;background:#fff}
.tl-body h3{margin:0 0 4px;font-size:16px}
.tl-body > p{margin:0 0 12px;color:var(--ink-2)}
.tl-bar{height:6px;border-radius:6px;background:var(--panel);margin:0 0 14px;overflow:hidden}
.tl-bar span{display:block;height:100%;background:var(--accent)}
.tl-groups{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tl-group{background:var(--panel);border-radius:12px;padding:12px 14px}
.tl-group b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.tl-group ul{margin:6px 0 0;padding-left:18px}
.tl-group li{margin:2px 0}
.tl-example{margin-top:14px}
@media (max-width:600px){ .tl{grid-template-columns:1fr;gap:8px} .tl::before{display:none} .tl-time{justify-self:start} }

/* ---------- TeacherChecklist ---------- */
.checklist{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cl-group{border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px}
.cl-group h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.cl-item{display:flex;gap:12px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.cl-item:first-of-type{border-top:0}
.cl-item input{appearance:none;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:7px;display:grid;place-items:center;flex:none;margin:0;cursor:pointer}
.cl-item input:checked{background:var(--accent);border-color:var(--accent)}
.cl-item input:checked::after{content:"✓";font-weight:700;font-size:14px}
.cl-item input:checked + span{color:var(--ink-3);text-decoration:line-through}
.progress{height:8px;border-radius:8px;background:var(--panel);overflow:hidden;margin:6px 0 18px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ---------- ResourceCard ---------- */
.res{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.res .ri{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--panel);display:grid;place-items:center;flex:none}
.res h3{margin:0 0 4px;font-size:14.5px}
.res p{margin:0 0 10px;font-size:13.5px;color:var(--ink-2)}

/* ---------- боковая панель карточки (drawer) ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(9,10,9,.35);z-index:45;display:none}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:46;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.drawer-head{display:flex;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-head .grow{flex:1}
.drawer-body{overflow:auto;padding:20px 22px 40px;display:grid;gap:16px;align-content:start}
.drawer-body h2{margin:0;font-size:22px;line-height:1.25}
.drawer-body .ic{font-size:40px;line-height:1}
.field-row{display:grid;gap:4px}
.field-row > b{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#B3261E}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:100px;padding:5px 12px;font-size:13px;font-weight:500}

/* show mode — мини-урок */
.show{position:fixed;inset:0;background:var(--panel);z-index:50;display:none;flex-direction:column}
.show.open{display:flex}
.show-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.show-bar .grow{flex:1}
.clock{font-family:Unbounded,sans-serif;font-size:13px;font-weight:600;background:var(--panel);border-radius:999px;padding:6px 12px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--line)}
.steps::-webkit-scrollbar{display:none}
.stp{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.stp.done{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.stp.cur{background:var(--ink);color:var(--accent);border-color:var(--ink)}
.show-scroll{flex:1;overflow:auto}
.show-body{max-width:1100px;margin:0 auto;padding:clamp(18px,4vw,40px) 20px 32px;font-size:clamp(17px,1.9vw,22px)}
.step{display:none}
.step.cur{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-family:Unbounded,sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px}
.show h2{font-size:clamp(26px,4.4vw,52px);line-height:1.1;margin:0 0 16px;font-weight:700}
.show-ic{font-size:clamp(52px,8vw,96px);line-height:1;margin-bottom:10px}
.show-idea{font-size:clamp(18px,2.3vw,28px);color:var(--ink-2);margin:0 0 24px;max-width:42ch}
.show-phrases{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.show-phrases li{font-size:clamp(20px,3vw,38px);font-weight:600;background:var(--card);border-left:8px solid var(--accent);border-radius:14px;padding:10px 20px;line-height:1.25}
.show-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--card)}
.show-foot .btn{padding:10px 20px;font-size:15px}

/* разминка / говорим */
.bubbles{display:grid;gap:14px}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:18px 24px;font-size:clamp(22px,3.2vw,40px);font-weight:600;border:1.5px solid var(--line);max-width:900px}
.bubble:nth-child(even){justify-self:end;border-radius:22px 22px 6px 22px;background:var(--accent-soft);border-color:var(--accent)}
.speak{display:grid;gap:14px}
.speak-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.speak-card .q{font-size:clamp(19px,2.4vw,28px);font-weight:600}
.speak-card .h{color:var(--ink-2);grid-column:1}
.speak-card .h::before{content:"💡 "}
.timer{grid-row:1 / span 2;grid-column:2;font-family:Unbounded,sans-serif;font-weight:600;border:1.5px solid var(--ink);border-radius:999px;padding:10px 16px;background:transparent;min-width:96px}
.timer.run{background:var(--accent)}
.timer.over{background:var(--ink);color:var(--accent)}
@media (max-width:600px){ .speak-card{grid-template-columns:1fr} .timer{grid-row:auto;grid-column:1;justify-self:start} }

/* схемы */
.note{margin-top:18px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:.92em}
.note::before{content:"💡 "}
.v-compare{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.v-col{background:var(--card);border-radius:var(--r);padding:18px 20px;border-top:8px solid var(--accent)}
.v-col:nth-child(2){border-top-color:var(--ink)}
.v-col .ic{font-size:2.2em;line-height:1}
.v-col h4{font-family:Unbounded,sans-serif;font-size:1em;margin:8px 0 2px}
.v-col .sub{color:var(--ink-3);font-size:.85em;margin-bottom:10px}
.v-col ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.v-col li{background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:600}
.v-formula{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.v-part{flex:1 1 160px;background:var(--card);border-radius:var(--r);padding:14px 16px;position:relative;border:1.5px solid var(--line)}

.v-part b{font-family:Unbounded,sans-serif;font-size:.8em;display:block;color:var(--ink-2);margin-bottom:4px}

.v-step span{color:var(--ink-2)}
.v-up{display:grid;gap:10px}

.v-row :nth-child(3){color:var(--ink-2)}
@media (max-width:600px){ .v-row{grid-template-columns:2em 1fr} .v-row :nth-child(3){grid-column:2} }

/* задания */
.task-score{display:inline-block;margin-left:10px;font-family:'Golos Text',sans-serif;text-transform:none;letter-spacing:0;background:var(--accent);color:var(--ink);border-radius:999px;padding:2px 10px}
.items{display:grid;gap:12px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;transition:border-color .2s}
.item.ok{border-color:#7FB800}
.item .pic{font-size:1.9em;grid-row:span 2}
.item .q{font-weight:600}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--ink-3);text-align:center;color:var(--ink-3)}
.gap.filled{border-color:#7FB800;color:var(--ink);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--ink);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.95em}
.opt:hover:not(:disabled){background:var(--accent-soft)}

.build{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;gap:10px}

<script>
/* ======================= утилиты ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, def){ try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};
const lvClass = lv => 'lv-' + String(lv).replace(/[^A-Z0-9]/gi, '');

/* ---------- перевод: ищем фразу в translations.json ---------- */
const trOf = x => (DB && DB.translations && typeof x === 'string' && DB.translations[x]) || '';
const ru = x => { const r = trOf(x); return r ? `<span class="ru">${esc(r)}</span>` : ''; };            // строкой ниже
const ruI = x => { const r = trOf(x); return r ? ` <span class="ru ru-i">— ${esc(r)}</span>` : ''; };  // в той же строке
const T = x => esc(x) + ru(x);                                                                          // английский + перевод
const ruOn = () => store.get('york-hub-ru', true);
function setRu(on){
  store.set('york-hub-ru', on);
  document.body.classList.toggle('no-ru', !on);
  document.querySelectorAll('[data-ru-toggle]').forEach(b => { b.setAttribute('aria-pressed', on); b.querySelector('.rt').textContent = on ? 'Перевод: вкл' : 'Перевод: выкл'; });
}

let DB = null;            // загруженный контент
let byId = {};            // все темы и активности по id
let currentRoute = '';    // текущий раздел (для возврата после урока)

/* ======================= закладки ======================= */
const Saved = {
  ids: new Set(store.get('york-hub-saved', [])),
  has(id){ return this.ids.has(id); },
  toggle(id){ this.ids.has(id) ? this.ids.delete(id) : this.ids.add(id); store.set('york-hub-saved', [...this.ids]); },
};
const starBtn = id => `<button class="star${Saved.has(id) ? ' on' : ''}" data-star="${esc(id)}" title="${Saved.has(id) ? 'Убрать из избранного' : 'В избранное'}" aria-pressed="${Saved.has(id)}">${Saved.has(id) ? '★' : '☆'}</button>`;

/* ======================= загрузка контента ======================= */
async function loadContent(){
  const entries = await Promise.all(Object.entries(CONTENT_FILES).map(async ([key, url]) => {
    let res;
    try { res = await fetch(url, { cache: 'no-cache' }); }
    catch(e){ throw new Error(`Не удалось загрузить ${url} — нет соединения или страница открыта как файл (нужен сайт или локальный сервер).`); }
    if (!res.ok) throw new Error(`Файл ${url} не найден (ошибка ${res.status}).`);
    const text = await res.text();
    try { return [key, JSON.parse(text)]; }
    catch(e){ throw new Error(`Ошибка в файле ${url}: ${e.message}. Скорее всего, лишняя или пропущенная запятая/кавычка.`); }
  }));
  return Object.fromEntries(entries);
}

// Проверяем обязательные поля: кривую запись показываем списком, а не ломаем всю страницу
function validate(db){
  const problems = [];
  const levels = new Set(db.meta.levels), cats = new Set(db.meta.categories.map(c => c.id));
  const actCats = new Set(db.activities.categories.map(c => c.id));
  const ids = new Set();
  db.lessons = db.lessons.filter((l, i) => {
    const miss = ['id', 'level', 'category', 'title', 'outcome'].filter(k => !l[k]);
    if (miss.length) { problems.push(`lessons.json, тема №${i + 1}: нет полей ${miss.join(', ')}`); return false; }
    if (!levels.has(l.level)) { problems.push(`lessons.json, «${l.title}»: неизвестный уровень ${l.level}`); return false; }
    if (!cats.has(l.category)) { problems.push(`lessons.json, «${l.title}»: неизвестная категория ${l.category}`); return false; }
    if (ids.has(l.id)) { problems.push(`lessons.json: повторяется id ${l.id}`); return false; }
    ids.add(l.id); l.explanation = l.explanation || []; return true;
  });
  db.activities.items = db.activities.items.filter((a, i) => {
    const miss = ['id', 'category', 'title', 'levels', 'play'].filter(k => !a[k]);
    if (miss.length) { problems.push(`activities.json, активность №${i + 1}: нет полей ${miss.join(', ')}`); return false; }
    if (!actCats.has(a.category)) { problems.push(`activities.json, «${a.title}»: неизвестная категория ${a.category}`); return false; }
    if (!PLAY[a.play.type]) { problems.push(`activities.json, «${a.title}»: неизвестный тип экрана ${a.play.type}`); return false; }
    if (ids.has(a.id)) { problems.push(`activities.json: повторяется id ${a.id}`); return false; }
    ids.add(a.id); a.phrases = a.phrases || []; return true;
  });
  return problems;
}

/* ======================= компоненты ======================= */
const Components = {
  LevelBadge: lv => `<span class="badge ${lvClass(lv)}">${esc(lv)}</span>`,
  LevelRange(levels){
    const all = DB.meta.levels;
    const txt = levels.length === all.length ? 'Any level' : levels.length > 1 ? `${levels[0]} – ${levels[levels.length - 1]}` : levels[0];
    return `<span class="badge ${levels.length === 1 ? lvClass(levels[0]) : ''}">${esc(txt)}</span>`;
  },
  CategoryTag(catId){
    const c = DB.meta.categories.find(x => x.id === catId);
    return c ? `<span class="tag">${c.icon} ${esc(c.label)}</span>` : '';
  },

  LessonCard(l){

      <div class="actions">

        <button class="btn ghost" data-open="${esc(l.id)}">Open card</button>
      </div>

  },

  ActivityCard(a){

  // FilterBar: конфиг рядов → элемент. Каждый ряд сам сообщает о выборе через onChange.
  FilterBar({ rows = [], search, saved }){
    const el = document.createElement('section');
    el.className = 'filterbar';
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'fb-row';
      row.innerHTML = `<span class="fb-lbl">${esc(r.label)}</span>`;
      r.options.forEach(o => {
        const b = document.createElement('button');
        b.className = 'pill ' + (r.cls || '');
        b.innerHTML = esc(o.label) + (o.hint ? `<small>${esc(o.hint)}</small>` : '');
        b.setAttribute('aria-pressed', r.value === o.value);
        b.onclick = () => r.onChange(r.value === o.value && r.toggle ? null : o.value);
        row.appendChild(b);
      });
      el.appendChild(row);
    });
    const sr = document.createElement('div');
    sr.className = 'fb-search';
    sr.innerHTML = `<input class="search" type="search" placeholder="${esc(search.placeholder)}" value="${esc(search.value)}" autocomplete="off">`;
    const input = sr.querySelector('input');
    input.oninput = () => search.onChange(input.value);
    if (saved) {
      const sb = document.createElement('button');
      sb.className = 'pill soft';
      sb.textContent = '★ Saved';
      sb.setAttribute('aria-pressed', saved.value);
      sb.onclick = () => saved.onChange(!saved.value);
      sr.appendChild(sb);
    }
    el.appendChild(sr);
    return el;
  },

  TimelineBlock(b, total){
    const pct = ((b.to - b.from) / total) * 100;
    const ex = b.exampleLesson && byId[b.exampleLesson];
    return `<div class="tl">
      <div class="tl-time">${b.from}–${b.to} min</div>
      <div class="tl-body">
        <h3>${T(b.title)}</h3>
        <p>${esc(b.text)}</p>
        <div class="tl-bar" title="${b.to - b.from} минут из ${total}"><span style="width:${pct}%;margin-left:${(b.from / total) * 100}%"></span></div>
        <div class="tl-groups">${(b.groups || []).map(g => `<div class="tl-group"><b>${esc(g.label)}</b><ul>${g.items.map(i => `<li>${T(i)}</li>`).join('')}</ul></div>`).join('')}</div>

  TeacherChecklist(groups){
    const el = document.createElement('div');
    const state = store.get('york-hub-checklist', {});
    const total = groups.reduce((n, g) => n + g.items.length, 0);
    el.innerHTML = `<div class="result-line"><b id="clCount"></b><button class="btn ghost" id="clReset">↺ New lesson</button></div>

        ${g.items.map((it, i) => { const key = g.id + ':' + i; return `<label class="cl-item"><input type="checkbox" data-key="${esc(key)}" ${state[key] ? 'checked' : ''}><span>${T(it)}</span></label>`; }).join('')}
      </div>`).join('')}</div>`;
    const upd = () => {
      const n = el.querySelectorAll('input:checked').length;
      el.querySelector('#clCount').textContent = `${n} / ${total} done`;
      el.querySelector('#clBar').style.width = (n / total * 100) + '%';
    };
    el.querySelectorAll('input').forEach(i => i.onchange = () => { state[i.dataset.key] = i.checked; store.set('york-hub-checklist', state); upd(); });
    el.querySelector('#clReset').onclick = () => { el.querySelectorAll('input').forEach(i => { i.checked = false; }); for (const k in state) delete state[k]; store.set('york-hub-checklist', state); upd(); };
    upd();
    return el;
  },

  ResourceCard(r, cat){

/* ======================= фильтрация ======================= */
const norm = s => String(s || '').toLowerCase();
const matches = (q, ...fields) => !q.trim() || fields.flat().some(x => norm(x).includes(norm(q.trim())));
const grammarLessons = () => DB.lessons.filter(l => l.category === 'grammar');

function filterLessons(){
  const f = filters.lessons;
  let list = DB.lessons;
  if (f.situation) {
    const s = DB.meta.situations.find(x => x.key === f.situation);
    list = s ? s.topics.map(id => byId[id]).filter(Boolean) : list;
  }
  if (f.level) list = list.filter(l => l.level === f.level);
  if (f.category) list = list.filter(l => l.category === f.category);
  if (f.saved) list = list.filter(l => Saved.has(l.id));
  return list.filter(l => matches(f.q, l.title, l.section, l.idea, l.explanation, l.outcome));
}
function filterActivities(){
  const f = filters.activities;
  return DB.activities.items.filter(a =>
    (!f.category || a.category === f.category) && (!f.level || a.levels.includes(f.level)) && (!f.saved || Saved.has(a.id)) &&
    matches(f.q, a.title, a.goal, a.how, a.phrases, a.sub));
}
function filterGrammar(){
  const f = filters.grammar;
  return grammarLessons().filter(l => (!f.level || l.level === f.level) && matches(f.q, l.title, l.idea, l.explanation));
}
function refreshGrid(root, cards, total, noun){
  root.querySelector('.grid').innerHTML = cards.join('') || '<div class="empty">Ничего не нашлось — сбросьте фильтры.</div>';
  root.querySelector('.result-line .muted').textContent = `${cards.length} of ${total} ${noun}`;
}
const studentJourney = () => `<div class="journey">${DB.structure.experience.map(e => `<div class="jstep"><div class="at">${esc(e.at)}${ruI(e.at)}</div><div class="feel">«${esc(e.feel)}»${ru(e.feel)}</div></div>`).join('')}</div>`;

    return `<a class="nav-btn${currentRoute === route ? ' active' : ''}" href="#/${route}"><span class="ni">${p.icon}</span>${esc(p.title)}${counts[key] ? `<span class="nc">${counts[key]}</span>` : ''}</a>`;
  }).join('');
  $('#nav').innerHTML = html;
  $('#navMobile').innerHTML = html;
  const act = $('#navMobile .active'); if (act) act.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function route(){
  const h = location.hash;
  const linked = (h.match(/^#lesson=([\w-]+)/) || [])[1];   // ссылка ученика на урок
  if (linked) {
    if (!byId[linked]) { toast('Урок по ссылке не найден — возможно, его переименовали', true); location.hash = '#/'; return; }
    if (show.classList.contains('open')) return;
    currentRoute = byId[linked].play ? 'activities' : 'lessons';
    renderPage();
    safeHistory('replaceState', null, '#/' + currentRoute);   // «Назад» из урока вернёт в раздел, а не в тот же урок
    openShow(byId[linked]);
    return;
  }
  const r = h.replace(/^#\/?/, '');
  const target = Pages[r] ? r : '';
  if (show.classList.contains('open')) { closeShowUI(); if ($('#page').dataset.route === target) return; }
  currentRoute = target;
  renderPage();
}
function renderPage(){
  closeDrawer();
  const page = $('#page');
  page.dataset.route = currentRoute;
  Pages[currentRoute || 'home'].render(page);
  document.title = `YORK! — ${Pages[currentRoute || 'home'].title === 'Dashboard' ? 'Trial Lesson Hub' : Pages[currentRoute || 'home'].title}`;
  renderNav();
  window.scrollTo(0, 0);
}

/* ---------- копирование ---------- */
let toastTimer;
function toast(msg, isErr){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), isErr ? 4000 : 1800);
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  return ok;
}

async function copyPhrases(t){
  const text = (t.explanation || t.phrases).join('\n');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e){ ok = fallbackCopy(text); }
  if (ok) toast(`Скопировано фраз: ${(t.explanation || t.phrases).length}`);
  else toast('Не получилось скопировать — выделите фразы в карточке вручную', true);
}

/* ---------- мини-урок (режим показа) ---------- */
const show = $('#show');
const TASK_TITLES = { choose: 'Выбери правильный вариант', build: 'Собери предложение', match: 'Найди пару', reveal: 'Скажи сам — потом проверь' };
let lesson = null;   // { topic, steps: [{label, node}], cur, started, clockTimer }

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function node(html){ const d = document.createElement('div'); d.className = 'step'; d.innerHTML = html; return d; }
const head = (kicker, title) => `<p class="kicker">${kicker}</p>${title ? `<h2>${esc(title)}${ru(title)}</h2>` : ''}`;

function lessonSteps(t){
  if (t.play) return actSteps(t);
  const L = t.lesson || {};
  const steps = [];
  if (L.warmup) steps.push({ label: 'Разминка', node: stepWarmup(L.warmup) });
  steps.push({ label: 'Тема', node: stepIntro(t) });
  if (L.visual) steps.push({ label: 'Схема', node: stepVisual(t, L.visual) });
  (L.tasks || []).forEach((task, i) => steps.push({ label: `Задание ${i + 1}`, node: stepTask(task, i + 1) }));
  if (L.speak) steps.push({ label: 'Говорим', node: stepSpeak(L.speak) });
  steps.push({ label: 'Итог', node: stepResult(t) });
  return steps;
}
const stepCount = t => { if (t.play) return 2; const L = t.lesson || {}; return (L.warmup ? 1 : 0) + 1 + (L.visual ? 1 : 0) + (L.tasks || []).length + (L.speak ? 1 : 0) + 1; };

function stepWarmup(qs){
  return node(`${head('Разминка', 'Let’s talk!')}<div class="bubbles">${qs.map(q => `<div class="bubble">${T(q)}</div>`).join('')}</div>`);
}

function stepIntro(t){
  return node(`<div class="show-ic">${t.icon}</div><h2>${esc(t.title)}${ru(t.title)}</h2>
    <p class="show-idea">${esc(t.idea)}</p>
    <ul class="show-phrases">${(t.explanation || t.phrases).map(p => `<li>${T(p)}</li>`).join('')}</ul>`);
}

function stepVisual(t, v){
  let body = '';
  if (v.type === 'compare') body = `<div class="v-compare">${v.cols.map(c => `<div class="v-col">
      <div class="ic">${c.icon || ''}</div><h4>${esc(c.label)}</h4>${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ''}
      <ul>${c.examples.map(x => `<li>${T(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if (v.type === 'formula') body = `<div class="v-formula">${v.parts.map(p => `<div class="v-part"><b>${esc(p.t)}</b><span>${T(p.ex)}</span></div>`).join('')}</div>`;
  if (v.type === 'scale') body = `<div class="v-scale">${v.steps.map(s => `<div class="v-step"><b>${esc(s.w)}</b><span>${esc(s.d)}</span></div>`).join('')}</div>`;
  if (v.type === 'upgrade') body = `<div class="v-up">${v.pairs.map(([a, b]) => `<div class="v-up-row"><span class="from">${T(a)}</span><span class="arr">→</span><span class="to">${T(b)}</span></div>`).join('')}</div>`;
  if (v.type === 'table') body = `<div class="v-table">${v.rows.map(r => `<div class="v-row"><span class="e">${r[0]}</span><span>${T(r[1])}</span><span>${T(r[2] || '')}</span></div>`).join('')}</div>`;
  return node(`${head('Схема', t.title)}${body}${v.note ? `<div class="note">${esc(v.note)}</div>` : ''}`);
}

function stepTask(task, n){
  const d = node(`${head(`Задание ${n}<span class="task-score" hidden></span>`, task.title || TASK_TITLES[task.type])}<div class="items"></div>`);
  const box = d.querySelector('.items');
  const score = d.querySelector('.task-score');
  const total = task.type === 'match' ? task.pairs.length : task.items.length;
  let doneCount = 0;
  const done = () => { doneCount++; score.hidden = false; score.textContent = `${doneCount} / ${total}` + (doneCount === total ? ' 🎉' : ''); };

  if (task.type === 'choose') task.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<span class="pic">${it.pic || '❔'}</span>
      <div class="q">${esc(it.q).replace(/___/g, '<span class="gap">?</span>')}${trOf(it.q) ? `<span class="ru ru-after">${esc(trOf(it.q))}</span>` : ''}</div>
      <div class="opts"></div>`;
    const opts = el.querySelector('.opts');
    shuffle(it.options.map((o, i) => ({ o, i }))).forEach(({ o, i }) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o;
      b.onclick = () => {
        if (i !== it.a) { b.classList.add('wrong'); b.disabled = true; return; }
        b.classList.add('right'); el.classList.add('ok');
        opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
        const gaps = el.querySelectorAll('.gap');
        const parts = o.split(' / ');   // «drinks / is drinking» → в два пропуска
        gaps.forEach((g, k) => { g.textContent = gaps.length > 1 ? (parts[k] || o) : o; g.classList.add('filled'); });
        done();
      };
      opts.appendChild(b);
    });
    box.appendChild(el);
  });

  if (task.type === 'build') task.items.forEach(sentence => {
    const words = sentence.split(' ');
    let order = shuffle(words);
    for (let k = 0; k < 5 && words.length > 1 && order.join(' ') === sentence; k++) order = shuffle(words);
    const el = document.createElement('div');
    el.className = 'build';
    el.innerHTML = `${trOf(sentence) ? `<div class="ru ru-prompt">${esc(trOf(sentence))}</div>` : ''}<div class="line"></div><div class="build-row"><div class="bank"></div><button class="linkbtn">показать ответ</button></div>`;
    const line = el.querySelector('.line'), bank = el.querySelector('.bank');
    let solved = false;
    const check = () => {
      el.classList.remove('bad');
      if (bank.children.length) return;
      const got = [...line.children].map(w => w.textContent).join(' ');
      if (got === sentence) { solved = true; el.classList.add('ok'); done(); }
      else el.classList.add('bad');
    };
    order.forEach(w => {
      const b = document.createElement('button');
      b.className = 'w'; b.textContent = w;
      b.onclick = () => { if (solved) return; (b.parentNode === bank ? line : bank).appendChild(b); check(); };
      bank.appendChild(b);
    });
    el.querySelector('.linkbtn').onclick = () => {
      if (solved) return;
      const btns = [...line.children, ...bank.children];
      words.forEach(w => { const b = btns.find(x => x.textContent === w && !x.dataset.used); b.dataset.used = 1; line.appendChild(b); });
      check();
    };
    box.appendChild(el);
  });

  if (task.type === 'match') {
    const wrap = document.createElement('div');
    wrap.className = 'match';
    const L = document.createElement('div'), R = document.createElement('div');
    L.className = R.className = 'match-col';
    let sel = { l: null, r: null };
    const mk = (text, idx, side) => {
      const b = document.createElement('button');
      b.className = 'm'; b.innerHTML = T(text); b.dataset.idx = idx;
      b.onclick = () => {
        if (b.classList.contains('done')) return;
        (side === 'l' ? L : R).querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel'); sel[side] = b;
        if (sel.l && sel.r) {
          const a = sel.l, c = sel.r;
          if (a.dataset.idx === c.dataset.idx) { a.className = c.className = 'm done'; done(); }
          else [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('wrong'); setTimeout(() => x.classList.remove('wrong'), 450); });
          sel = { l: null, r: null };
        }
      };
      return b;
    };
    task.pairs.forEach(([a], i) => L.appendChild(mk(a, i, 'l')));
    shuffle(task.pairs.map(([, b], i) => ({ b, i }))).forEach(({ b, i }) => R.appendChild(mk(b, i, 'r')));
    wrap.append(L, R);
    box.appendChild(wrap);
  }

  if (task.type === 'reveal') task.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'reveal';
    el.innerHTML = `<span class="q">${T(it.q)}</span><button class="opt">Ответ</button><div class="a">${T(it.a)}</div>`;
    const b = el.querySelector('button');
    let counted = false;
    b.onclick = () => {
      const open = el.classList.toggle('open');
      b.textContent = open ? 'Скрыть' : 'Ответ';
      if (open && !counted) { counted = true; done(); }
    };
    box.appendChild(el);
  });
  return d;
}

function stepSpeak(list){
  const d = node(`${head('Говорим', 'Your turn!')}<div class="speak">${list.map(s => `<div class="speak-card">
      <div class="q">${T(s.q)}</div><div class="h">${esc(s.hint || '')}${ru(s.hint)}</div></div>`).join('')}</div>`);
  d.querySelectorAll('.speak-card').forEach(c => c.appendChild(makeTimer(60)));
  return d;
}

function stepResult(t){
  return node(`${head('Итог', '')}<div class="result-big">${esc(t.outcome)}</div>
    <div class="exit-mini"><b>🎟️ Exit ticket</b> Назови: 3 новых слова · 1 новую конструкцию · 1 предложение о себе</div>
    <p class="kicker">Продолжаем говорить</p>
    <div class="chips">${DB.meta.universalTopics.map(u => `<span class="chip" style="font-size:1em;padding:8px 16px">${esc(u)}${ruI(u)}</span>`).join('')}</div>`);
}

/* ---------- разговорные активности ---------- */
let runningTimers = [];   // останавливаем при закрытии урока

// кнопка-таймер: клик — старт, ещё клик — пауза, после «Время!» — заново
function makeTimer(sec, cls){
  const b = document.createElement('button');
  b.className = 'timer' + (cls ? ' ' + cls : '');
  let left = sec, id = null;
  const fmt = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
  const draw = () => { b.textContent = left > 0 ? `⏱ ${fmt(left)}` : 'Время! ✓'; };
  const stop = () => { clearInterval(id); runningTimers = runningTimers.filter(x => x !== id); id = null; b.classList.remove('run'); };
  b.onclick = () => {
    if (id) return stop();
    if (left <= 0) { left = sec; b.classList.remove('over'); draw(); }
    b.classList.add('run');
    id = setInterval(() => { left--; draw(); if (left <= 0) { stop(); b.classList.add('over'); b.dispatchEvent(new Event('timeup')); } }, 1000);
    runningTimers.push(id);
  };
  draw();
  return b;
}

// вкладки внутри экрана (уровни, категории)
function makeTabs(labels, onPick){
  const w = document.createElement('div');
  w.className = 'tabs';
  labels.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'stp' + (i ? '' : ' cur');
    b.textContent = l;
    b.onclick = () => { w.querySelectorAll('.stp').forEach(x => x.classList.remove('cur')); b.classList.add('cur'); onPick(i); };
    w.appendChild(b);
  });
  return w;
}

const helper = list => list && list.length ? `<div class="helper">💬 ${list.map(esc).join(' · ')}</div>` : '';
function btn(text, cls, onclick){ const b = document.createElement('button'); b.className = cls || 'btn'; b.textContent = text; b.onclick = onclick; return b; }

function actSteps(a){
  const intro = node(`<div class="show-ic">${a.icon}</div><h2>${esc(a.title)}${ru(a.title)}</h2>
    <p class="show-idea">${T(a.rules)}</p>
    ${a.phrases.length ? `<p class="kicker">Фразы в помощь</p><ul class="show-phrases">${a.phrases.map(p => `<li>${T(p)}</li>`).join('')}</ul>` : ''}`);
  const play = node(`${head(a.icon + ' ' + esc(a.title), '')}`);
  PLAY[a.play.type](a, play);
  return [{ label: 'Правила', node: intro }, { label: 'Играем', node: play }];
}

const PLAY = {
  truths(a, root){
    const area = document.createElement('div');
    const draw = i => {
      area.innerHTML = '';
      if (i === a.play.sets.length) {   // «Твоя очередь» — три пустые карточки
        area.innerHTML = `<p class="big-q">Your turn! Tell me 2 truths and 1 lie.<span class="ru">Твоя очередь! Назови 2 правдивых факта и 1 ложный.</span></p>`;
        const g = document.createElement('div'); g.className = 'facts';
        const states = ['?', '🤔 My guess', '✓ Truth', '✗ Lie'], cls = ['', 'guess', 'truth', 'lie'];
        [1, 2, 3].forEach(n => {
          const c = document.createElement('div'); c.className = 'fact';
          c.innerHTML = `<span class="n">${n}</span><div class="t" contenteditable="true" data-ph="Fact ${n}…"></div>`;
          let k = 0;
          c.appendChild(btn(states[0], 'opt', function(){ k = (k + 1) % states.length; this.textContent = states[k]; c.className = 'fact ' + cls[k]; }));
          g.appendChild(c);
        });
        area.appendChild(g);
        area.insertAdjacentHTML('beforeend', `<p class="muted" style="margin-top:12px">Факты можно вписать прямо в карточки. Кнопка под фактом: догадка → правда → ложь.</p>`);
        return;
      }
      const set = a.play.sets[i];
      area.innerHTML = `<p class="big-q">${esc(set.intro)} Which one is a lie?<span class="ru">Познакомься с Томом. Какой факт — ложь?</span></p>`;
      const g = document.createElement('div'); g.className = 'facts';
      set.facts.forEach(([text, isLie], n) => {
        const c = document.createElement('button'); c.className = 'fact';
        c.innerHTML = `<span class="n">${n + 1}</span><span class="t">${T(text)}</span><span class="verdict"></span>`;
        c.onclick = () => { c.classList.add(isLie ? 'lie' : 'truth'); c.querySelector('.verdict').textContent = isLie ? '✗ LIE!' : '✓ True'; };
        g.appendChild(c);
      });
      area.appendChild(g);
    };
    root.append(makeTabs([...a.play.sets.map(s => 'Tom · ' + s.label), '🙋 Your turn'], draw), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw(0);
  },

  rather(a, root){
    const area = document.createElement('div');
    let set = 0, qi = 0;
    const draw = () => {
      const [x, y] = a.play.sets[set].qs[qi];
      area.innerHTML = `<p class="big-q">Would you rather…<span class="ru">Что бы ты выбрал(а)…</span></p>`;
      const vs = document.createElement('div'); vs.className = 'vs';
      const pick = b => { vs.querySelectorAll('.vs-opt').forEach(o => o.classList.toggle('picked', o === b)); };
      const bx = btn(x, 'vs-opt', function(){ pick(this); }), by = btn(y, 'vs-opt', function(){ pick(this); });
      bx.innerHTML = T(x); by.innerHTML = T(y);
      vs.append(bx, Object.assign(document.createElement('span'), { className: 'vs-or', textContent: 'or' }), by);
      area.appendChild(vs);
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${qi + 1} / ${a.play.sets[set].qs.length}` }),
        btn('Другой вопрос →', 'btn primary', () => { qi = (qi + 1) % a.play.sets[set].qs.length; draw(); }));
      area.appendChild(row);
    };
    root.append(makeTabs(a.play.sets.map(s => s.label), i => { set = i; qi = 0; draw(); }), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw();
  },

  ranking(a, root){
    const area = document.createElement('div');
    const draw = i => {
      const set = a.play.sets[i];
      let ranked = [];
      area.innerHTML = `<p class="big-q">${T(set.title)}</p><p class="muted">Нажимайте по порядку: сначала самое важное. Повторное нажатие убирает из рейтинга.</p>`;
      const list = document.createElement('div'); list.className = 'rank';
      const paint = () => list.querySelectorAll('.rank-item').forEach(b => {
        const pos = ranked.indexOf(b.dataset.v);
        b.querySelector('.pos').textContent = pos >= 0 ? pos + 1 : '';
        b.classList.toggle('on', pos >= 0);
        b.style.order = pos >= 0 ? pos : 99;
      });
      set.items.forEach(v => {
        const b = document.createElement('button'); b.className = 'rank-item'; b.dataset.v = v;
        b.innerHTML = `<span class="pos"></span><span>${T(v)}</span>`;
        b.onclick = () => { ranked = ranked.includes(v) ? ranked.filter(x => x !== v) : [...ranked, v]; paint(); };
        list.appendChild(b);
      });
      area.appendChild(list);
      area.appendChild(btn('Сбросить', 'btn', () => { ranked = []; paint(); }));
      paint();
    };
    root.append(makeTabs(a.play.sets.map(s => s.label), draw), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw(0);
  },

  situations(a, root){
    const area = document.createElement('div');
    let cat = 0, ci = 0;
    const draw = () => {
      const c = a.play.cats[cat].cards[ci];
      area.innerHTML = `<div class="sit-card"><div class="sit-lbl">${esc(a.play.cats[cat].label)}</div><p>${T(c.s)}</p>
        <div class="sit-role">🎭 Teacher plays: ${esc(c.role)}${ruI(c.role)}</div></div>`;
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${ci + 1} / ${a.play.cats[cat].cards.length}` }),
        makeTimer(120), btn('Следующая ситуация →', 'btn primary', () => { ci = (ci + 1) % a.play.cats[cat].cards.length; draw(); }));
      area.appendChild(row);
    };
    root.append(makeTabs(a.play.cats.map(c => c.label), i => { cat = i; ci = 0; draw(); }), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw();
  },

  minute(a, root){
    const area = document.createElement('div');
    let ti = 0;
    const draw = () => {
      const t = a.play.topics[ti];
      area.innerHTML = `<p class="big-q">${T(t.t)}</p>
        <ul class="show-phrases">${t.support.map(s => `<li>${T(s)}</li>`).join('')}</ul>`;
      const row = document.createElement('div'); row.className = 'play-row';
      const timer = makeTimer(60, 'big');
      const up = document.createElement('div'); up.className = 'v-up'; up.hidden = true;
      up.innerHTML = `<p class="kicker" style="margin-top:8px">Level up — скажи ещё раз вот так</p>` +
        t.upgrade.map(([x, y]) => `<div class="v-up-row"><span class="from">${T(x)}</span><span class="arr">→</span><span class="to">${T(y)}</span></div>`).join('');
      timer.addEventListener('timeup', () => { up.hidden = false; });
      row.append(timer, btn('⬆ Level up', 'btn', () => { up.hidden = !up.hidden; }),
        btn('Другая тема →', 'btn primary', () => { ti = (ti + 1) % a.play.topics.length; draw(); }));
      area.append(row, up);
    };
    root.appendChild(area);
    draw();
  },

  picture(a, root){
    const area = document.createElement('div');
    let si = 0, lvl = 0;
    const qs = document.createElement('div');
    const drawQs = () => { qs.innerHTML = `<div class="bubbles">${a.play.questions[lvl].qs.map(q => `<div class="bubble">${T(q)}</div>`).join('')}</div>`; };
    const draw = () => {
      const sc = a.play.scenes[si];
      area.innerHTML = `<div class="scene" role="img" aria-label="${esc(sc.title)}">${sc.rows.map(r => `<div>${r}</div>`).join('')}</div>`;
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${si + 1} / ${a.play.scenes.length}` }),
        btn('Другая картинка →', 'btn primary', () => { si = (si + 1) % a.play.scenes.length; draw(); }));
      area.appendChild(row);
    };
    const grid = document.createElement('div'); grid.className = 'pic-grid';
    const right = document.createElement('div');
    right.append(makeTabs(a.play.questions.map(q => q.label), i => { lvl = i; drawQs(); }), qs);
    grid.append(area, right);
    root.appendChild(grid);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw(); drawQs();
  },

  detective(a, root){
    const area = document.createElement('div');
    let ci = 0;
    const draw = () => {
      const c = a.play.cases[ci];
      area.innerHTML = '';
      const clues = document.createElement('div'); clues.className = 'clues';
      c.clues.forEach((cl, i) => {
        const b = document.createElement('button'); b.className = 'clue';
        b.innerHTML = `<span>🔍 Clue ${i + 1}</span>`;
        b.onclick = () => { b.classList.add('open'); b.innerHTML = `<span>${T(cl)}</span>`; };
        clues.appendChild(b);
      });
      area.append(clues);
      area.insertAdjacentHTML('beforeend', `<p class="big-q" style="margin-top:20px">❓ ${T(c.q)}</p>`);
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `Дело ${ci + 1} / ${a.play.cases.length}` }),
        btn('Следующее дело →', 'btn primary', () => { ci = (ci + 1) % a.play.cases.length; draw(); }));
      area.appendChild(row);
    };
    root.appendChild(area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw();
  },

  debate(a, root){
    const area = document.createElement('div');
    let ti = 0;
    const draw = () => {
      area.innerHTML = `<p class="big-q">«${esc(a.play.topics[ti])}»${ru(a.play.topics[ti])}</p>`;
      const sides = document.createElement('div'); sides.className = 'sides';
      [['👍 For', 'for'], ['👎 Against', 'against']].forEach(([label, cls]) => {
        const s = document.createElement('div'); s.className = 'side ' + cls;
        s.innerHTML = `<h4>${label}</h4>`;
        s.appendChild(makeTimer(60));
        sides.appendChild(s);
      });
      area.appendChild(sides);
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${ti + 1} / ${a.play.topics.length}` }),
        btn('Другая тема →', 'btn primary', () => { ti = (ti + 1) % a.play.topics.length; draw(); }));
      area.appendChild(row);
    };
    root.appendChild(area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw();
  },

  exit(a, root){
    root.insertAdjacentHTML('beforeend', `<h2>Сегодня ты научился говорить…</h2>
      <div class="exit">
        <div class="exit-box"><b>🆕 3 новых слова</b>
          <input placeholder="1." aria-label="Новое слово 1"><input placeholder="2." aria-label="Новое слово 2"><input placeholder="3." aria-label="Новое слово 3"></div>
        <div class="exit-box"><b>🧩 1 новая конструкция</b><input placeholder="например, I’m really into…" aria-label="Новая конструкция"></div>
        <div class="exit-box"><b>🙋 1 предложение о себе</b><input placeholder="…" aria-label="Предложение о себе"></div>
      </div>`);
    const done = btn('✓ Готово', 'btn primary', () => {
      const vals = [...root.querySelectorAll('input')].map(i => i.value.trim());
      if (!vals.some(Boolean)) return toast('Сначала впишите хотя бы одно слово или фразу', true);
      out.innerHTML = `<div class="result-big">Сегодня ты научился говорить: ${vals.filter(Boolean).map(esc).join(' · ')}</div>`;
    });
    const out = document.createElement('div');
    out.style.marginTop = '16px';
    root.append(done, out);
  },
};

function goStep(i){
  if (!lesson) return;
  lesson.cur = Math.max(0, Math.min(i, lesson.steps.length - 1));
  lesson.steps.forEach((s, k) => s.node.classList.toggle('cur', k === lesson.cur));
  const pills = [...$('#steps').children];
  pills.forEach((p, k) => { p.classList.toggle('cur', k === lesson.cur); p.classList.toggle('done', k < lesson.cur); });
  pills[lesson.cur].scrollIntoView({ block: 'nearest', inline: 'center' });
  $('#stepCount').textContent = `${lesson.cur + 1} / ${lesson.steps.length}`;
  $('#stepPrev').style.visibility = lesson.cur === 0 ? 'hidden' : '';
  $('#stepNext').textContent = lesson.cur === lesson.steps.length - 1 ? 'Завершить ✓' : 'Дальше →';
  $('#showScroll').scrollTop = 0;
}

function openShow(t){
  if (!t) return;
  const steps = lessonSteps(t);
  const body = $('#showBody'); body.innerHTML = '';
  steps.forEach(s => body.appendChild(s.node));
  const nav = $('#steps'); nav.innerHTML = '';
  steps.forEach((s, k) => { const b = document.createElement('button'); b.className = 'stp'; b.textContent = s.label; b.onclick = () => goStep(k); nav.appendChild(b); });
  if (lesson) clearInterval(lesson.clockTimer);
  lesson = { topic: t, steps, cur: 0, started: Date.now() };
  const tick = () => { const s = Math.floor((Date.now() - lesson.started) / 1000); $('#clock').textContent = `⏱ ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  tick(); lesson.clockTimer = setInterval(tick, 1000);
  show.classList.add('open');
  document.body.style.overflow = 'hidden';
  goStep(0);
  safeHistory('pushState', { show: true }, '#lesson=' + t.id);   // «Назад» на телефоне закрывает урок
  $('#stepNext').focus();
}

// изменение адреса — только удобство (кнопка «Назад», ссылка); если браузер запрещает, урок всё равно работает
function safeHistory(method, state, hash){
  try { history[method](state, '', hash || ('#/' + currentRoute)); } catch(e){}
}

function closeShowUI(){
  show.classList.remove('open');
  document.body.style.overflow = '';
  if (lesson) clearInterval(lesson.clockTimer);
  runningTimers.forEach(clearInterval); runningTimers = [];
  lesson = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (location.hash.startsWith('#lesson=')) safeHistory('replaceState', null);   // не перетираем раздел, куда человек уже перешёл
}

function closeShow(){
  if (history.state && history.state.show) history.back(); // закроется через popstate
  else closeShowUI();
}

window.addEventListener('popstate', () => { if (show.classList.contains('open')) closeShowUI(); });
$('#showBack').onclick = closeShow;
$('#stepPrev').onclick = () => goStep(lesson.cur - 1);
$('#stepNext').onclick = () => { if (lesson.cur === lesson.steps.length - 1) closeShow(); else goStep(lesson.cur + 1); };
$('#showFs').onclick = () => {
  if (document.fullscreenElement) return document.exitFullscreen().catch(() => {});
  if (!show.requestFullscreen) return toast('Этот браузер не поддерживает полноэкранный режим', true);
  show.requestFullscreen().catch(() => toast('Не удалось включить полноэкранный режим', true));
};
$('#showLink').onclick = async () => {
  const url = location.href.split('#')[0] + '#lesson=' + lesson.topic.id;
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch(e){ ok = fallbackCopy(url); }
  if (ok) toast('Ссылка на урок скопирована — отправьте ученику');
  else toast('Не получилось скопировать ссылку: ' + url, true);
};
document.addEventListener('keydown', e => {
  if (!show.classList.contains('open')) return;
  if (e.key === 'Escape' && !document.fullscreenElement) closeShow();
  if (e.key === 'ArrowRight') goStep(lesson.cur + 1);
  if (e.key === 'ArrowLeft' && lesson.cur > 0) goStep(lesson.cur - 1);
});
