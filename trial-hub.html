/* ---------- копирование ---------- */
let toastTimer;
function toast(msg, isErr){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), isErr ? 4000 : 1800);
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  return ok;
}

async function copyPhrases(t){
  const text = (t.explanation || t.phrases).join('\n');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e){ ok = fallbackCopy(text); }
  if (ok) toast(`Скопировано фраз: ${(t.explanation || t.phrases).length}`);
  else toast('Не получилось скопировать — выделите фразы в карточке вручную', true);
}

/* ---------- мини-урок (режим показа) ---------- */
const show = $('#show');
const TASK_TITLES = { choose: 'Выбери правильный вариант', build: 'Собери предложение', match: 'Найди пару', reveal: 'Скажи сам — потом проверь' };
let lesson = null;   // { topic, steps: [{label, node}], cur, started, clockTimer }
let liveOnShowClose = null;   // колбэк: вернуться в Live mode после показа темы ученику

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function node(html){ const d = document.createElement('div'); d.className = 'step'; d.innerHTML = html; return d; }
const head = (kicker, title) => `<p class="kicker">${kicker}</p>${title ? `<h2>${esc(title)}${ru(title)}</h2>` : ''}`;

function lessonSteps(t){
  if (t.play) return actSteps(t);
  const L = t.lesson || {};
  const steps = [];
  if (L.warmup) steps.push({ label: 'Разминка', node: stepWarmup(L.warmup) });
  steps.push({ label: 'Тема', node: stepIntro(t) });
  if (L.visual) steps.push({ label: 'Схема', node: stepVisual(t, L.visual) });
  (L.tasks || []).forEach((task, i) => steps.push({ label: `Задание ${i + 1}`, node: stepTask(task, i + 1) }));
  if (L.speak) steps.push({ label: 'Говорим', node: stepSpeak(L.speak) });
  steps.push({ label: 'Итог', node: stepResult(t) });
  return steps;
}
const stepCount = t => { if (t.play) return 2; const L = t.lesson || {}; return (L.warmup ? 1 : 0) + 1 + (L.visual ? 1 : 0) + (L.tasks || []).length + (L.speak ? 1 : 0) + 1; };

function stepWarmup(qs){
  return node(`${head('Разминка', 'Let’s talk!')}<div class="bubbles">${qs.map(q => `<div class="bubble">${T(q)}</div>`).join('')}</div>`);
}

function stepIntro(t){
  return node(`<div class="show-ic">${t.icon}</div><h2>${esc(t.title)}${ru(t.title)}</h2>
    <p class="show-idea">${esc(t.idea)}</p>
    <ul class="show-phrases">${(t.explanation || t.phrases).map(p => `<li>${T(p)}</li>`).join('')}</ul>`);
}

function stepVisual(t, v){
  let body = '';
  if (v.type === 'compare') body = `<div class="v-compare">${v.cols.map(c => `<div class="v-col">
      <div class="ic">${c.icon || ''}</div><h4>${esc(c.label)}</h4>${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ''}
      <ul>${c.examples.map(x => `<li>${T(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if (v.type === 'formula') body = `<div class="v-formula">${v.parts.map(p => `<div class="v-part"><b>${esc(p.t)}</b><span>${T(p.ex)}</span></div>`).join('')}</div>`;
  if (v.type === 'scale') body = `<div class="v-scale">${v.steps.map(s => `<div class="v-step"><b>${esc(s.w)}</b><span>${esc(s.d)}</span></div>`).join('')}</div>`;
  if (v.type === 'upgrade') body = `<div class="v-up">${v.pairs.map(([a, b]) => `<div class="v-up-row"><span class="from">${T(a)}</span><span class="arr">→</span><span class="to">${T(b)}</span></div>`).join('')}</div>`;
  if (v.type === 'table') body = `<div class="v-table">${v.rows.map(r => `<div class="v-row"><span class="e">${r[0]}</span><span>${T(r[1])}</span><span>${T(r[2] || '')}</span></div>`).join('')}</div>`;
  return node(`${head('Схема', t.title)}${body}${v.note ? `<div class="note">${esc(v.note)}</div>` : ''}`);
}

function stepTask(task, n){
  const d = node(`${head(`Задание ${n}<span class="task-score" hidden></span>`, task.title || TASK_TITLES[task.type])}<div class="items"></div>`);
  const box = d.querySelector('.items');
  const score = d.querySelector('.task-score');
  const total = task.type === 'match' ? task.pairs.length : task.items.length;
  let doneCount = 0;
  const done = () => { doneCount++; score.hidden = false; score.textContent = `${doneCount} / ${total}` + (doneCount === total ? ' ' : ''); };

  if (task.type === 'choose') task.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<span class="pic">${it.pic || ''}</span>
      <div class="q">${esc(it.q).replace(/___/g, '<span class="gap">?</span>')}${trOf(it.q) ? `<span class="ru ru-after">${esc(trOf(it.q))}</span>` : ''}</div>
      <div class="opts"></div>`;
    const opts = el.querySelector('.opts');
    shuffle(it.options.map((o, i) => ({ o, i }))).forEach(({ o, i }) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o;
      b.onclick = () => {
        if (i !== it.a) { b.classList.add('wrong'); b.disabled = true; return; }
        b.classList.add('right'); el.classList.add('ok');
        opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
        const gaps = el.querySelectorAll('.gap');
        const parts = o.split(' / ');   // «drinks / is drinking» → в два пропуска
        gaps.forEach((g, k) => { g.textContent = gaps.length > 1 ? (parts[k] || o) : o; g.classList.add('filled'); });
        done();
      };
      opts.appendChild(b);
    });
    box.appendChild(el);
  });

  if (task.type === 'build') task.items.forEach(sentence => {
    const words = sentence.split(' ');
    let order = shuffle(words);
    for (let k = 0; k < 5 && words.length > 1 && order.join(' ') === sentence; k++) order = shuffle(words);
    const el = document.createElement('div');
    el.className = 'build';
    el.innerHTML = `${trOf(sentence) ? `<div class="ru ru-prompt">${esc(trOf(sentence))}</div>` : ''}<div class="line"></div><div class="build-row"><div class="bank"></div><button class="linkbtn">показать ответ</button></div>`;
    const line = el.querySelector('.line'), bank = el.querySelector('.bank');
    let solved = false;
    const check = () => {
      el.classList.remove('bad');
      if (bank.children.length) return;
      const got = [...line.children].map(w => w.textContent).join(' ');
      if (got === sentence) { solved = true; el.classList.add('ok'); done(); }
      else el.classList.add('bad');
    };
    order.forEach(w => {
      const b = document.createElement('button');
      b.className = 'w'; b.textContent = w;
      b.onclick = () => { if (solved) return; (b.parentNode === bank ? line : bank).appendChild(b); check(); };
      bank.appendChild(b);
    });
    el.querySelector('.linkbtn').onclick = () => {
      if (solved) return;
      const btns = [...line.children, ...bank.children];
      words.forEach(w => { const b = btns.find(x => x.textContent === w && !x.dataset.used); b.dataset.used = 1; line.appendChild(b); });
      check();
    };
    box.appendChild(el);
  });

  if (task.type === 'match') {
    const wrap = document.createElement('div');
    wrap.className = 'match';
    const L = document.createElement('div'), R = document.createElement('div');
    L.className = R.className = 'match-col';
    let sel = { l: null, r: null };
    const mk = (text, idx, side) => {
      const b = document.createElement('button');
      b.className = 'm'; b.innerHTML = T(text); b.dataset.idx = idx;
      b.onclick = () => {
        if (b.classList.contains('done')) return;
        (side === 'l' ? L : R).querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel'); sel[side] = b;
        if (sel.l && sel.r) {
          const a = sel.l, c = sel.r;
          if (a.dataset.idx === c.dataset.idx) { a.className = c.className = 'm done'; done(); }
          else [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('wrong'); setTimeout(() => x.classList.remove('wrong'), 450); });
          sel = { l: null, r: null };
        }
      };
      return b;
    };
    task.pairs.forEach(([a], i) => L.appendChild(mk(a, i, 'l')));
    shuffle(task.pairs.map(([, b], i) => ({ b, i }))).forEach(({ b, i }) => R.appendChild(mk(b, i, 'r')));
    wrap.append(L, R);
    box.appendChild(wrap);
  }

  if (task.type === 'reveal') task.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'reveal';
    el.innerHTML = `<span class="q">${T(it.q)}</span><button class="opt">Ответ</button><div class="a">${T(it.a)}</div>`;
    const b = el.querySelector('button');
    let counted = false;
    b.onclick = () => {
      const open = el.classList.toggle('open');
      b.textContent = open ? 'Скрыть' : 'Ответ';
      if (open && !counted) { counted = true; done(); }
    };
    box.appendChild(el);
  });
  return d;
}

function stepSpeak(list){
  const d = node(`${head('Говорим', 'Your turn!')}<div class="speak">${list.map(s => `<div class="speak-card">
      <div class="q">${T(s.q)}</div><div class="h">${esc(s.hint || '')}${ru(s.hint)}</div></div>`).join('')}</div>`);
  d.querySelectorAll('.speak-card').forEach(c => c.appendChild(makeTimer(60)));
  return d;

function stepResult(t){
  return node(`${head('Итог', '')}<div class="result-big">${esc(t.outcome)}</div>
    <div class="exit-mini"><b>Exit ticket</b> Назови: 3 новых слова · 1 новую конструкцию · 1 предложение о себе</div>

}

/* ---------- разговорные активности ---------- */
let runningTimers = [];   // останавливаем при закрытии урока

// кнопка-таймер: клик — старт, ещё клик — пауза, после «Время!» — заново
function makeTimer(sec, cls){
  const b = document.createElement('button');
  b.className = 'timer' + (cls ? ' ' + cls : '');
  let left = sec, id = null;
  const fmt = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
  const draw = () => { b.textContent = left > 0 ? `${fmt(left)}` : 'Время! ✓'; };
  const stop = () => { clearInterval(id); runningTimers = runningTimers.filter(x => x !== id); id = null; b.classList.remove('run'); };
  b.onclick = () => {
    if (id) return stop();
    if (left <= 0) { left = sec; b.classList.remove('over'); draw(); }
    b.classList.add('run');
    id = setInterval(() => { left--; draw(); if (left <= 0) { stop(); b.classList.add('over'); b.dispatchEvent(new Event('timeup')); } }, 1000);
    runningTimers.push(id);
  };
  draw();
  return b;
}

// вкладки внутри экрана (уровни, категории)
function makeTabs(labels, onPick){
  const w = document.createElement('div');
  w.className = 'tabs';
  labels.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'stp' + (i ? '' : ' cur');
    b.textContent = l;
    b.onclick = () => { w.querySelectorAll('.stp').forEach(x => x.classList.remove('cur')); b.classList.add('cur'); onPick(i); };
    w.appendChild(b);
  });
  return w;
}

const helper = list => list && list.length ? `<div class="helper">${list.map(esc).join(' · ')}</div>` : '';
function btn(text, cls, onclick){ const b = document.createElement('button'); b.className = cls || 'btn'; b.textContent = text; b.onclick = onclick; return b; }

function actSteps(a){
  const intro = node(`<div class="show-ic">${a.icon}</div><h2>${esc(a.title)}${ru(a.title)}</h2>
    <p class="show-idea">${T(a.rules)}</p>
    ${a.phrases.length ? `<p class="kicker">Фразы в помощь</p><ul class="show-phrases">${a.phrases.map(p => `<li>${T(p)}</li>`).join('')}</ul>` : ''}`);
  const play = node(`${head(a.icon + ' ' + esc(a.title), '')}`);
  PLAY[a.play.type](a, play);
  return [{ label: 'Правила', node: intro }, { label: 'Играем', node: play }];
}

const PLAY = {
  truths(a, root){
    const area = document.createElement('div');
    const draw = i => {
      area.innerHTML = '';
      if (i === a.play.sets.length) {   // «Твоя очередь» — три пустые карточки
        area.innerHTML = `<p class="big-q">Your turn! Tell me 2 truths and 1 lie.<span class="ru">Твоя очередь! Назови 2 правдивых факта и 1 ложный.</span></p>`;
        const g = document.createElement('div'); g.className = 'facts';
        const states = ['?', 'My guess', '✓ Truth', '✗ Lie'], cls = ['', 'guess', 'truth', 'lie'];
        [1, 2, 3].forEach(n => {
          const c = document.createElement('div'); c.className = 'fact';
          c.innerHTML = `<span class="n">${n}</span><div class="t" contenteditable="true" data-ph="Fact ${n}…"></div>`;
          let k = 0;
          c.appendChild(btn(states[0], 'opt', function(){ k = (k + 1) % states.length; this.textContent = states[k]; c.className = 'fact ' + cls[k]; }));
          g.appendChild(c);
        });
        area.appendChild(g);
        area.insertAdjacentHTML('beforeend', `<p class="muted" style="margin-top:12px">Факты можно вписать прямо в карточки. Кнопка под фактом: догадка → правда → ложь.</p>`);
        return;
      }
      const set = a.play.sets[i];
      area.innerHTML = `<p class="big-q">${esc(set.intro)} Which one is a lie?<span class="ru">Познакомься с Томом. Какой факт — ложь?</span></p>`;
      const g = document.createElement('div'); g.className = 'facts';
      set.facts.forEach(([text, isLie], n) => {
        const c = document.createElement('button'); c.className = 'fact';
        c.innerHTML = `<span class="n">${n + 1}</span><span class="t">${T(text)}</span><span class="verdict"></span>`;
        c.onclick = () => { c.classList.add(isLie ? 'lie' : 'truth'); c.querySelector('.verdict').textContent = isLie ? '✗ LIE!' : '✓ True'; };
        g.appendChild(c);
      });
      area.appendChild(g);
    };
    root.append(makeTabs([...a.play.sets.map(s => 'Tom · ' + s.label), 'Your turn'], draw), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw(0);
  },

  rather(a, root){
    const area = document.createElement('div');
    let set = 0, qi = 0;
    const draw = () => {
      const [x, y] = a.play.sets[set].qs[qi];
      area.innerHTML = `<p class="big-q">Would you rather…<span class="ru">Что бы ты выбрал(а)…</span></p>`;
      const vs = document.createElement('div'); vs.className = 'vs';
      const pick = b => { vs.querySelectorAll('.vs-opt').forEach(o => o.classList.toggle('picked', o === b)); };
      const bx = btn(x, 'vs-opt', function(){ pick(this); }), by = btn(y, 'vs-opt', function(){ pick(this); });
      bx.innerHTML = T(x); by.innerHTML = T(y);
      vs.append(bx, Object.assign(document.createElement('span'), { className: 'vs-or', textContent: 'or' }), by);
      area.appendChild(vs);
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${qi + 1} / ${a.play.sets[set].qs.length}` }),
        btn('Другой вопрос →', 'btn primary', () => { qi = (qi + 1) % a.play.sets[set].qs.length; draw(); }));
      area.appendChild(row);
    };
    root.append(makeTabs(a.play.sets.map(s => s.label), i => { set = i; qi = 0; draw(); }), area);

function goStep(i){
  if (!lesson) return;
  lesson.cur = Math.max(0, Math.min(i, lesson.steps.length - 1));
  lesson.steps.forEach((s, k) => s.node.classList.toggle('cur', k === lesson.cur));
  const pills = [...$('#steps').children];
  pills.forEach((p, k) => { p.classList.toggle('cur', k === lesson.cur); p.classList.toggle('done', k < lesson.cur); });
  pills[lesson.cur].scrollIntoView({ block: 'nearest', inline: 'center' });
  $('#stepCount').textContent = `${lesson.cur + 1} / ${lesson.steps.length}`;
  $('#stepPrev').style.visibility = lesson.cur === 0 ? 'hidden' : '';
  $('#stepNext').textContent = lesson.cur === lesson.steps.length - 1 ? 'Завершить ✓' : 'Дальше →';
  $('#showScroll').scrollTop = 0;
}

function openShow(t){
  if (!t) return;
  const steps = lessonSteps(t);
  const body = $('#showBody'); body.innerHTML = '';
  steps.forEach(s => body.appendChild(s.node));
  const nav = $('#steps'); nav.innerHTML = '';
  steps.forEach((s, k) => { const b = document.createElement('button'); b.className = 'stp'; b.textContent = s.label; b.onclick = () => goStep(k); nav.appendChild(b); });
  if (lesson) clearInterval(lesson.clockTimer);
  lesson = { topic: t, steps, cur: 0, started: Date.now() };
  const tick = () => { const s = Math.floor((Date.now() - lesson.started) / 1000); $('#clock').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  tick(); lesson.clockTimer = setInterval(tick, 1000);
  show.classList.add('open');
  document.body.style.overflow = 'hidden';
  goStep(0);
  safeHistory('pushState', { show: true }, '#lesson=' + t.id);   // «Назад» на телефоне закрывает урок
  $('#stepNext').focus();
}

// изменение адреса — только удобство (кнопка «Назад», ссылка); если браузер запрещает, урок всё равно работает
function safeHistory(method, state, hash){
  try { history[method](state, '', hash || ('#/' + currentRoute)); } catch(e){}
}

function closeShowUI(){
  show.classList.remove('open');
  document.body.style.overflow = liveState ? 'hidden' : '';   // если показ открыт поверх Live mode — блокировку скролла не снимаем
  if (lesson) clearInterval(lesson.clockTimer);
  runningTimers.forEach(clearInterval); runningTimers = [];
  lesson = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (location.hash.startsWith('#lesson=')) safeHistory('replaceState', null);   // не перетираем раздел, куда человек уже перешёл
  if (typeof liveOnShowClose === 'function') { const cb = liveOnShowClose; liveOnShowClose = null; cb(); }
}

function closeShow(){
  if (history.state && history.state.show) history.back(); // закроется через popstate
  else closeShowUI();
}

window.addEventListener('popstate', () => { if (show.classList.contains('open')) closeShowUI(); });
$('#showBack').onclick = closeShow;
$('#stepPrev').onclick = () => goStep(lesson.cur - 1);
$('#stepNext').onclick = () => { if (lesson.cur === lesson.steps.length - 1) closeShow(); else goStep(lesson.cur + 1); };
$('#showFs').onclick = () => {
  if (document.fullscreenElement) return document.exitFullscreen().catch(() => {});
  if (!show.requestFullscreen) return toast('Этот браузер не поддерживает полноэкранный режим', true);
  show.requestFullscreen().catch(() => toast('Не удалось включить полноэкранный режим', true));
};
$('#showLink').onclick = async () => {
  const url = location.href.split('#')[0] + '#lesson=' + lesson.topic.id;
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch(e){ ok = fallbackCopy(url); }
  if (ok) toast('Ссылка на урок скопирована — отправьте ученику');
  else toast('Не получилось скопировать ссылку: ' + url, true);
};
document.addEventListener('keydown', e => {
  if (!show.classList.contains('open')) return;
  if (e.key === 'Escape' && !document.fullscreenElement) closeShow();
  if (e.key === 'ArrowRight') goStep(lesson.cur + 1);
  if (e.key === 'ArrowLeft' && lesson.cur > 0) goStep(lesson.cur - 1);
});

// шаблоны урока (30 минут). Во всех шаблонах 7 обязательных блоков — их нельзя удалить.
// mode: text — вопросы/идеи, slot — материал из библиотеки. durEdit — можно ли менять длительность в «закрытых» шаблонах.
const REQ = (title, min, mode, extra) => Object.assign({ title, min, mode, durEdit: false }, extra || {});
function reqBlocks(mins, kids){
  return [
    REQ('Warm-up & Connection', mins[0], 'text', { key: 'warmup', qkind: 'warmup', seed: kids ? ['Hello! What\'s your name?', 'How are you today?'] : ['How are you today?', 'What have you been up to lately?'] }),
    REQ('Goal Discovery', mins[1], 'text', { key: 'discovery', qkind: 'discovery', seed: kids ? ['What do you like to play?', 'Do you like English?'] : ['Why do you want to learn English?', 'What do you enjoy doing in your free time?'] }),
    REQ('Mini Lesson', mins[2], 'slot', { key: 'topic', accept: 'topic', durEdit: true }),
    REQ('Practice', mins[3], 'slot', { key: 'practice', accept: 'activity', durEdit: true }),
    REQ('Speaking Application', mins[4], 'slot', { key: 'speaking', accept: 'activity', durEdit: true }),
    REQ('Cabinet Preview', mins[5], 'text', { key: 'cabinet', seed: ['Покажите личный кабинет: расписание, домашка, прогресс.', 'Покажите, где найти материалы и как написать преподавателю.'] }),
    REQ('Wrap-up', mins[6], 'text', { key: 'wrapup', qkind: 'wrapup', seed: kids ? ['What did you like most today?'] : ['What’s one new thing you learned today?'] }),
  ];
}

  standard: { name: 'Standard', desc: 'Для большинства учеников. Порядок блоков зафиксирован.', locked: true, blocks: reqBlocks([4, 3, 7, 6, 5, 2, 3], false) },
  kids: { name: 'Kids', desc: 'Игры, простые слова, больше активности. Порядок зафиксирован.', locked: true, blocks: reqBlocks([4, 3, 6, 7, 5, 2, 3], true) },
  custom: { name: 'Custom', desc: 'Те же обязательные блоки, но можно менять порядок и длительность любого.', locked: false, blocks: reqBlocks([4, 3, 7, 6, 5, 2, 3], false) },
};
const BLOCK_TIPS = {
  warmup: 'Начни с лёгких вопросов — цель: расслабить ученика и услышать его первые фразы.',
  discovery: 'Узнай цель, интересы и где нужен английский. Записывай главное в заметки.',
  topic: 'Одна маленькая победа за блок: объясни коротко и сразу дай ученику сказать фразу.',
  practice: 'Практика устная: ученик отвечает голосом, ты мягко поправляешь.',
  speaking: 'Минимум вмешательства: пусть говорит, ошибки записывай и разбери в конце.',
  cabinet: 'Покажи личный кабинет: расписание, домашку, материалы. Этот блок можно пропустить, но он всегда остаётся в плане.',
  wrapup: 'Подведи итог: что ученик теперь умеет, и предложи следующий шаг.',
};
const tplBlockMin = t => t.blocks.reduce((n, b) => n + b.min, 0);
const tplLocked = p => !!(p.template && TEMPLATES[p.template] && TEMPLATES[p.template].locked);
function suggestTemplate(s){
  const age = parseInt(s && s.age, 10);
  return (age && age <= 12) ? 'kids' : 'standard';
}
function buildBlocks(tplKey){
  const t = TEMPLATES[tplKey];
  return t.blocks.map(b => ({
    id: uid('b'), key: b.key, title: b.title, duration: b.min, mode: b.mode, accept: b.accept || null, qkind: b.qkind || null,
    questions: b.seed ? b.seed.slice() : [], itemId: null, note: '', skipped: false, visited: false,
    req: true, durEdit: t.locked ? !!b.durEdit : true,
  }));
}
// можно ли двигать блок: обязательные блоки в «закрытых» шаблонах стоят на месте
const canMoveBlock = (plan, b) => !(b.req && tplLocked(plan));

/* ---------- планы (localStorage) ---------- */
function normPlan(p){
  if (p.v2) { if (p.template && !TEMPLATES[p.template]) p.template = 'custom'; (p.blocks || []).forEach(b => { b.title = String(b.title || '').replace(EMOJI_RE, '').trim(); }); return p; }
  p.v2 = true;
  const old = p.blocks || [];
  p.template = old.length ? 'standard' : null;
  p.blocks = old.map(b => b.type === 'item'
    ? { id: b.id, key: b.kind === 'activity' ? 'practice' : 'topic', title: b.title, duration: b.duration || 8, mode: 'slot', accept: 'any', itemId: b.refId, note: '', skipped: !!b.skipped, visited: !!b.visited }
    : { id: b.id, key: b.kind === 'warmup' ? 'warmup' : (b.kind === 'discovery' ? 'discovery' : 'wrapup'), title: b.title, duration: b.duration || 5, mode: 'text', qkind: b.kind === 'discovery' ? 'discovery' : (b.kind === 'warmup' ? 'warmup' : 'wrapup'), questions: b.questions || [], itemId: null, note: b.note || '', skipped: !!b.skipped, visited: !!b.visited });
  p.step = p.status === 'done' ? 'report' : (p.template ? 'prepare' : 'template');
  return p;
}
const Plans = {
  list(){ return store.get('york-hub-plans', []).map(normPlan).sort((a, b) => b.updatedAt - a.updatedAt); },
  get(id){ return this.list().find(p => p.id === id); },
  saveAll(list){ store.set('york-hub-plans', list); },
  create(prefill){
    const student = { name: '', age: '', level: '', goal: '', interests: '', notes: '', ...(prefill || {}) };
    const trialRequestId = student.trialRequestId || null;
    delete student.trialRequestId;
    const p = { v2: true, id: uid('p'), createdAt: Date.now(), updatedAt: Date.now(), student, trialRequestId, template: null, blocks: [], step: 'template', status: 'draft', liveNotes: '', report: null };
    const list = this.list(); list.unshift(p); this.saveAll(list);
    return p;
  },
  save(p){ p.updatedAt = Date.now(); const list = this.list().filter(x => x.id !== p.id); list.unshift(p); this.saveAll(list); },
  remove(id){ this.saveAll(this.list().filter(p => p.id !== id)); },
};
const blockReady = b => b.mode === 'text' || !!(b.itemId && byId[b.itemId]);
const planProgress = p => { const n = p.blocks.length; return n ? p.blocks.filter(blockReady).length / n : 0; };
const planTotalMin = p => p.blocks.reduce((n, b) => n + (b.skipped ? 0 : (b.duration || 0)), 0);
function planStatus(p){
  if (p.status === 'done') return 'done';
  if (!p.template || !p.blocks.length) return 'draft';
  return p.blocks.every(blockReady) ? 'ready' : 'draft';
}
const STATUS_LABEL = { draft: 'Черновик', ready: 'Готов', done: 'Проведён' };
const tplName = p => (p.template && TEMPLATES[p.template]) ? TEMPLATES[p.template].name : 'Шаблон не выбран';

/* ---------- карточки материалов ---------- */
function itemKind(x){ return x.play ? 'Активность' : (x.category === 'grammar' ? 'Грамматика' : 'Мини-урок'); }
function itemLevel(x){ return x.play ? (x.levels.length > 1 ? `${x.levels[0]}–${x.levels[x.levels.length - 1]}` : x.levels[0]) : x.level; }
function itemMin(x){ return x.play ? 8 : 12; }
function itemGradient(x){ return x.play ? 'linear-gradient(135deg,#EFE7FB,#DCCBF5)' : (x.category === 'grammar' ? 'linear-gradient(135deg,#DDEFFD,#BFE0F8)' : 'linear-gradient(135deg,#F1FAC8,#D7EF42)'); }
function itemMatchesLevel(x, lvl){ return !lvl || (x.play ? x.levels.includes(lvl) : x.level === lvl); }
function allItems(){ return [...DB.lessons, ...DB.activities.items]; }
function acceptFilter(accept){ return accept === 'topic' ? (x => !x.play) : (accept === 'activity' ? (x => !!x.play) : (() => true)); }

/* ---------- Список "Пробные уроки" ---------- */
const tlFilter = { status: 'all', q: '' };

  const counts = { all: all.length, draft: withStatus.filter(x => x.status === 'draft').length, ready: withStatus.filter(x => x.status === 'ready').length, done: withStatus.filter(x => x.status === 'done').length };

    ${all.length ? `<div class="gl-tl-toolbar">

      </div>
      <span style="flex:1"></span>
      <div class="gl-tl-search">${ic('search')}<input id="tlSearch" placeholder="Поиск по ученику…" value="${esc(tlFilter.q)}"></div>
    </div>
    <div class="gl-tl-cols"><span>Ученик</span><span>Шаблон</span><span>Уровень · цель</span><span>Прогресс</span><span>Статус</span><span></span></div>
    <div id="tlRows"></div>
    <div class="gl-tl-hint">${ic('note')}Черновики сохраняются автоматически. Урок становится <b>Готов</b>, когда в каждом блоке есть материал.</div>`
    : `<div class="gl-tl-empty">

          <h2>Пока нет пробных уроков</h2>
          <p>Создайте первый — из подтверждённой заявки (данные ученика подставятся сами) или вручную.</p>
          <button class="gl-tl-new" id="newPlanBtn2">Создать первый урок</button>
        </div>
        <div class="gl-tl-steps">
          <div class="gl-tl-step"><b class="num">1</b><span class="ttl">Выберите шаблон</span><span class="dsc">Стандартный, разговорный, детский или под цель — на 30 минут.</span></div>
          <div class="gl-tl-step"><b class="num">2</b><span class="ttl">Подготовьте блоки</span><span class="dsc">В каждый блок добавьте материал из библиотеки.</span></div>
          <div class="gl-tl-step"><b class="num">3</b><span class="ttl">Проведите и отправьте отчёт</span><span class="dsc">Ведите урок с одного экрана, в конце — короткий отчёт администратору.</span></div>
        </div>
      </div>`}`;

  root.querySelectorAll('#newPlanBtn, #newPlanBtn2').forEach(b => b.onclick = openNewLessonModal);

  const sIn = root.querySelector('#tlSearch');

  root.querySelector('#tlRows').innerHTML = shown.map(({ p, status }) => {
    const pct = Math.round(planProgress(p) * 100);
    const progressHtml = status === 'draft'
      ? `<div class="bar"><i style="width:${pct}%"></i></div><span>${pct}%</span>`
      : `<span class="txt">${status === 'ready' ? 'Готов к уроку' : (p.report && p.report.sentAt ? 'Отчёт отправлен' : 'Урок проведён')}</span>`;

      <div class="nm"><b>${esc(p.student.name || 'Без имени')}</b><span>${new Date(p.updatedAt).toLocaleDateString('ru-RU')}</span></div>

  root.querySelectorAll('[data-tlgo]').forEach(b => b.onclick = () => {

    if (!pl) return;

    location.hash = '#/builder=' + pl.id;
    if (st === 'ready') openLive(pl);
  });
}

/* ---------- страница урока (workspace) ---------- */
function curStepOf(plan){
  if (!plan.template) return 'template';
  return plan.step === 'report' ? 'report' : (plan.step === 'template' ? 'template' : 'prepare');
}

function renderBuilder(root){
  const id = (currentRoute.split('=')[1]) || '';
  const plan = id && Plans.get(id);
  if (!plan) { renderTrialLessonsList(root); return; }
  const step = curStepOf(plan);
  const head = `
    <div class="ws-stephead">
      <div class="who">
        <span class="ws-crumb"><a href="#/builder">Пробные уроки</a> / ${esc(plan.student.name || 'Без имени')}</span>
        <h1 class="ws-title">${esc(plan.template ? tplName(plan) : 'Новый пробный урок')}${plan.student.level ? ' · ' + esc(plan.student.level) : ''}${plan.student.goal ? ' · ' + esc(plan.student.goal) : ''}</h1>
      </div>
      <div class="ws-stepper" id="wsStepper">
        ${[['template', 'Шаблон'], ['prepare', 'Подготовка'], ['live', 'Урок'], ['report', 'Отчёт']].map(([k, l], i, arr) => {
          const order = ['template', 'prepare', 'live', 'report'];
          const done = order.indexOf(k) < order.indexOf(step);
          const dis = !plan.template && k !== 'template';
          return `<button data-wsstep="${k}" class="${k === step ? 'on' : (done ? 'done' : '')}"${dis ? ' disabled' : ''}>${done ? ic('check', 13) : ''}${l}</button>${i < arr.length - 1 ? '<span class="sep"></span>' : ''}`;
        }).join('')}
      </div>
    </div>
    <div id="wsBody"></div>`;
  root.innerHTML = head;
  root.querySelectorAll('[data-wsstep]').forEach(b => b.onclick = () => {
    const k = b.dataset.wsstep;
    if (k === 'live') { startLiveFromPlan(plan); return; }
    plan.step = k; Plans.save(plan); renderBuilder(root);
  });
  const body = root.querySelector('#wsBody');
  if (step === 'template') renderTemplateStep(body, plan, root);
  else if (step === 'report') renderReportStep(body, plan, root);
  else renderPrepareStep(body, plan, root);
}

function startLiveFromPlan(plan){
  const missing = plan.blocks.filter(b => !blockReady(b)).length;
  if (missing && !confirm(`В ${missing} блок(ах) нет материала. Всё равно начать урок?`)) return;
  openLive(plan);
}

/* ----- шаг 1: шаблон ----- */
function renderTemplateStep(body, plan, root){
  let sel = plan.template || suggestTemplate(plan.student);
  const draw = () => {
    body.innerHTML = `
      <p class="ws-lead">Выберите, как пройдёт пробный. Любой блок можно поменять на следующем шаге.</p>
      <div class="ws-tpl-grid">
        ${Object.entries(TEMPLATES).map(([k, t]) => `
          <button class="ws-glass ws-tpl${k === sel ? ' on' : ''}" data-tpl="${k}">
            <div class="hd"><span class="nm">${esc(t.name)}</span>${k === sel ? `<span style="color:#5B6B0A">${ic('check')}</span>` : ''}</div>
            <span class="ds">${esc(t.desc)}</span>
            <hr>
            ${t.blocks.map((b, i) => `<div class="bl"><i>${i + 1}</i>${esc(b.title)}</div>`).join('')}
            <span class="ft">${t.blocks.length} блоков · ${tplBlockMin(t)} мин</span>
          </button>`).join('')}
      </div>
      <div class="ws-actions">
        ${plan.template ? `<button class="ws-ghost" id="tplBack">${ic('back', 14)}К подготовке</button>` : ''}
        <button class="ws-cta" id="tplGo">Использовать «${esc(TEMPLATES[sel].name)}»${ic('arrow', 16)}</button>
      </div>`;
    body.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => { sel = b.dataset.tpl; draw(); });
    const back = body.querySelector('#tplBack');
    if (back) back.onclick = () => { plan.step = 'prepare'; Plans.save(plan); renderBuilder(root); };
    body.querySelector('#tplGo').onclick = () => {
      if (plan.template === sel && plan.blocks.length) { plan.step = 'prepare'; Plans.save(plan); renderBuilder(root); return; }
      if (plan.blocks.some(b => b.itemId) && !confirm('Блоки урока будут пересобраны по новому шаблону, выбранные материалы очистятся. Продолжить?')) return;
      plan.template = sel; plan.blocks = buildBlocks(sel); plan.step = 'prepare';
      Plans.save(plan); renderBuilder(root);
    };
  };
  draw();
}

/* ----- шаг 2: подготовка ----- */
// меню «⋯» у блока
function closeBlockMenu(){ const m = document.getElementById('blkMenu'); if (m) m.remove(); }
document.addEventListener('click', e => { if (!e.target.closest('#blkMenu') && !e.target.closest('[data-menu]')) closeBlockMenu(); });

function openBlockMenu(btn, items){
  closeBlockMenu();
  const m = document.createElement('div');
  m.id = 'blkMenu'; m.className = 'ws-menu';
  m.innerHTML = items.map((it, i) => it.sep ? '<hr>' : `<button data-mi="${i}"${it.danger ? ' class="danger"' : ''}>${esc(it.label)}</button>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect();
  m.style.top = Math.min(window.innerHeight - m.offsetHeight - 8, r.bottom + 4) + 'px';
  m.style.left = Math.max(8, r.right - m.offsetWidth) + 'px';
  m.querySelectorAll('[data-mi]').forEach(b => b.onclick = () => { closeBlockMenu(); items[+b.dataset.mi].run(); });
}

function renderPrepareStep(body, plan, root){
  const save = () => Plans.save(plan);
  const locked = tplLocked(plan);
  let slotId = (plan.blocks.find(b => b.mode === 'slot' && !blockReady(b)) || plan.blocks.find(b => b.mode === 'slot') || {}).id || null;
  const panel = { q: '', lvl: !!plan.student.level, fav: false, type: null };

  const draw = () => {
    const ready = plan.blocks.filter(blockReady).length, total = plan.blocks.length;
    const empty = total - ready, pct = total ? Math.round(ready / total * 100) : 0;
    const emptySlots = plan.blocks.filter(b => b.mode === 'slot' && !blockReady(b)).length;
    const slot = plan.blocks.find(b => b.id === slotId);
    body.innerHTML = `
      <div class="ws-prep">
        <div class="ws-prep-main">
          <div class="ws-glass ws-prog">
            <div class="row"><b>Готовность урока</b><em>${pct}%</em></div>
            <div class="bar"><i style="width:${pct}%"></i></div>
            <small>${ready} из ${total} блоков готово${empty ? ` · ${empty} без материала` : ''} · ${planTotalMin(plan)} мин всего</small>
          </div>
          <details class="ws-glass ws-student">
            <summary>Ученик: ${esc(plan.student.name || 'без имени')}${plan.student.age ? ', ' + esc(plan.student.age) : ''} — изменить данные</summary>
            <div class="ws-fields" style="margin-top:12px">
              <label>Имя<input id="fName" value="${esc(plan.student.name)}" placeholder="Имя ученика"></label>
              <label>Возраст<input id="fAge" value="${esc(plan.student.age)}" placeholder="например, 12"></label>
              <label>Уровень<select id="fLevel">${['', ...LEVELS].map(l => `<option value="${l}" ${plan.student.level === l ? 'selected' : ''}>${l || '—'}</option>`).join('')}</select></label>
              <label>Цель<input id="fGoal" value="${esc(plan.student.goal)}" placeholder="Зачем учит английский"></label>
              <label>Интересы<input id="fInterests" value="${esc(plan.student.interests)}" placeholder="Игры, аниме, футбол…"></label>
              <label>Заметки<input id="fNotes" value="${esc(plan.student.notes)}" placeholder="Что важно учесть"></label>
            </div>
          </details>
          <div id="blocksEl" style="display:flex;flex-direction:column;gap:10px"></div>
          <div><button class="ws-ghost" id="addBlockBtn">${ic('plus', 14)}Добавить блок</button></div>
        </div>
        <aside class="ws-glass ws-libpanel" id="libPanel"></aside>
      </div>
      <div class="ws-actions">
        <span class="note">Сохраняется автоматически</span>
        <button class="ws-ghost" id="toTpl">${ic('back', 14)}Шаблон</button>
        <button class="ws-ghost" id="delPlan">Удалить урок</button>
        ${emptySlots <= 1 ? `<button class="ws-ghost" id="prevLesson">${ic('eye', 14)}Предпросмотр</button>` : ''}
        <button class="ws-cta" id="startLive">Начать урок${ic('play', 14)}</button>
      </div>`;

    const fieldMap = { fName: 'name', fAge: 'age', fLevel: 'level', fGoal: 'goal', fInterests: 'interests', fNotes: 'notes' };
    Object.keys(fieldMap).forEach(k => body.querySelector('#' + k).addEventListener('input', e => { plan.student[fieldMap[k]] = e.target.value; save(); }));
    body.querySelector('#toTpl').onclick = () => { plan.step = 'template'; save(); renderBuilder(root); };
    body.querySelector('#delPlan').onclick = () => { if (confirm('Удалить этот урок?')) { Plans.remove(plan.id); location.hash = '#/builder'; } };
    body.querySelector('#startLive').onclick = () => startLiveFromPlan(plan);
    const pv = body.querySelector('#prevLesson'); if (pv) pv.onclick = () => openLessonPreview(plan, () => startLiveFromPlan(plan));
    body.querySelector('#addBlockBtn').onclick = () => {
      const nb = { id: uid('b'), key: 'practice', title: 'Дополнительный блок', duration: 5, mode: 'slot', accept: 'any', qkind: null, questions: [], itemId: null, note: '', skipped: false, visited: false, req: false, durEdit: true };
      plan.blocks.push(nb); slotId = nb.id; save(); draw();
    };
    drawBlocks(); drawPanel(slot);
  };

  const moveBlock = (b, dir) => {
    const i = plan.blocks.indexOf(b), j = i + dir;
    if (j < 0 || j >= plan.blocks.length) return;
    // в «закрытом» шаблоне обязательные блоки не переставляются — меняемся только с необязательными или перепрыгиваем их
    let k = j;
    while (k >= 0 && k < plan.blocks.length && locked && plan.blocks[k].req) k += dir;
    if (k < 0 || k >= plan.blocks.length) return;
    plan.blocks.splice(i, 1); plan.blocks.splice(k, 0, b);
    save(); draw();
  };

  const drawBlocks = () => {
    const el = body.querySelector('#blocksEl');
    el.innerHTML = plan.blocks.map((b, i) => {
      const item = b.itemId && byId[b.itemId];
      const isEmpty = !blockReady(b);
      const movable = canMoveBlock(plan, b);
      const sub = b.mode === 'text' ? ((b.questions || [])[0] || 'Вопросы и идеи — в режиме урока') : (item ? item.title : `Пусто: добавьте ${b.accept === 'topic' ? 'мини-урок' : (b.accept === 'activity' ? 'активность' : 'материал')}`);
      return `<div class="ws-glass ws-blk${isEmpty ? ' is-empty' : ''}${b.id === slotId ? ' sel' : ''}" data-id="${esc(b.id)}"${movable ? ' draggable="true"' : ''}>
        <span class="grab" style="${movable ? '' : 'opacity:.25;cursor:default'}">${ic('grab', 16)}</span>
        <span class="ck">${isEmpty ? ic('circle', 18) : ic('check', 18)}</span>
        <span class="no">${i + 1}</span>
        <div class="tx"><b>${esc(b.title)}${b.req ? `<em class="reqb">${ic('lock', 11)}Required</em>` : ''}</b><span>${esc(sub)}</span></div>
        ${item ? `<button class="eyeb" data-eye="${esc(b.id)}" title="Посмотреть материал">${ic('eye', 15)}</button>` : ''}
        ${b.mode === 'slot' ? `<button class="addlib" data-open="${esc(b.id)}">${ic(item ? 'search' : 'plus', 13)}${item ? 'Заменить' : 'Из библиотеки'}</button>` : ''}
        <span class="min">${b.duration || 5} мин</span>
        <button class="x" data-menu="${esc(b.id)}" title="Действия">⋯</button>
      </div>`;
    }).join('') || '<div class="empty">Блоков нет — добавьте первый.</div>';
    el.querySelectorAll('[data-open]').forEach(b => b.onclick = e => { e.stopPropagation(); slotId = b.dataset.open; panel.type = null; draw(); });
    el.querySelectorAll('[data-eye]').forEach(b => b.onclick = e => { e.stopPropagation(); const blk = plan.blocks.find(x => x.id === b.dataset.eye); openLibDrawer(byId[blk.itemId], { preview: true }); });
    el.querySelectorAll('.ws-blk').forEach(row => row.onclick = () => { const b = plan.blocks.find(x => x.id === row.dataset.id); if (b && b.mode === 'slot') { slotId = b.id; panel.type = null; draw(); } });
    el.querySelectorAll('[data-menu]').forEach(btn => btn.onclick = e => {
      e.stopPropagation();
      const b = plan.blocks.find(x => x.id === btn.dataset.menu);
      const items = [{ label: 'Редактировать', run: () => openBlockEditor(plan, b, draw) },
        { label: 'Дублировать', run: () => { const c = JSON.parse(JSON.stringify(b)); c.id = uid('b'); c.req = false; c.durEdit = true; c.title = b.title + ' (копия)'; plan.blocks.splice(plan.blocks.indexOf(b) + 1, 0, c); save(); draw(); } }];
      if (canMoveBlock(plan, b)) {
        items.push({ label: 'Переместить выше', run: () => moveBlock(b, -1) }, { label: 'Переместить ниже', run: () => moveBlock(b, 1) });
      }
      if (b.itemId) items.push({ label: 'Убрать материал', run: () => { b.itemId = null; save(); draw(); } });
      if (!b.req) { items.push({ sep: true }, { label: 'Удалить блок', danger: true, run: () => { plan.blocks = plan.blocks.filter(x => x.id !== b.id); save(); draw(); } }); }
      openBlockMenu(btn, items);
    });
    let dragId = null;
    el.querySelectorAll('.ws-blk[draggable="true"]').forEach(row => {
      row.ondragstart = () => { dragId = row.dataset.id; row.classList.add('dragging'); };
      row.ondragend = () => row.classList.remove('dragging');
    });
    el.querySelectorAll('.ws-blk').forEach(row => {
      row.ondragover = e => e.preventDefault();
      row.ondrop = e => {
        e.preventDefault();
        if (!dragId || dragId === row.dataset.id) return;
        const from = plan.blocks.findIndex(b => b.id === dragId), to = plan.blocks.findIndex(b => b.id === row.dataset.id);
        if (locked && plan.blocks[to].req && plan.blocks[from].req) return;
        const [m] = plan.blocks.splice(from, 1); plan.blocks.splice(to, 0, m);
        save(); draw();
      };
    });
  };

  const drawPanel = slot => {
    const el = body.querySelector('#libPanel');
    if (!slot) { el.innerHTML = `<div class="hd"><b>Библиотека</b></div><div class="foot">В этом уроке нет блоков, куда нужен материал.</div>`; return; }
    const idx = plan.blocks.indexOf(slot) + 1;
    const typeNow = panel.type || (slot.accept === 'topic' ? 'topic' : (slot.accept === 'activity' ? 'activity' : 'all'));
    const list = () => {
      let items = allItems().filter(acceptFilter(typeNow));
      if (panel.lvl && plan.student.level) items = items.filter(x => itemMatchesLevel(x, plan.student.level));
      if (panel.fav) items = items.filter(x => Saved.has(x.id));
      items = items.filter(x => matches(panel.q, x.title, x.idea, x.goal, x.outcome));
      const use = id => Usage.counts[id] || 0;
      return items.sort((a, b) => use(b.id) - use(a.id)).slice(0, 60);
    };
    el.innerHTML = `
      <div class="hd"><b>Библиотека</b></div>
      <div class="ws-search">${ic('search', 14)}<input id="lpQ" placeholder="Поиск…" value="${esc(panel.q)}"></div>
      <div class="ws-chips">
        ${[['all', 'Все'], ['topic', 'Мини-уроки'], ['activity', 'Активности']].map(([k, l]) => `<button class="ws-chip${typeNow === k ? ' on' : ''}" data-lptype="${k}">${l}</button>`).join('')}
        ${plan.student.level ? `<button class="ws-chip${panel.lvl ? ' on' : ''}" id="lpLvl">${esc(plan.student.level)}</button>` : ''}
        <button class="ws-chip${panel.fav ? ' on' : ''}" id="lpFav">★ Избранное</button>
      </div>
      <div id="lpList"></div>
      <div class="foot">Открыто для блока ${idx} · ${esc(slot.title)}</div>`;
    const drawList = () => {
      const items = list();
      el.querySelector('#lpList').innerHTML = items.map(x => `<div class="ws-li">
          <div class="tx" data-prev="${esc(x.id)}"><b>${esc(x.title)}</b><span>${esc(itemKind(x))} · ${esc(itemLevel(x))} · ${itemMin(x)} мин</span></div>
          <button class="eye" data-prev="${esc(x.id)}" title="Посмотреть, что внутри">${ic('eye', 15)}</button>
          <button class="add" data-add="${esc(x.id)}" title="Добавить в блок">${ic('plus', 14)}</button>
        </div>`).join('') || '<div class="foot" style="padding:10px 0">Ничего не нашлось.</div>';
      el.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
        slot.itemId = b.dataset.add; Usage.bump(b.dataset.add); save();
        slotId = (plan.blocks.find(x => x.mode === 'slot' && !blockReady(x)) || slot).id; panel.type = null;
        toast('Материал добавлен в блок'); draw();
      });
      el.querySelectorAll('[data-prev]').forEach(b => b.onclick = () => openLibDrawer(byId[b.dataset.prev], { plan, slot, onAdd: () => { slotId = (plan.blocks.find(x => x.mode === 'slot' && !blockReady(x)) || slot).id; panel.type = null; draw(); } }));
    };
    el.querySelector('#lpQ').oninput = e => { panel.q = e.target.value; drawList(); };
    el.querySelectorAll('[data-lptype]').forEach(b => b.onclick = () => { panel.type = b.dataset.lptype; drawPanel(slot); });
    const lv = el.querySelector('#lpLvl'); if (lv) lv.onclick = () => { panel.lvl = !panel.lvl; drawPanel(slot); };
    el.querySelector('#lpFav').onclick = () => { panel.fav = !panel.fav; drawPanel(slot); };
    drawList();
  };
  draw();
}

/* ----- шаг 4: отчёт ----- */
function planTopics(plan){
  return plan.blocks.filter(b => !b.skipped && b.itemId && byId[b.itemId]).map(b => byId[b.itemId].title);
}
function reportText(plan, r){
  return `<b>Отчёт о пробном — ${esc(plan.student.name || '-')}</b>\nШаблон: ${esc(tplName(plan))}\nТемы: ${esc((r.topics || []).join(', ') || '-')}\nЧто получилось: ${esc(r.good || '-')}\nЧто не очень: ${esc(r.bad || '-')}\nУровень: ${esc(r.level || '-')}\nЦель: ${esc(r.goal || '-')}${r.notes ? `\nЗаметки: ${esc(r.notes)}` : ''}`;
}
async function sendReportToAdmin(plan, r){
  r.savedAt = Date.now(); r.sentAt = Date.now();
  plan.report = r; plan.status = 'done';
  plan.student.level = r.level || plan.student.level; plan.student.goal = r.goal || plan.student.goal;
  Plans.save(plan);
  try {
    const sb = window.supabase && window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (!sb) throw new Error('no sdk');
    const { error } = await sb.rpc('tg_send', { msg: reportText(plan, r), target_chat_id: null, reply_markup: null });
    if (error) throw error;
    toast('Отчёт сохранён и отправлен администратору');
    return true;
  } catch(e){
    toast('Отчёт сохранён, но отправить администратору не получилось — скопируйте текст вручную', true);
    return false;
  }
}
async function copyReport(plan, r){
  const text = reportText(plan, r).replace(/<\/?b>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){ ok = fallbackCopy(text); }
  toast(ok ? 'Отчёт скопирован' : 'Не получилось скопировать', !ok);
}

function renderReportStep(body, plan, root){
  const r = plan.report || { topics: planTopics(plan), good: '', bad: '', level: plan.student.level || '', goal: plan.student.goal || '', notes: plan.liveNotes || '' };
  if (!r.topics) r.topics = planTopics(plan);
  body.innerHTML = `
    <p class="ws-lead">Коротко: что получилось, что не очень, какой сейчас уровень и цель. После отправки отчёт увидит администратор.</p>
    <div class="ws-report">
      <div class="ws-report-main">
        <div class="ws-glass ws-rsec"><h3><i>1</i>Что получилось</h3><textarea id="repGood" placeholder="2–3 сильные стороны ученика">${esc(r.good)}</textarea></div>
        <div class="ws-glass ws-rsec"><h3><i>2</i>Что не очень</h3><textarea id="repBad" placeholder="1–2 зоны роста на первый месяц">${esc(r.bad)}</textarea></div>
        <div class="ws-glass ws-rsec"><h3><i>3</i>Уровень и цель</h3>
          <div class="ws-fields">
            <label>Текущий уровень<select id="repLevel">${['', ...LEVELS].map(l => `<option value="${l}" ${r.level === l ? 'selected' : ''}>${l || '—'}</option>`).join('')}</select></label>
            <label>Цель<input id="repGoal" value="${esc(r.goal)}" placeholder="Зачем учит английский"></label>
          </div>
        </div>
      </div>
      <aside class="ws-rside">
        <div class="ws-glass ws-rsec"><h3>Темы урока</h3><div class="ws-wrap" id="repTopics"></div></div>
        <div class="ws-glass ws-rsec"><h3>Заметки с урока</h3><textarea id="repNotes" placeholder="Что сказал ученик, на что обратить внимание…">${esc(r.notes)}</textarea></div>
        <button class="ws-cta" id="repSend" style="justify-content:center">Отправить администратору${ic('arrow', 16)}</button>
        <button class="ws-ghost" id="repSave" style="justify-content:center">Сохранить черновик</button>
        <button class="ws-ghost" id="repCopy" style="justify-content:center">Скопировать как текст</button>
        ${r.sentAt ? `<span class="muted" style="font-size:12px">Отправлено ${new Date(r.sentAt).toLocaleString('ru-RU')}</span>` : ''}
      </aside>
    </div>`;
  const chipsEl = body.querySelector('#repTopics');
  const drawChips = () => {
    chipsEl.innerHTML = r.topics.map((t, i) => `<span class="ws-chip on" style="display:inline-flex;gap:6px;align-items:center">${esc(t)}<button data-rmv="${i}" style="all:unset;cursor:pointer">✕</button></span>`).join('') || '<span class="muted">—</span>';
    chipsEl.querySelectorAll('[data-rmv]').forEach(b => b.onclick = () => { r.topics.splice(+b.dataset.rmv, 1); drawChips(); });
  };
  drawChips();
  const collect = () => { r.good = body.querySelector('#repGood').value; r.bad = body.querySelector('#repBad').value; r.level = body.querySelector('#repLevel').value; r.goal = body.querySelector('#repGoal').value; r.notes = body.querySelector('#repNotes').value; return r; };
  body.querySelector('#repSave').onclick = () => { collect(); plan.report = r; plan.step = 'report'; Plans.save(plan); toast('Черновик отчёта сохранён'); };
  body.querySelector('#repCopy').onclick = () => copyReport(plan, collect());
  body.querySelector('#repSend').onclick = async () => { collect(); await sendReportToAdmin(plan, r); location.hash = '#/reports'; };
}

/* ---------- модалка "Добавить материал" (из Live) ---------- */
function openPicker(onPick, title){
  const bg = $('#pickerBg'), modal = $('#picker'), box = $('#pickerBox');
  $('#pickerTitle').textContent = title || 'Добавить активность';
  let q = '', tab = 'activities';
  const draw = () => {
    const filterFn = tab === 'lessons' ? (x => !x.play) : (x => !!x.play);
    const items = allItems().filter(filterFn).filter(x => matches(q, x.title, x.idea, x.goal, x.outcome));
    const freq = !q.trim() ? Usage.top(3, filterFn) : [];
    const fIds = new Set(freq.map(x => x.id));
    const rows = [...freq, ...items.filter(x => !fIds.has(x.id))];
    box.innerHTML = `
      <div class="ws-seg"><button data-pt="activities" class="${tab === 'activities' ? 'on' : ''}">Активности</button><button data-pt="lessons" class="${tab === 'lessons' ? 'on' : ''}">Мини-уроки</button></div>
      <div class="ws-search" style="margin-top:12px">${ic('search', 14)}<input id="pkQ" placeholder="Поиск…" value="${esc(q)}"></div>
      <div style="margin-top:8px;max-height:46vh;overflow:auto">${rows.map(x => `<div class="ws-li">
          <div class="tx" data-pkprev="${esc(x.id)}"><b>${freq.includes(x) ? '' : ''}${esc(x.title)}</b><span>${esc(itemKind(x))} · ${esc(itemLevel(x))} · ${itemMin(x)} мин</span></div>
          <button class="add" data-pkadd="${esc(x.id)}" title="Добавить">${ic('plus', 14)}</button>
        </div>`).join('') || '<div class="ws-hint" style="padding:12px 0">Ничего не нашлось.</div>'}</div>`;
    box.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { tab = b.dataset.pt; draw(); });
    const qi = box.querySelector('#pkQ');
    qi.oninput = e => { q = e.target.value; draw(); const n = box.querySelector('#pkQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    box.querySelectorAll('[data-pkadd]').forEach(b => b.onclick = () => { Usage.bump(b.dataset.pkadd); onPick(byId[b.dataset.pkadd]); closePicker(); });
    box.querySelectorAll('[data-pkprev]').forEach(b => b.onclick = () => openLibDrawer(byId[b.dataset.pkprev], { onPickOnly: x => { Usage.bump(x.id); onPick(x); closePicker(); } }));
  };
  draw();
  bg.classList.add('open'); modal.classList.add('open');
}
function closePicker(){ $('#pickerBg').classList.remove('open'); $('#picker').classList.remove('open'); }
$('#pickerClose').onclick = closePicker;
$('#pickerBg').onclick = closePicker;

/* ---------- модалка "Новый пробный урок" ---------- */

  const bg = $('#newLessonBg'), modal = $('#newLessonModal'), bodyEl = $('#newLessonBody');

  const requests = ((CurrentTeacher && CurrentTeacher.trialRequests) || []).filter(r => !usedRequestIds.has(r.id));
  let tab = 'manual';
  const form = { name: '', age: '', level: '', goal: '', requestId: null };
  const draw = () => {
    const sug = suggestTemplate(form);
    bodyEl.innerHTML = `
      <div class="ws-seg"><button data-nl="manual" class="${tab === 'manual' ? 'on' : ''}">Вручную</button><button data-nl="request" class="${tab === 'request' ? 'on' : ''}">Из заявки</button></div>
      ${tab === 'request' ? (
        !CurrentTeacher ? `<p class="ws-hint">Чтобы видеть заявки на пробный, войдите в кабинет учителя в этом браузере (teacher.html) — страница сама узнает вас здесь.</p>`
        : !requests.length ? `<p class="ws-hint">Нет новых подтверждённых заявок, ещё не оформленных в урок.</p>`
        : `<p class="ws-hint">Только подтверждённые заявки, назначенные именно вам. Уровень и цель подставятся сами.</p>
           ${requests.map(r => `<button class="ws-radio${form.requestId === r.id ? ' on' : ''}" data-req="${esc(r.id)}"><span class="dot"></span><span><b>${esc(r.full_name)}</b><small>${esc(r.current_level || 'уровень не указан')}${r.goal ? ' · ' + esc(r.goal) : ''}${r.age ? ' · ' + esc(r.age) + ' лет' : ''}</small></span></button>`).join('')}`
      ) : ''}
      <div class="ws-fields">
        ${tab === 'manual' ? `<label>Имя<input id="nlName" value="${esc(form.name)}" placeholder="Имя ученика"></label><label>Возраст<input id="nlAge" value="${esc(form.age)}" placeholder="например, 12"></label>` : ''}
        <label>Уровень<select id="nlLevel">${['', ...LEVELS].map(l => `<option value="${l}" ${form.level === l ? 'selected' : ''}>${l || '—'}</option>`).join('')}</select></label>
        <label>Цель<input id="nlGoal" value="${esc(form.goal)}" placeholder="Например: Travel"></label>
      </div>
      <div class="ws-suggest">${ic('star', 15)}<span>Рекомендуемый шаблон: <b>${esc(TEMPLATES[sug].name)}</b>. Его можно поменять на следующем шаге.</span></div>
      <div class="ws-mfoot"><button class="ws-ghost" id="nlCancel">Отмена</button><button class="ws-cta" id="nlGo">Продолжить к шаблону${ic('arrow', 16)}</button></div>`;

      draw();
    });
    const bind = (id, k) => { const el = bodyEl.querySelector(id); if (el) el.oninput = e => { form[k] = e.target.value; if (k !== 'name') { const s = TEMPLATES[suggestTemplate(form)].name; const sp = bodyEl.querySelector('.ws-suggest b'); if (sp) sp.textContent = s; } }; };
    bind('#nlName', 'name'); bind('#nlAge', 'age'); bind('#nlGoal', 'goal');
    const lv = bodyEl.querySelector('#nlLevel'); if (lv) lv.onchange = e => { form.level = e.target.value; };
    bodyEl.querySelector('#nlCancel').onclick = closeNewLessonModal;
    bodyEl.querySelector('#nlGo').onclick = () => {
      if (tab === 'request' && !form.requestId) { toast('Выберите заявку или перейдите на «Вручную»', true); return; }
      const p = Plans.create({ name: form.name, age: form.age, level: form.level, goal: form.goal, trialRequestId: form.requestId });
      closeNewLessonModal();
      location.hash = '#/builder=' + p.id;
    };
  };
  draw();
  bg.classList.add('open'); modal.classList.add('open');
}

/* ---------- Live Lesson Mode ---------- */
const live = $('#live');
let liveState = null;   // { plan, cur, started, blockStart, timer }
const fmtClock = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

function openLive(plan){
  if (!plan.blocks.length) { toast('В уроке пока нет блоков', true); return; }
  liveState = { plan, cur: Math.max(0, plan.blocks.findIndex(b => !b.visited && !b.skipped)), started: Date.now(), blockStart: Date.now() };
  $('#liveStu').textContent = `${plan.student.name || 'Урок'} · ${tplName(plan)}`;
  $('#liveTotal').textContent = `/ ${fmtClock(planTotalMin(plan) * 60)}`;
  $('#liveNotes').value = plan.liveNotes || '';
  $('#liveNotes').oninput = e => { plan.liveNotes = e.target.value; Plans.save(plan); };
  live.classList.add('open');
  document.body.style.overflow = 'hidden';
  liveState.timer = setInterval(liveTick, 1000);
  liveTick();
  renderLive();
}
function liveTick(){
  if (!liveState) return;
  const s = Math.floor((Date.now() - liveState.started) / 1000);
  $('#liveClock').textContent = fmtClock(s);
  const b = liveState.plan.blocks[liveState.cur];
  const el = $('#liveLeft');
  if (b && el) {
    const left = (b.duration || 0) * 60 - Math.floor((Date.now() - liveState.blockStart) / 1000);
    el.textContent = left >= 0 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} осталось` : `+${Math.floor(-left / 60)}:${String(-left % 60).padStart(2, '0')} сверх плана`;
  }
}
function closeLive(){
  if (!liveState) return;
  clearInterval(liveState.timer);
  live.classList.remove('open');
  document.body.style.overflow = '';
  liveState = null;
}
function endLive(){
  const plan = liveState.plan;
  plan.blocks.forEach((b, i) => { if (i <= liveState.cur) b.visited = true; });
  plan.step = 'report';
  Plans.save(plan);
  closeLive();
  if (location.hash === '#/builder=' + plan.id) renderPage(); else location.hash = '#/builder=' + plan.id;
}
$('#liveClose').onclick = () => { if (confirm('Завершить урок и перейти к отчёту? Заметки уже сохранены.')) endLive(); };

function gotoBlock(i){
  const { plan } = liveState;
  if (i < 0) return;
  if (i >= plan.blocks.length) { endLive(); return; }
  liveState.cur = i; liveState.blockStart = Date.now();
  renderLive();
}

function renderLive(){
  const { plan, cur } = liveState;
  const b = plan.blocks[cur];
  b.visited = true; Plans.save(plan);
  const total = plan.blocks.length;

  // сегменты прогресса
  $('#liveSeg').innerHTML = plan.blocks.map((x, i) => `<button class="s${i === cur ? ' cur' : (x.skipped ? ' skip' : (i < cur || x.visited ? ' done' : ''))}" style="flex:${Math.max(1, x.duration || 1)}" data-seg="${i}"><i></i><span>${esc(x.title)}</span></button>`).join('');
  $('#liveSeg').querySelectorAll('[data-seg]').forEach(s => s.onclick = () => gotoBlock(+s.dataset.seg));

  // панель над сценой
  $('#liveBar').innerHTML = `
    <span class="lv-now">Сейчас · ${cur + 1} / ${total}</span>
    <h2 class="lv-bt">${esc(b.title)}</h2>
    <span class="lv-left" id="liveLeft"></span>
    <span style="flex:1"></span>
    <button class="lv-ab" id="liveAddAct">${ic('plus', 14)}Добавить активность</button>
    <button class="lv-ib" id="liveSkip" title="Пропустить блок">${ic('skip', 16)}</button>`;

  // сцена
  const body = $('#liveBody');
  if (b.mode === 'text') {
    const hasBank = !!QUESTION_BANK[b.qkind];
    body.innerHTML = `<ul class="lv-qs" id="liveQs">${(b.questions || []).map(q => `<li>${esc(q)}<button data-rmq="${esc(q)}" title="Убрать вопрос">✕</button></li>`).join('') || '<li style="color:#6B6C64">Вопросов пока нет</li>'}</ul>
      ${hasBank ? `<button class="ws-ghost" id="liveMoreQ">Ещё идеи и вопросы</button>` : ''}`;
    body.querySelectorAll('[data-rmq]').forEach(btn => btn.onclick = () => { b.questions = (b.questions || []).filter(q => q !== btn.dataset.rmq); Plans.save(plan); renderLive(); });
    const mq = body.querySelector('#liveMoreQ');
    if (mq) mq.onclick = () => {
      const fresh = moreQuestions(b.qkind, b.questions || []);
      if (!fresh.length) { toast('Больше новых идей в банке нет для этого блока'); return; }
      b.questions = [...(b.questions || []), ...fresh]; Plans.save(plan); renderLive();
    };
  } else {
    const item = b.itemId && byId[b.itemId];
    if (!item) {
      body.innerHTML = `<div class="lv-it"><h2>Материал не выбран</h2><p class="oc">В этом блоке нет материала. Выберите из библиотеки.</p><button class="ws-cta" id="livePickHere">${ic('plus', 14)}Выбрать материал</button></div>`;
      body.querySelector('#livePickHere').onclick = () => openPicker(x => { b.itemId = x.id; Plans.save(plan); renderLive(); }, 'Выбрать материал');
    } else {
      body.innerHTML = `<div class="lv-it">
        <h2>${esc(item.title)}</h2>
        ${item.outcome ? `<p class="oc">«${esc(item.outcome)}»</p>` : ''}
        ${item.idea ? `<p>${esc(item.idea)}</p>` : ''}
        ${item.goal ? `<p>${esc(item.goal)}</p>` : ''}
        ${item.how ? `<p>${esc(item.how)}</p>` : ''}
        ${(item.explanation || item.phrases || []).length ? `<ul>${(item.explanation || item.phrases).map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
        ${item.mistakes ? Components.Mistakes(item.mistakes) : ''}
        ${item.speaking ? `<p><b>Speaking:</b> ${esc(item.speaking)}</p>` : ''}
        <button class="ws-cta" id="liveOpenShow">${ic('play', 14)}Открыть экран для ученика</button>
      </div>`;
      body.querySelector('#liveOpenShow').onclick = () => {
        Usage.bump(item.id);
        live.style.visibility = 'hidden';
        liveOnShowClose = () => { live.style.visibility = ''; };
        openShow(item);
      };
    }
  }

  // подсказка
  const next = plan.blocks[cur + 1];
  $('#liveTip').innerHTML = `<span class="k">Подсказка</span><p>${esc(BLOCK_TIPS[b.key] || 'Держи темп по плану — ученик должен больше говорить, чем слушать.')}</p>`;
  // план урока
  $('#livePlan').innerHTML = `<h3>План урока</h3>${plan.blocks.map((x, i) => `<button class="r${i === cur ? ' cur' : (x.skipped ? ' skip' : (i < cur ? ' done' : ''))}" data-plan="${i}"><span class="n">${i < cur && !x.skipped ? ic('check', 13) : i + 1}</span><span class="t">${esc(x.title)}</span><small>${x.duration || 0}м</small></button>`).join('')}`;
  $('#livePlan').querySelectorAll('[data-plan]').forEach(r => r.onclick = () => gotoBlock(+r.dataset.plan));

  $('#livePrev').disabled = cur === 0;
  $('#livePrev').innerHTML = cur === 0 ? `${ic('back', 14)}Назад` : `${ic('back', 14)}Назад: ${esc(plan.blocks[cur - 1].title)}`;
  $('#liveNext').innerHTML = next ? `Дальше: ${esc(next.title)}${ic('arrow', 16)}` : `К отчёту${ic('check', 16)}`;

  $('#liveAddAct').onclick = () => openPicker(item => {
    const nb = { id: uid('b'), key: item.play ? 'practice' : 'topic', title: item.play ? 'Активность' : 'Мини-урок', duration: itemMin(item), mode: 'slot', accept: 'any', qkind: null, questions: [], itemId: item.id, note: '', skipped: false, visited: false };
    plan.blocks.splice(cur + 1, 0, nb); Plans.save(plan);
    renderLive();
    toast('Блок добавлен после текущего');
  });
  $('#liveSkip').onclick = () => { b.skipped = true; Plans.save(plan); gotoBlock(cur + 1); };
  liveTick();
}
$('#livePrev').onclick = () => { if (liveState && liveState.cur > 0) gotoBlock(liveState.cur - 1); };
$('#liveNext').onclick = () => { if (liveState) gotoBlock(liveState.cur + 1); };

/* ---------- Библиотека (фильтры слева + карточки) и превью ---------- */
const libF = { types: new Set(['lessons', 'activities', 'grammar', 'materials']), levels: new Set(), saved: false, q: '', sort: 'title' };

function libraryList(){
  const items = [];
  if (libF.types.has('lessons')) DB.lessons.filter(l => l.category !== 'grammar').forEach(x => items.push({ kind: 'lesson', x }));
  if (libF.types.has('grammar')) DB.lessons.filter(l => l.category === 'grammar').forEach(x => items.push({ kind: 'grammar', x }));
  if (libF.types.has('activities')) DB.activities.items.forEach(x => items.push({ kind: 'activity', x }));
  if (libF.types.has('materials')) DB.materials.items.forEach((m, i) => items.push({ kind: 'material', x: Object.assign({ id: 'mat:' + i }, m) }));
  let list = items;
  if (libF.levels.size) list = list.filter(({ kind, x }) => kind === 'material' ? false : [...libF.levels].some(l => itemMatchesLevel(x, l)));
  if (libF.saved) list = list.filter(({ kind, x }) => kind !== 'material' && Saved.has(x.id));
  if (libF.q.trim()) list = list.filter(({ x }) => matches(libF.q, x.title, x.idea, x.goal, x.outcome, x.description, x.how, x.phrases));
  list.sort((a, b) => libF.sort === 'level'
    ? String(a.kind === 'material' ? 'Z' : itemLevel(a.x)).localeCompare(String(b.kind === 'material' ? 'Z' : itemLevel(b.x))) || a.x.title.localeCompare(b.x.title, 'ru')
    : (libF.sort === 'used' ? (Usage.counts[b.x.id] || 0) - (Usage.counts[a.x.id] || 0) : a.x.title.localeCompare(b.x.title, 'ru')));
  return list;
}

function renderLibraryPage(root){
  const rerender = () => renderLibraryPage(root);
  const typeLabels = [['lessons', 'Мини-уроки'], ['activities', 'Активности'], ['grammar', 'Грамматика'], ['materials', 'Материалы']];
  const total = DB.lessons.length + DB.activities.items.length + DB.materials.items.length;
  root.innerHTML = `
    <div class="ws-lib-head">
      <div><h1>Библиотека</h1><p>${total} материалов: темы, активности, грамматика. Откройте карточку, чтобы посмотреть, что внутри.</p></div>
      <div class="ws-glass ws-lib-search">${ic('search')}<input id="libQ" placeholder="Искать по библиотеке…" value="${esc(libF.q)}"></div>
    </div>
    <div class="ws-lib">
      <aside class="ws-glass ws-filters">
        <span class="lb">Тип</span>
        ${typeLabels.map(([k, l]) => `<button class="ws-check${libF.types.has(k) ? ' on' : ''}" data-ltype="${k}"><i>${libF.types.has(k) ? ic('check', 12) : ''}</i>${l}</button>`).join('')}
        <hr>
        <span class="lb">Уровень</span>
        <div class="ws-lvgrid">${LEVELS.map(l => `<button class="ws-pill${libF.levels.has(l) ? ' on' : ''}" data-llvl="${l}">${l}</button>`).join('')}</div>
        <hr>
        <button class="ws-check${libF.saved ? ' on' : ''}" data-lsaved="1"><i>${libF.saved ? ic('check', 12) : ''}</i>Только избранное</button>
        <button class="ws-reset" id="libReset">Сбросить фильтры</button>
      </aside>
      <div class="ws-libmain">
        <div class="ws-sortrow"><span id="libCount"></span><span class="sp"></span><span>Сортировка:</span>
          <button data-lsort="title">${libF.sort === 'title' ? '<u>По названию</u>' : 'По названию'}</button>
          <button data-lsort="level">${libF.sort === 'level' ? '<u>По уровню</u>' : 'По уровню'}</button>
          <button data-lsort="used">${libF.sort === 'used' ? '<u>Частые</u>' : 'Частые'}</button></div>
        <div class="ws-cards" id="libCards"></div>
      </div>
    </div>`;
  const drawCards = () => {
    const list = libraryList();
    root.querySelector('#libCount').textContent = `${list.length} материалов`;
    root.querySelector('#libCards').innerHTML = list.map(({ kind, x }) => {
      const isMat = kind === 'material';
      const grad = isMat ? 'linear-gradient(135deg,#FFF1D6,#F8D9A0)' : itemGradient(x);
      const label = isMat ? 'Материал' : itemKind(x);
      return `<article class="ws-glass ws-card" data-lprev="${esc(x.id)}">
        <div class="top" style="background:${grad}"><span class="ic">${ic(isMat ? 'note' : (x.play ? 'play' : 'search'), 15)}</span>${isMat ? '' : starBtn(x.id)}</div>
        <div class="bd"><span class="ty">${esc(label)}</span><span class="nm">${esc(x.title)}</span>
          <div class="mt">${isMat ? '' : `<b>${esc(itemLevel(x))}</b><span>${itemMin(x)} мин</span>`}<span class="sp"></span>${isMat ? '' : `<button class="addb" data-ladd="${esc(x.id)}">${ic('plus', 13)}В урок</button>`}</div>
        </div></article>`;
    }).join('') || '<div class="empty" style="grid-column:1/-1">Ничего не нашлось — сбросьте фильтры.</div>';
    root.querySelectorAll('[data-lprev]').forEach(c => c.onclick = e => {
      if (e.target.closest('[data-star]')) return;
      const a = e.target.closest('[data-ladd]');
      const x = byId[c.dataset.lprev] || (list.find(it => it.x.id === c.dataset.lprev) || {}).x;
      openLibDrawer(x, { focusAdd: !!a });
    });
  };
  root.querySelector('#libQ').oninput = e => { libF.q = e.target.value; drawCards(); };
  root.querySelectorAll('[data-ltype]').forEach(b => b.onclick = () => { const k = b.dataset.ltype; libF.types.has(k) ? libF.types.delete(k) : libF.types.add(k); if (!libF.types.size) libF.types.add(k); rerender(); });
  root.querySelectorAll('[data-llvl]').forEach(b => b.onclick = () => { const k = b.dataset.llvl; libF.levels.has(k) ? libF.levels.delete(k) : libF.levels.add(k); rerender(); });
  root.querySelector('[data-lsaved]').onclick = () => { libF.saved = !libF.saved; rerender(); };
  root.querySelector('#libReset').onclick = () => { libF.types = new Set(['lessons', 'activities', 'grammar', 'materials']); libF.levels = new Set(); libF.saved = false; libF.q = ''; rerender(); };
  root.querySelectorAll('[data-lsort]').forEach(b => b.onclick = () => { libF.sort = b.dataset.lsort; rerender(); });
  drawCards();
}

// превью материала справа + «Добавить в урок»
function openLibDrawer(x, opts){
  opts = opts || {};
  if (!x) return;
  const el = $('#libDrawer');
  const isMat = !byId[x.id];
  const label = isMat ? 'Материал' : itemKind(x);
  const plans = Plans.list().filter(p => p.status !== 'done');
  const plan0 = opts.plan || plans[0];
  let rows = '';
  if (!isMat && !opts.preview) {
    if (opts.onPickOnly) {
      rows = `<button class="addrow first" data-addmode="pick"><span>Добавить в урок</span>${ic('plus', 14)}</button>`;
    } else if (opts.slot) {
      rows = `<button class="addrow first" data-addmode="slot"><span>Блок «${esc(opts.slot.title)}»</span>${ic('plus', 14)}</button>`;
    } else if (plan0 && plan0.template) {
      const compat = plan0.blocks.filter(b => b.mode === 'slot' && !b.itemId && acceptFilter(b.accept)(x));
      rows = compat.slice(0, 3).map((b, i) => `<button class="addrow${i === 0 ? ' first' : ''}" data-addmode="block" data-bid="${esc(b.id)}"><span>${esc(plan0.student.name || 'Урок')} · блок «${esc(b.title)}»</span>${ic('plus', 14)}</button>`).join('')
        + `<button class="addrow${compat.length ? '' : ' first'}" data-addmode="new-block"><span>${esc(plan0.student.name || 'Урок')} · новый блок в конце</span>${ic('plus', 14)}</button>`;
    }
    if (!opts.onPickOnly && !opts.slot) rows += `<button class="addrow${rows ? '' : ' first'}" data-addmode="new-plan"><span>Создать новый урок с этим материалом</span>${ic('plus', 14)}</button>`;
  }
  const lines = [];
  if (!isMat) {
    if (x.outcome) lines.push(`<i>«${esc(x.outcome)}»</i>`);
    if (x.leadIn) lines.push(`<span><b>Lead-in:</b> ${esc(x.leadIn)}</span>`);
    if (x.idea) lines.push(`<span>${esc(x.idea)}</span>`);
    if (x.goal) lines.push(`<span><b>Goal:</b> ${esc(x.goal)}</span>`);
    if (x.how) lines.push(`<span><b>How:</b> ${esc(x.how)}</span>`);
    const ex = x.explanation || x.phrases || [];
    if (ex.length) lines.push(`<ul>${ex.slice(0, 8).map(p => `<li>${esc(p)}</li>`).join('')}</ul>`);
    if (x.speaking) lines.push(`<span><b>Speaking:</b> ${esc(x.speaking)}</span>`);
  } else {
    if (x.description) lines.push(`<span>${esc(x.description)}</span>`);
    if (x.url) lines.push(`<a href="${esc(x.url)}" target="_blank" rel="noopener">Открыть материал →</a>`);
  }
  el.innerHTML = `
    <div class="hdr"><span class="pill">${esc(label)}</span><span class="sp"></span>${isMat ? '' : starBtn(x.id)}<button id="ldClose" aria-label="Закрыть">${ic('x', 18)}</button></div>
    <h2>${esc(x.title)}</h2>
    <div class="muted">${isMat ? '' : `${esc(itemLevel(x))} · ${itemMin(x)} мин`}</div>
    <div class="prev"><span class="lb">Что внутри</span>${lines.join('') || '<span>—</span>'}</div>
    ${!isMat ? `<button class="ws-ghost" id="ldShow">${ic('play', 13)}Показать как ученику</button>` : ''}
    ${rows ? `<div class="addbox"><span class="k">Добавить в урок</span>${rows}</div>` : ''}`;
  $('#libDrawer').classList.add('open'); $('#drawerBg2').classList.add('open');
  const close = () => { $('#libDrawer').classList.remove('open'); $('#drawerBg2').classList.remove('open'); };
  el.querySelector('#ldClose').onclick = close;
  $('#drawerBg2').onclick = close;
  const sh = el.querySelector('#ldShow'); if (sh) sh.onclick = () => { close(); Usage.bump(x.id); openShow(x); };
  el.querySelectorAll('[data-addmode]').forEach(b => b.onclick = () => {
    const mode = b.dataset.addmode;
    Usage.bump(x.id);
    if (mode === 'pick') { opts.onPickOnly(x); close(); return; }
    if (mode === 'slot') { opts.slot.itemId = x.id; Plans.save(opts.plan); close(); toast('Материал добавлен в блок'); if (opts.onAdd) opts.onAdd(); return; }
    if (mode === 'block') { const bl = plan0.blocks.find(z => z.id === b.dataset.bid); bl.itemId = x.id; Plans.save(plan0); close(); toast('Материал добавлен в урок'); return; }
    if (mode === 'new-block') {
      plan0.blocks.push({ id: uid('b'), key: x.play ? 'practice' : 'topic', title: x.play ? 'Дополнительная активность' : 'Дополнительный мини-урок', duration: itemMin(x), mode: 'slot', accept: 'any', qkind: null, questions: [], itemId: x.id, note: '', skipped: false, visited: false });
      Plans.save(plan0); close(); toast('Добавлен новый блок в урок'); return;
    }
    if (mode === 'new-plan') {
      const p = Plans.create();
      p.template = 'standard'; p.blocks = buildBlocks('standard'); p.step = 'prepare';
      const bl = p.blocks.find(z => z.mode === 'slot' && acceptFilter(z.accept)(x)) || p.blocks.find(z => z.mode === 'slot');
      bl.itemId = x.id; Plans.save(p); close(); location.hash = '#/builder=' + p.id;
    }
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#libDrawer').classList.remove('open'); $('#drawerBg2').classList.remove('open'); closePicker(); closeNewLessonModal(); } });

/* ---------- Отчёты: таблица + детали ---------- */

  if (!shown.find(p => p.id === repF.sel)) repF.sel = shown[0] ? shown[0].id : null;
  const cur = shown.find(p => p.id === repF.sel);
  const fmtD = p => new Date(p.report.sentAt || p.report.savedAt || p.updatedAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

  root.innerHTML = `
    <div class="ws-lib-head">
      <div><h1>Отчёты</h1><p>Каждый проведённый пробный заканчивается здесь: итоги, заметки и следующий шаг.</p></div>
      <div class="ws-glass ws-lib-search">${ic('search')}<input id="repQ" placeholder="Поиск по ученику…" value="${esc(repF.q)}"></div>
    </div>
    <div class="gl-tl-filters">
      <button class="gl-tl-pill${repF.status === 'all' ? ' on' : ''}" data-rs="all">Все · ${all.length}</button>
      <button class="gl-tl-pill${repF.status === 'draft' ? ' on' : ''}" data-rs="draft">Черновики · ${drafts.length}</button>
      <button class="gl-tl-pill${repF.status === 'sent' ? ' on' : ''}" data-rs="sent">Отправлены · ${sent.length}</button>
    </div>
    ${all.length ? `<div class="ws-rep">
      <div class="ws-rep-l">
        <div class="ws-rep-cols"><span>Ученик</span><span>Шаблон</span><span>Дата</span><span>Уровень</span><span>Статус</span></div>
        <div class="ws-rep-tbl">${shown.map(p => `<button class="ws-glass ws-rep-row${p.id === repF.sel ? ' sel' : ''}" data-rrow="${esc(p.id)}">
          <b>${esc(p.student.name || 'Ученик')}</b><span class="mu">${esc(tplName(p))}</span><span class="mu">${esc(fmtD(p))}</span>
          <span class="lvl">${esc(p.report.level || p.student.level || '—')}</span>
          <span class="ws-badge ${p.report.sentAt ? 'sent' : 'draft'}">${p.report.sentAt ? 'Отправлен' : 'Черновик'}</span></button>`).join('') || '<div class="empty">Ничего не нашлось.</div>'}</div>
      </div>
      ${cur ? `<aside class="ws-glass ws-rep-d">
        <div class="hd"><span class="ws-badge ${cur.report.sentAt ? 'sent' : 'draft'}">${cur.report.sentAt ? 'Отправлен' : 'Черновик'}</span><span>${esc(fmtD(cur))}</span></div>
        <h2>${esc(cur.student.name || 'Ученик')}</h2>
        <div class="sub">${esc(tplName(cur))} · ${planTotalMin(cur)} мин</div>
        <div class="sec"><span class="lb">Темы урока</span><div class="v">${esc((cur.report.topics || []).join(', ') || '—')}</div></div>
        <div class="sec"><span class="lb">Что получилось</span><div class="v">${esc(cur.report.good || '—')}</div></div>
        <div class="sec"><span class="lb">Что не очень</span><div class="v">${esc(cur.report.bad || '—')}</div></div>
        <div class="sec"><span class="lb">Рекомендация</span><div class="v">Уровень <b>${esc(cur.report.level || '—')}</b>${cur.report.goal ? ' · цель: ' + esc(cur.report.goal) : ''}</div></div>
        ${cur.report.notes ? `<div class="sec"><span class="lb">Заметки</span><div class="v">${esc(cur.report.notes)}</div></div>` : ''}
        <div class="btns"><button class="ws-ghost" id="repEdit">Редактировать</button><button class="ws-cta" id="repSendAgain">${cur.report.sentAt ? 'Отправить снова' : 'Отправить'}</button></div>
      </aside>` : ''}
    </div>` : `<div class="empty" style="margin-top:20px">Пока нет отчётов — они появятся здесь после того, как вы проведёте пробный и дойдёте до шага «Отчёт».</div>`}`;
  root.querySelector('#repQ').oninput = e => { repF.q = e.target.value; rerender(); const n = root.querySelector('#repQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  root.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => { repF.status = b.dataset.rs; rerender(); });
  root.querySelectorAll('[data-rrow]').forEach(b => b.onclick = () => { repF.sel = b.dataset.rrow; rerender(); });
  if (cur) {
    root.querySelector('#repEdit').onclick = () => { cur.step = 'report'; Plans.save(cur); location.hash = '#/builder=' + cur.id; };
    root.querySelector('#repSendAgain').onclick = async () => { await sendReportToAdmin(cur, cur.report); rerender(); };
  }
}

/* ======================= "Сегодня у вас": кто залогинен и что у него сегодня ======================= */
// Supabase SDK уже встроен в <head> (та же сборка, что в teacher.html/admin.html). Если учитель уже
// авторизован в кабинете в этом браузере — Supabase хранит сессию в localStorage этого же origin,
// и здесь она подхватится сама, без отдельного экрана логина. Если сессии нет — просто не показываем
// виджет, страница остаётся доступной как раньше (без логина).
const SUPABASE_URL = 'https://uuwtarchkltdmaddndgm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jlcvNafksQ0WhrYCY08anw_ju194-I9';
const SCHOOL_TZ = 'Europe/Moscow';
let CurrentTeacher = null;   // { profile, todaysTrials } — null, пока не определили/если не залогинен

function fmtDateKey(d){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: SCHOOL_TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(d));
  const g = t => parts.find(p => p.type === t).value;
  return `${g('year')}-${g('month')}-${g('day')}`;
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function loadTodayWidget(){
  try {
    let waited = 0;
    while (!window.__sbLoaded && !window.__sbFailed && waited < 4000) { await sleep(100); waited += 100; }
    if (!window.supabase) return;
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await Promise.race([sb.auth.getSession(), sleep(5000).then(() => ({ data: { session: null } }))]);
    if (!session) return;
    const { data: profile } = await sb.from('profiles').select('id, full_name, timezone').eq('id', session.user.id).single();
    if (!profile) return;
    const { data: lessons } = await sb.from('lessons')
      .select('id, lesson_date, duration_minutes, status, guest_name, student_id, profiles!lessons_student_id_fkey(full_name)')
      .eq('teacher_id', profile.id).eq('is_trial', true).order('lesson_date', { ascending: true });
    const todayKey = fmtDateKey(new Date());
    const todaysTrials = (lessons || []).filter(l => l.status === 'upcoming' && fmtDateKey(l.lesson_date) === todayKey);
    const { data: trialRequests } = await sb.from('trial_requests')
      .select('id, full_name, age, current_level, goal')
      .eq('assigned_teacher_id', profile.id).eq('status', 'confirmed')
      .order('created_at', { ascending: false }).limit(30);
    CurrentTeacher = { profile, todaysTrials, trialRequests: trialRequests || [] };
    if ((currentRoute || 'home') === 'home') renderPage();
  } catch(e){ /* тихо: виджет необязателен, страница и так работает */ }
}

function renderTodayWidget(){
  if (!CurrentTeacher || !CurrentTeacher.todaysTrials || !CurrentTeacher.todaysTrials.length) return '';
  const tz = CurrentTeacher.profile.timezone || SCHOOL_TZ;
  const items = CurrentTeacher.todaysTrials.map(l => {
    const time = new Date(l.lesson_date).toLocaleTimeString('ru-RU', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
    const name = l.guest_name || (l.profiles && l.profiles.full_name) || 'Ученик';
    return `<div class="gl-today-item"><span class="t">${esc(time)}</span><span class="n">${esc(name)}</span>
      <button class="gl-today-add" data-quickplan="${esc(l.id)}" data-qname="${esc(name)}">+ Урок</button></div>`;
  }).join('');
  return `<div class="gl-glass gl-today" id="todayWidget"><span class="gl-today-lbl">Сегодня у вас</span><div class="gl-today-list">${items}</div></div>`;
}
