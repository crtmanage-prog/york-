.speak-card .h{color:var(--ink-2);grid-column:1}
.speak-card .h::before{content:"💡 "}
.timer{grid-row:1 / span 2;grid-column:2;font-family:Unbounded,sans-serif;font-weight:600;border:1.5px solid var(--ink);border-radius:999px;padding:10px 16px;background:transparent;min-width:96px}
.timer.run{background:var(--accent)}
.timer.over{background:var(--ink);color:var(--accent)}
@media (max-width:600px){ .speak-card{grid-template-columns:1fr} .timer{grid-row:auto;grid-column:1;justify-self:start} }

/* схемы */
.note{margin-top:18px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:.92em}
.note::before{content:"💡 "}
.v-compare{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.v-col{background:var(--card);border-radius:var(--r);padding:18px 20px;border-top:8px solid var(--accent)}
.v-col:nth-child(2){border-top-color:var(--ink)}
.v-col .ic{font-size:2.2em;line-height:1}
.v-col h4{font-family:Unbounded,sans-serif;font-size:1em;margin:8px 0 2px}
.v-col .sub{color:var(--ink-3);font-size:.85em;margin-bottom:10px}
.v-col ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.v-col li{background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:600}
.v-formula{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.v-part{flex:1 1 160px;background:var(--card);border-radius:var(--r);padding:14px 16px;position:relative;border:1.5px solid var(--line)}
.v-part:nth-child(odd){background:var(--accent-soft);border-color:var(--accent)}
.v-part b{font-family:Unbounded,sans-serif;font-size:.8em;display:block;color:var(--ink-2);margin-bottom:4px}
.v-part span{font-weight:600;font-size:1.1em}
.v-scale{display:grid;gap:8px;border-left:10px solid;border-image:linear-gradient(var(--accent-soft),var(--ink)) 1;padding-left:16px}
.v-step{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;background:var(--card);border-radius:12px;padding:10px 16px}
.v-step b{font-size:1.15em;min-width:9em}
.v-step span{color:var(--ink-2)}
.v-up{display:grid;gap:10px}
.v-up-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.v-up-row .from{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.v-up-row .arr{font-size:1.3em}
.v-up-row .to{background:var(--accent);border-radius:12px;padding:8px 14px;font-weight:600}
@media (max-width:600px){ .v-up-row{grid-template-columns:1fr} .v-up-row .arr{display:none} }
.v-table{display:grid;gap:8px}
.v-row{display:grid;grid-template-columns:2.2em 1fr 1fr;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:10px 16px}
.v-row .e{font-size:1.5em}
.v-row :nth-child(2){font-weight:600}
.v-row :nth-child(3){color:var(--ink-2)}
@media (max-width:600px){ .v-row{grid-template-columns:2em 1fr} .v-row :nth-child(3){grid-column:2} }

/* задания */
.task-score{display:inline-block;margin-left:10px;font-family:'Golos Text',sans-serif;text-transform:none;letter-spacing:0;background:var(--accent);color:var(--ink);border-radius:999px;padding:2px 10px}
.items{display:grid;gap:12px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;transition:border-color .2s}
.item.ok{border-color:#7FB800}
.item .pic{font-size:1.9em;grid-row:span 2}
.item .q{font-weight:600}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--ink-3);text-align:center;color:var(--ink-3)}
.gap.filled{border-color:#7FB800;color:var(--ink);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--ink);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.95em}
.opt:hover:not(:disabled){background:var(--accent-soft)}
.opt.right{background:#C8EA7A;border-color:#7FB800}
.opt.wrong{background:#FBD9D5;border-color:#D9534F;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.build{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;gap:10px}
.build.ok{border-color:#7FB800}
.build.bad{border-color:#D9534F}
.line{min-height:52px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px;align-items:center}
.build.ok .line{border-bottom-color:#7FB800}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.w{border:1.5px solid var(--ink);background:var(--accent-soft);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.95em}
.line .w{background:var(--card)}
.build.ok .w{background:#C8EA7A;border-color:#7FB800;cursor:default}
.build-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ink-3);text-decoration:underline;font-size:.8em;padding:0}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-col{display:grid;gap:10px;align-content:start}
.m{border:1.5px solid var(--ink);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;text-align:left;font-size:.95em}
.m.sel{background:var(--accent);}
.m.done{background:#C8EA7A;border-color:#7FB800;opacity:.75;cursor:default}
.m.wrong{background:#FBD9D5;border-color:#D9534F;animation:shake .35s}
.reveal{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.reveal .q{font-weight:600}
.reveal .a{width:100%;background:var(--accent-soft);border-radius:10px;padding:8px 14px;font-weight:600;display:none}
.reveal.open .a{display:block;animation:fadein .25s}
.result-big{font-family:Unbounded,sans-serif;font-size:clamp(24px,4vw,46px);line-height:1.2;background:var(--accent);border-radius:var(--r);padding:clamp(18px,3vw,32px);margin:0 0 20px}
.result-big::before{content:"✓ ";}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#B3261E}
/* активности */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.big-q{font-size:clamp(22px,3.2vw,38px);font-weight:600;margin:0 0 16px;line-height:1.25}
.helper{margin-top:22px;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:10px 16px;color:var(--ink-2);font-size:.9em}
.play-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.play-row .muted{margin-right:auto}
.timer.big{font-size:1.2em;padding:14px 24px}
.facts{display:grid;gap:12px}
.fact{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 20px;text-align:left;font-size:clamp(18px,2.4vw,28px);font-weight:600}
.fact .n{font-family:Unbounded,sans-serif;background:var(--ink);color:var(--accent);border-radius:50%;width:1.8em;height:1.8em;display:grid;place-items:center;font-size:.7em}
.fact .t[contenteditable]{min-height:1.4em;outline:none;border-bottom:2px dashed var(--line)}
.fact .t[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-3)}
.fact .verdict{font-family:Unbounded,sans-serif;font-size:.7em}
.fact.truth{border-color:#7FB800;background:#EEF8D8}
.fact.lie{border-color:#D9534F;background:#FBE3E0}
.fact.guess{border-color:var(--ink);background:var(--accent-soft)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.vs-opt{border:2px solid var(--ink);background:var(--card);border-radius:var(--r);padding:clamp(18px,3vw,36px);font-size:clamp(20px,2.8vw,34px);font-weight:600;line-height:1.2}
.vs-opt:hover{background:var(--accent-soft)}
.vs-opt.picked{background:var(--accent)}
.vs-or{align-self:center;font-family:Unbounded,sans-serif;font-weight:700;font-size:1.2em}
@media (max-width:600px){ .vs{grid-template-columns:1fr} .vs-or{justify-self:center} }
.rank{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.rank-item{display:flex;gap:14px;align-items:center;border:1.5px solid var(--ink);background:var(--card);border-radius:14px;padding:12px 18px;font-size:clamp(19px,2.4vw,28px);font-weight:600;text-align:left}
.rank-item .pos{font-family:Unbounded,sans-serif;width:1.7em;height:1.7em;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:.8em}
.rank-item.on{background:var(--accent-soft)}
.rank-item.on .pos{background:var(--ink);color:var(--accent);border:0}
.sit-card{background:var(--ink);color:#fff;border-radius:var(--r);padding:clamp(20px,4vw,40px)}
.sit-card p{font-size:clamp(22px,3.4vw,42px);font-weight:600;margin:10px 0 18px;line-height:1.2}
.sit-lbl{color:var(--accent);font-family:Unbounded,sans-serif;font-size:.9em}
.sit-role{display:inline-block;background:var(--accent);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85em}
.pic-grid{display:grid;gap:20px}
@media (min-width:900px){ .pic-grid{grid-template-columns:1.2fr 1fr;align-items:start} }
.scene{background:linear-gradient(#E8F4FF,#FFF8E6);border-radius:var(--r);border:1.5px solid var(--line);padding:clamp(16px,3vw,32px);text-align:center;font-size:clamp(40px,7vw,78px);line-height:1.35;display:grid;gap:4px}
.scene div{letter-spacing:.12em}
.pic-grid .bubble{font-size:clamp(18px,2.2vw,26px)}
.clues{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.clue{border:2px dashed var(--ink);background:var(--card);border-radius:var(--r);padding:22px;font-size:clamp(18px,2.2vw,26px);font-weight:600;min-height:110px}
.clue:not(.open){color:var(--ink-3)}
.clue.open{border-style:solid;background:var(--accent-soft);cursor:default;animation:fadein .3s}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side{border-radius:var(--r);padding:18px;display:grid;gap:12px;justify-items:start}
.side h4{margin:0;font-family:Unbounded,sans-serif;font-size:1.1em}
.side.for{background:#EEF8D8;border:1.5px solid #7FB800}
.side.against{background:#FBE3E0;border:1.5px solid #D9534F}
.side .timer{grid-row:auto;grid-column:auto}
@media (max-width:600px){ .sides{grid-template-columns:1fr} }
.exit{display:grid;gap:14px;margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.exit-box{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.exit-box input{font:inherit;border:0;border-bottom:2px solid var(--line);padding:6px 2px;background:transparent;min-width:0}
.exit-box input:focus{outline:none;border-color:var(--accent)}
.exit-mini{background:var(--card);border:1.5px dashed var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:18px}
.exit-mini b{margin-right:8px}

.fw{display:grid;gap:10px}
.fw-row{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;flex-wrap:wrap}
.fw-t{flex:1;min-width:200px;font-size:clamp(18px,2.2vw,26px);font-weight:600}
.fw-row.yes{border-color:#7FB800;background:#EEF8D8}
.fw-row.no{border-color:#D9534F;background:#FBE3E0}
.op-scale{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:600px){ .op-scale{grid-template-columns:1fr} }

/* =====================================================================
   КОНСТРУКТОР УРОКА + РЕЖИМ УРОКА + ОТЧЁТ — тёмная неоновая тема
   поверх общей светлой библиотеки (намеренный контраст: это "кабина
   пилота" для учителя, а не то, что видит ученик при показе экрана).
   ===================================================================== */
.yb{
  --yb-accent:var(--accent); --yb-accent2:#8FE000;
  --yb-ink:#F6F8EC; --yb-ink2:rgba(246,248,236,.74); --yb-ink3:rgba(246,248,236,.52);
  --yb-card:rgba(255,255,255,.055); --yb-card-hov:rgba(255,255,255,.09); --yb-line:rgba(255,255,255,.14);
  background:
    radial-gradient(1100px circle at 12% -12%, rgba(215,239,66,.20), transparent 58%),
    radial-gradient(800px circle at 102% 4%, rgba(143,224,0,.14), transparent 55%),
    linear-gradient(180deg,#0A0C06 0%,#10120A 100%);
  color:var(--yb-ink);
  border-radius:24px;
}
.yb h1,.yb h2,.yb h3,.yb h4{color:var(--yb-ink)}
.yb .muted,.yb p{color:var(--yb-ink2)}
.yb-glow{text-shadow:0 0 22px rgba(215,239,66,.45)}
.yb-card{background:var(--yb-card);border:1.5px solid var(--yb-line);border-radius:18px;backdrop-filter:blur(2px)}
.yb-btn{font-family:Unbounded,sans-serif;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:100px;padding:10px 18px;border:1.5px solid var(--yb-line);background:rgba(255,255,255,.04);color:var(--yb-ink);transition:transform .15s,background .15s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.yb-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}
.yb-btn.on{background:var(--yb-accent);border-color:var(--yb-accent);color:#0A0C06;box-shadow:0 0 24px rgba(215,239,66,.45)}
.yb-btn.on:hover{box-shadow:0 0 32px rgba(215,239,66,.6)}
.yb-btn.danger{border-color:rgba(255,107,91,.5);color:#FF9D8F}
.yb-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* --- Dashboard: CTA + недавние уроки --- */
.yb-hero{padding:clamp(24px,4vw,42px);margin-bottom:18px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.yb-hero-txt{max-width:46ch}
.yb-hero-txt .tag{color:var(--yb-accent);font-family:Unbounded,sans-serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.yb-hero-txt h2{font-size:clamp(22px,3vw,32px);margin:8px 0 6px;line-height:1.2}
.yb-recent{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-bottom:8px}
.yb-rc{padding:16px 18px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.yb-rc:hover{background:var(--yb-card-hov)}
.yb-rc .nm{font-family:Unbounded,sans-serif;font-size:14px}
.yb-rc .meta{font-size:12px;color:var(--yb-ink3)}
.yb-rc .st{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px}
.yb-rc .st.draft{background:rgba(255,255,255,.1);color:var(--yb-ink2)}
.yb-rc .st.done{background:var(--yb-accent);color:#0A0C06}

/* --- Builder: форма ученика + таймлайн блоков --- */
.yb-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;align-items:start}
@media (max-width:900px){ .yb-grid{grid-template-columns:1fr} }
.yb-field{display:grid;gap:5px;margin-bottom:12px}
.yb-field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--yb-ink3)}
.yb-field input,.yb-field select,.yb-field textarea{font:inherit;font-size:14.5px;background:rgba(255,255,255,.06);border:1.5px solid var(--yb-line);border-radius:12px;padding:10px 13px;color:var(--yb-ink);min-width:0}
.yb-field select option{background:#14160D;color:#F6F8EC}
.yb-field textarea{resize:vertical;min-height:60px}
.yb-field input::placeholder,.yb-field textarea::placeholder{color:var(--yb-ink3)}
.yb-field input:focus,.yb-field select:focus,.yb-field textarea:focus{outline:none;border-color:var(--yb-accent)}
.yb-blocks{display:grid;gap:10px}
.yb-block{padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:grab}
.yb-block.dragging{opacity:.4}
.yb-block .gh{color:var(--yb-ink3);font-size:16px;cursor:grab;user-select:none}
.yb-block .kind{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--yb-accent)}
.yb-block .ttl{font-family:Unbounded,sans-serif;font-size:14px;margin-top:2px}
.yb-block .dur{font-size:12px;color:var(--yb-ink3);margin-top:2px}
.yb-block .acts{display:flex;gap:4px}
.yb-block .acts button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--yb-ink2);font-size:13px}
.yb-block .acts button:hover{background:rgba(255,255,255,.1)}
.yb-add-row{display:flex;justify-content:center;padding:4px 0}
.yb-empty{border:1.5px dashed var(--yb-line);border-radius:16px;padding:24px;text-align:center;color:var(--yb-ink3);font-size:13.5px}

/* --- модалка выбора материала --- */
.yb-modal-bg{position:fixed;inset:0;background:rgba(5,6,3,.6);z-index:55;display:none}
.yb-modal-bg.open{display:block}
.yb-modal{position:fixed;top:4vh;left:50%;transform:translateX(-50%);width:min(760px,92vw);max-height:92vh;z-index:56;display:none;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.yb-modal.open{display:flex}
.yb-modal.yb{background:radial-gradient(900px circle at 10% -10%, rgba(215,239,66,.18), transparent 58%),linear-gradient(165deg,#0E1009 0%,#12140A 100%)}
.yb-modal-head{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--yb-line)}
.yb-modal-head input{flex:1;font:inherit;font-size:14.5px;background:rgba(255,255,255,.06);border:1.5px solid var(--yb-line);border-radius:12px;padding:9px 13px;color:var(--yb-ink)}
.yb-modal-tabs{display:flex;gap:6px;padding:10px 18px 0}
.yb-modal-body{overflow:auto;padding:14px 18px 20px;display:grid;gap:8px}
.yb-pick{padding:11px 14px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;background:rgba(255,255,255,.03)}
.yb-pick:hover{background:var(--yb-card-hov)}
.yb-pick .ic{font-size:19px}
.yb-pick .grow{flex:1;min-width:0}
.yb-pick .t{font-weight:600;font-size:13.5px}
.yb-pick .s{font-size:11.5px;color:var(--yb-ink3)}

/* --- Live Lesson Mode: полноэкранный тёмный режим --- */
.live{position:fixed;inset:0;z-index:52;display:none;flex-direction:row;border-radius:0}
.live.open{display:flex}
.live-side{width:280px;flex:none;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--yb-line)}
.live-main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
.live-top{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--yb-line)}
.live-top .grow{flex:1}
.live-stu{font-family:Unbounded,sans-serif;font-size:13px}
.live-body{flex:1;max-width:980px;width:100%;margin:0 auto;padding:clamp(18px,3vw,36px) 24px 40px}
.live-foot{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--yb-line);flex-wrap:wrap}
.live-foot .grow{flex:1}
.lv-step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;background:transparent;border:0;width:100%}
.lv-step:hover{background:var(--yb-card-hov)}
.lv-step.cur{background:rgba(215,239,66,.14);box-shadow:inset 0 0 0 1.5px rgba(215,239,66,.5)}
.lv-step.skipped{opacity:.42}
.lv-step .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--yb-line);display:grid;place-items:center;flex:none;font-size:11px;margin-top:1px}

.lv-note{width:100%;font:inherit;font-size:14px;background:rgba(255,255,255,.05);border:1.5px solid var(--yb-line);border-radius:12px;padding:12px 14px;color:var(--yb-ink);min-height:70px;margin-top:6px}

/* --- отчёт о пробном --- */
.yb-report{max-width:640px;margin:0 auto;width:100%}
.yb-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}

/* --- "Сегодня у вас" — пробные текущего учителя, если он залогинен в этом браузере --- */
.yb-today{padding:16px 20px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.yb-today-item .t{font-family:Unbounded,sans-serif;font-size:13px}
.yb-today-item .n{font-size:13px;color:var(--yb-ink2)}

</style>

<script>
/* ======================= утилиты ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, def){ try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};
const lvClass = lv => 'lv-' + String(lv).replace(/[^A-Z0-9]/gi, '');

/* ---------- перевод: ищем фразу в translations.json ---------- */
const trOf = x => (DB && DB.translations && typeof x === 'string' && DB.translations[x]) || '';
const ru = x => { const r = trOf(x); return r ? `<span class="ru">${esc(r)}</span>` : ''; };            // строкой ниже
const ruI = x => { const r = trOf(x); return r ? ` <span class="ru ru-i">— ${esc(r)}</span>` : ''; };  // в той же строке
const T = x => esc(x) + ru(x);                                                                          // английский + перевод
const ruOn = () => store.get('york-hub-ru', true);
function setRu(on){
  store.set('york-hub-ru', on);
  document.body.classList.toggle('no-ru', !on);
  document.querySelectorAll('[data-ru-toggle]').forEach(b => { b.setAttribute('aria-pressed', on); b.querySelector('.rt').textContent = on ? 'Перевод: вкл' : 'Перевод: выкл'; });
}

let DB = null;            // загруженный контент
let byId = {};            // все темы и активности по id
let currentRoute = '';    // текущий раздел (для возврата после урока)

/* ======================= закладки ======================= */
const Saved = {
  ids: new Set(store.get('york-hub-saved', [])),
  has(id){ return this.ids.has(id); },
  toggle(id){ this.ids.has(id) ? this.ids.delete(id) : this.ids.add(id); store.set('york-hub-saved', [...this.ids]); },
};
const starBtn = id => `<button class="star${Saved.has(id) ? ' on' : ''}" data-star="${esc(id)}" title="${Saved.has(id) ? 'Убрать из избранного' : 'В избранное'}" aria-pressed="${Saved.has(id)}">${Saved.has(id) ? '★' : '☆'}</button>`;

/* ======================= частота использования («часто используете») ======================= */
const Usage = {
  counts: store.get('york-hub-usage', {}),
  bump(id){ if (!id) return; this.counts[id] = (this.counts[id] || 0) + 1; store.set('york-hub-usage', this.counts); },
  top(n, filterFn){
    return Object.entries(this.counts)
      .filter(([id, c]) => c > 0 && byId[id] && (!filterFn || filterFn(byId[id])))
      .sort((a, b) => b[1] - a[1])
      .slice(0, n)
      .map(([id]) => byId[id]);
  },
};

/* ======================= загрузка контента ======================= */
async function loadContent(){
  const entries = await Promise.all(Object.entries(CONTENT_FILES).map(async ([key, url]) => {
    let res;
    try { res = await fetch(url, { cache: 'no-cache' }); }
    catch(e){ throw new Error(`Не удалось загрузить ${url} — нет соединения или страница открыта как файл (нужен сайт или локальный сервер).`); }
    if (!res.ok) throw new Error(`Файл ${url} не найден (ошибка ${res.status}).`);
    const text = await res.text();
    try { return [key, JSON.parse(text)]; }
    catch(e){ throw new Error(`Ошибка в файле ${url}: ${e.message}. Скорее всего, лишняя или пропущенная запятая/кавычка.`); }
  }));
  return Object.fromEntries(entries);
}

// Проверяем обязательные поля: кривую запись показываем списком, а не ломаем всю страницу
function validate(db){
  const problems = [];
  const levels = new Set(db.meta.levels), cats = new Set(db.meta.categories.map(c => c.id));
  const actCats = new Set(db.activities.categories.map(c => c.id));
  const ids = new Set();
  db.lessons = db.lessons.filter((l, i) => {
    const miss = ['id', 'level', 'category', 'title', 'outcome'].filter(k => !l[k]);
    if (miss.length) { problems.push(`lessons.json, тема №${i + 1}: нет полей ${miss.join(', ')}`); return false; }
    if (!levels.has(l.level)) { problems.push(`lessons.json, «${l.title}»: неизвестный уровень ${l.level}`); return false; }
    if (!cats.has(l.category)) { problems.push(`lessons.json, «${l.title}»: неизвестная категория ${l.category}`); return false; }
    if (ids.has(l.id)) { problems.push(`lessons.json: повторяется id ${l.id}`); return false; }
    ids.add(l.id); l.explanation = l.explanation || []; return true;
  });
  db.activities.items = db.activities.items.filter((a, i) => {
    const miss = ['id', 'category', 'title', 'levels', 'play'].filter(k => !a[k]);
    if (miss.length) { problems.push(`activities.json, активность №${i + 1}: нет полей ${miss.join(', ')}`); return false; }
    if (!actCats.has(a.category)) { problems.push(`activities.json, «${a.title}»: неизвестная категория ${a.category}`); return false; }
    if (!PLAY[a.play.type]) { problems.push(`activities.json, «${a.title}»: неизвестный тип экрана ${a.play.type}`); return false; }
    if (ids.has(a.id)) { problems.push(`activities.json: повторяется id ${a.id}`); return false; }
    ids.add(a.id); a.phrases = a.phrases || []; return true;
  });
  return problems;
}

/* ======================= компоненты ======================= */
const Components = {
  LevelBadge: lv => `<span class="badge ${lvClass(lv)}">${esc(lv)}</span>`,
  LevelRange(levels){
    const all = DB.meta.levels;
    const txt = levels.length === all.length ? 'Any level' : levels.length > 1 ? `${levels[0]} – ${levels[levels.length - 1]}` : levels[0];
    return `<span class="badge ${levels.length === 1 ? lvClass(levels[0]) : ''}">${esc(txt)}</span>`;
  },
  CategoryTag(catId){
    const c = DB.meta.categories.find(x => x.id === catId);
    return c ? `<span class="tag">${c.icon} ${esc(c.label)}</span>` : '';
  },

  LessonCard(l){
    return `<article class="card">
      <div class="card-top"><div class="grow">${Components.LevelBadge(l.level)}${Components.CategoryTag(l.category)}</div>${starBtn(l.id)}</div>
      <h3><span class="ic">${l.icon || '📘'}</span><span><button data-open="${esc(l.id)}">${esc(l.title)}</button>${ru(l.title)}</span></h3>
      <p class="outcome">«${esc(l.outcome)}»</p>
      ${l.leadIn ? `<div class="lead"><b>Lead-in question</b>${T(l.leadIn)}</div>` : ''}
      <div class="actions">
        <button class="btn primary" data-show="${esc(l.id)}">▶ Show to student</button>
        <button class="btn ghost" data-open="${esc(l.id)}">Open card</button>
      </div>
    </article>`;
  },

  ActivityCard(a){
    const cat = DB.activities.categories.find(c => c.id === a.category);
    return `<article class="card">
      <div class="card-top"><div class="grow">${Components.LevelRange(a.levels)}<span class="tag">${cat ? cat.icon + ' ' + esc(cat.label) : ''}${a.sub ? ' · ' + esc(a.sub) : ''}</span></div>${starBtn(a.id)}</div>
      <h3><span class="ic">${a.icon || '🎲'}</span><span>${T(a.title)}</span></h3>
      <div class="kv"><b>Goal</b>${esc(a.goal)}</div>
      <div class="kv"><b>How to run</b>${esc(a.how)}</div>
      ${a.phrases.length ? `<ul class="phrases">${a.phrases.map(p => `<li>${T(p)}</li>`).join('')}</ul>` : ''}
      <div class="actions">
        <button class="btn primary" data-show="${esc(a.id)}">▶ Show to student</button>
        ${a.phrases.length ? `<button class="btn ghost" data-copy="${esc(a.id)}">Copy phrases</button>` : ''}
      </div>
    </article>`;
  },

  GrammarCard(l){
    const note = l.lesson && l.lesson.visual && l.lesson.visual.note;
    return `<article class="card">
      <div class="card-top"><div class="grow">${Components.LevelBadge(l.level)}<span class="tag">${esc(l.section || '')}</span></div>${starBtn(l.id)}</div>
      <h3><span class="ic">${l.icon || '🧩'}</span><span><button data-open="${esc(l.id)}">${esc(l.title)}</button>${ru(l.title)}</span></h3>
      <div class="kv"><b>Explanation</b>${esc(l.idea)}${note ? ' ' + esc(note) : ''}</div>
      <div class="kv"><b>Examples</b></div><ul class="phrases">${l.explanation.map(p => `<li>${T(p)}</li>`).join('')}</ul>
      ${l.mistakes ? `<div class="kv"><b>Common mistakes</b></div>${Components.Mistakes(l.mistakes)}` : ''}
      ${l.speaking ? `<div class="lead"><b>Speaking task</b>${T(l.speaking)}</div>` : ''}
      <div class="actions"><button class="btn primary" data-show="${esc(l.id)}">▶ Show to student</button></div>
    </article>`;
  },

  Mistakes: list => `<div class="mistakes">${list.map(([bad, good]) =>
    `<div class="mistake"><span class="bad">✗ ${esc(bad)}</span><span class="arr">→</span><span class="good">✓ ${esc(good)}${ru(good)}</span></div>`).join('')}</div>`,

  // FilterBar: конфиг рядов → элемент. Каждый ряд сам сообщает о выборе через onChange.
  FilterBar({ rows = [], search, saved }){
    const el = document.createElement('section');
    el.className = 'filterbar';
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'fb-row';
      row.innerHTML = `<span class="fb-lbl">${esc(r.label)}</span>`;
      r.options.forEach(o => {
        const b = document.createElement('button');
        b.className = 'pill ' + (r.cls || '');
        b.innerHTML = esc(o.label) + (o.hint ? `<small>${esc(o.hint)}</small>` : '');
        b.setAttribute('aria-pressed', r.value === o.value);
        b.onclick = () => r.onChange(r.value === o.value && r.toggle ? null : o.value);
        row.appendChild(b);
      });
      el.appendChild(row);
    });
    const sr = document.createElement('div');
    sr.className = 'fb-search';
    sr.innerHTML = `<input class="search" type="search" placeholder="${esc(search.placeholder)}" value="${esc(search.value)}" autocomplete="off">`;
    const input = sr.querySelector('input');
    input.oninput = () => search.onChange(input.value);
    if (saved) {
      const sb = document.createElement('button');
      sb.className = 'pill soft';
      sb.textContent = '★ Saved';
      sb.setAttribute('aria-pressed', saved.value);
      sb.onclick = () => saved.onChange(!saved.value);
      sr.appendChild(sb);
    }
    el.appendChild(sr);
    return el;
  },

  TimelineBlock(b, total){
    const pct = ((b.to - b.from) / total) * 100;
    const ex = b.exampleLesson && byId[b.exampleLesson];
    return `<div class="tl">
      <div class="tl-time">${b.from}–${b.to} min</div>
      <div class="tl-body">
        <h3>${T(b.title)}</h3>
        <p>${esc(b.text)}</p>
        <div class="tl-bar" title="${b.to - b.from} минут из ${total}"><span style="width:${pct}%;margin-left:${(b.from / total) * 100}%"></span></div>
        <div class="tl-groups">${(b.groups || []).map(g => `<div class="tl-group"><b>${esc(g.label)}</b><ul>${g.items.map(i => `<li>${T(i)}</li>`).join('')}</ul></div>`).join('')}</div>
        ${ex ? `<div class="tl-example"><p class="muted" style="margin:0 0 8px">Пример карточки темы:</p>${Components.LessonCard(ex)}</div>` : ''}
        ${b.link ? `<div class="actions" style="margin-top:12px"><a class="btn ghost" href="#/${esc(b.link)}">Open Speaking Activities →</a></div>` : ''}
      </div>
    </div>`;
  },

  // TeacherChecklist: отметки хранятся в браузере преподавателя, «Новый урок» сбрасывает
  TeacherChecklist(groups){
    const el = document.createElement('div');
    const state = store.get('york-hub-checklist', {});
    const total = groups.reduce((n, g) => n + g.items.length, 0);
    el.innerHTML = `<div class="result-line"><b id="clCount"></b><button class="btn ghost" id="clReset">↺ New lesson</button></div>
      <div class="progress"><span id="clBar"></span></div>
      <div class="checklist">${groups.map(g => `<div class="cl-group"><h3><span>${T(g.title)}</span></h3>
        ${g.items.map((it, i) => { const key = g.id + ':' + i; return `<label class="cl-item"><input type="checkbox" data-key="${esc(key)}" ${state[key] ? 'checked' : ''}><span>${T(it)}</span></label>`; }).join('')}
      </div>`).join('')}</div>`;
    const upd = () => {
      const n = el.querySelectorAll('input:checked').length;
      el.querySelector('#clCount').textContent = `${n} / ${total} done`;
      el.querySelector('#clBar').style.width = (n / total * 100) + '%';
    };
    el.querySelectorAll('input').forEach(i => i.onchange = () => { state[i.dataset.key] = i.checked; store.set('york-hub-checklist', state); upd(); });
    el.querySelector('#clReset').onclick = () => { el.querySelectorAll('input').forEach(i => { i.checked = false; }); for (const k in state) delete state[k]; store.set('york-hub-checklist', state); upd(); };
    upd();
    return el;
  },

  ResourceCard(r, cat){
    return `<div class="res"><span class="ri">${cat ? cat.icon : '📎'}</span><div>
      <h3>${T(r.title)}</h3><p>${esc(r.description || '')}</p>
      ${r.url ? `<a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener">Open →</a>`
              : `<button class="btn ghost" disabled title="Ссылку ещё не добавили в materials.json">Link coming soon</button>`}
    </div></div>`;
  },
};

/* ======================= страницы ======================= */
const filters = {
  lessons: store.get('york-hub-lessons-filters', { level: null, category: null, situation: null, q: '', saved: false }),
  activities: { category: null, level: null, q: '', saved: false },
  grammar: { level: null, q: '' },
};
const saveLessonFilters = () => store.set('york-hub-lessons-filters', { ...filters.lessons, q: '' });

const Pages = {
  home: {
    title: 'Dashboard', icon: '🏠',
    render(root){
      const S = DB.structure;

/* ======================= фильтрация ======================= */
const norm = s => String(s || '').toLowerCase();
const matches = (q, ...fields) => !q.trim() || fields.flat().some(x => norm(x).includes(norm(q.trim())));
const grammarLessons = () => DB.lessons.filter(l => l.category === 'grammar');

function filterLessons(){
  const f = filters.lessons;
  let list = DB.lessons;
  if (f.situation) {
    const s = DB.meta.situations.find(x => x.key === f.situation);
    list = s ? s.topics.map(id => byId[id]).filter(Boolean) : list;
  }
  if (f.level) list = list.filter(l => l.level === f.level);
  if (f.category) list = list.filter(l => l.category === f.category);
  if (f.saved) list = list.filter(l => Saved.has(l.id));
  return list.filter(l => matches(f.q, l.title, l.section, l.idea, l.explanation, l.outcome));
}
function filterActivities(){
  const f = filters.activities;
  return DB.activities.items.filter(a =>
    (!f.category || a.category === f.category) && (!f.level || a.levels.includes(f.level)) && (!f.saved || Saved.has(a.id)) &&
    matches(f.q, a.title, a.goal, a.how, a.phrases, a.sub));
}
function filterGrammar(){
  const f = filters.grammar;
  return grammarLessons().filter(l => (!f.level || l.level === f.level) && matches(f.q, l.title, l.idea, l.explanation));
}
function refreshGrid(root, cards, total, noun){
  root.querySelector('.grid').innerHTML = cards.join('') || '<div class="empty">Ничего не нашлось — сбросьте фильтры.</div>';
  root.querySelector('.result-line .muted').textContent = `${cards.length} of ${total} ${noun}`;
}

  const html = Object.entries(Pages).map(([key, p]) => {

function route(){
  const h = location.hash;
  const linked = (h.match(/^#lesson=([\w-]+)/) || [])[1];   // ссылка ученика на урок
  if (linked) {
    if (!byId[linked]) { toast('Урок по ссылке не найден — возможно, его переименовали', true); location.hash = '#/'; return; }
    if (show.classList.contains('open')) return;
    currentRoute = byId[linked].play ? 'activities' : 'lessons';
    renderPage();
    safeHistory('replaceState', null, '#/' + currentRoute);   // «Назад» из урока вернёт в раздел, а не в тот же урок
    openShow(byId[linked]);
    return;
  }
  const r = h.replace(/^#\/?/, '');
  const target = Pages[r] ? r : (r.indexOf('builder=') === 0 ? r : '');
  if (show.classList.contains('open')) { closeShowUI(); if ($('#page').dataset.route === target) return; }
  if (live.classList.contains('open') && r.indexOf('builder=') !== 0) closeLive();
  currentRoute = target;
  renderPage();
}

}

/* ---------- копирование ---------- */
let toastTimer;
function toast(msg, isErr){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), isErr ? 4000 : 1800);
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  return ok;
}

async function copyPhrases(t){
  const text = (t.explanation || t.phrases).join('\n');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e){ ok = fallbackCopy(text); }
  if (ok) toast(`Скопировано фраз: ${(t.explanation || t.phrases).length}`);
  else toast('Не получилось скопировать — выделите фразы в карточке вручную', true);
}

/* ---------- мини-урок (режим показа) ---------- */
const show = $('#show');
const TASK_TITLES = { choose: 'Выбери правильный вариант', build: 'Собери предложение', match: 'Найди пару', reveal: 'Скажи сам — потом проверь' };
let lesson = null;   // { topic, steps: [{label, node}], cur, started, clockTimer }
let liveOnShowClose = null;   // колбэк: вернуться в Live mode после показа темы ученику

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function node(html){ const d = document.createElement('div'); d.className = 'step'; d.innerHTML = html; return d; }
const head = (kicker, title) => `<p class="kicker">${kicker}</p>${title ? `<h2>${esc(title)}${ru(title)}</h2>` : ''}`;

function lessonSteps(t){
  if (t.play) return actSteps(t);
  const L = t.lesson || {};
  const steps = [];
  if (L.warmup) steps.push({ label: 'Разминка', node: stepWarmup(L.warmup) });
  steps.push({ label: 'Тема', node: stepIntro(t) });
  if (L.visual) steps.push({ label: 'Схема', node: stepVisual(t, L.visual) });
  (L.tasks || []).forEach((task, i) => steps.push({ label: `Задание ${i + 1}`, node: stepTask(task, i + 1) }));
  if (L.speak) steps.push({ label: 'Говорим', node: stepSpeak(L.speak) });
  steps.push({ label: 'Итог', node: stepResult(t) });
  return steps;
}
const stepCount = t => { if (t.play) return 2; const L = t.lesson || {}; return (L.warmup ? 1 : 0) + 1 + (L.visual ? 1 : 0) + (L.tasks || []).length + (L.speak ? 1 : 0) + 1; };

function stepWarmup(qs){
  return node(`${head('Разминка', 'Let’s talk!')}<div class="bubbles">${qs.map(q => `<div class="bubble">${T(q)}</div>`).join('')}</div>`);

function stepVisual(t, v){
  let body = '';
  if (v.type === 'compare') body = `<div class="v-compare">${v.cols.map(c => `<div class="v-col">
      <div class="ic">${c.icon || ''}</div><h4>${esc(c.label)}</h4>${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ''}
      <ul>${c.examples.map(x => `<li>${T(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if (v.type === 'formula') body = `<div class="v-formula">${v.parts.map(p => `<div class="v-part"><b>${esc(p.t)}</b><span>${T(p.ex)}</span></div>`).join('')}</div>`;
  if (v.type === 'scale') body = `<div class="v-scale">${v.steps.map(s => `<div class="v-step"><b>${esc(s.w)}</b><span>${esc(s.d)}</span></div>`).join('')}</div>`;
  if (v.type === 'upgrade') body = `<div class="v-up">${v.pairs.map(([a, b]) => `<div class="v-up-row"><span class="from">${T(a)}</span><span class="arr">→</span><span class="to">${T(b)}</span></div>`).join('')}</div>`;
  if (v.type === 'table') body = `<div class="v-table">${v.rows.map(r => `<div class="v-row"><span class="e">${r[0]}</span><span>${T(r[1])}</span><span>${T(r[2] || '')}</span></div>`).join('')}</div>`;
  return node(`${head('Схема', t.title)}${body}${v.note ? `<div class="note">${esc(v.note)}</div>` : ''}`);
}

function stepTask(task, n){
  const d = node(`${head(`Задание ${n}<span class="task-score" hidden></span>`, task.title || TASK_TITLES[task.type])}<div class="items"></div>`);
  const box = d.querySelector('.items');
  const score = d.querySelector('.task-score');
  const total = task.type === 'match' ? task.pairs.length : task.items.length;
  let doneCount = 0;
  const done = () => { doneCount++; score.hidden = false; score.textContent = `${doneCount} / ${total}` + (doneCount === total ? ' 🎉' : ''); };

  if (task.type === 'choose') task.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<span class="pic">${it.pic || '❔'}</span>
      <div class="q">${esc(it.q).replace(/___/g, '<span class="gap">?</span>')}${trOf(it.q) ? `<span class="ru ru-after">${esc(trOf(it.q))}</span>` : ''}</div>
      <div class="opts"></div>`;
    const opts = el.querySelector('.opts');
    shuffle(it.options.map((o, i) => ({ o, i }))).forEach(({ o, i }) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o;
      b.onclick = () => {
        if (i !== it.a) { b.classList.add('wrong'); b.disabled = true; return; }
        b.classList.add('right'); el.classList.add('ok');
        opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
        const gaps = el.querySelectorAll('.gap');
        const parts = o.split(' / ');   // «drinks / is drinking» → в два пропуска
        gaps.forEach((g, k) => { g.textContent = gaps.length > 1 ? (parts[k] || o) : o; g.classList.add('filled'); });
        done();
      };
      opts.appendChild(b);
    });
    box.appendChild(el);
  });

  if (task.type === 'build') task.items.forEach(sentence => {
    const words = sentence.split(' ');
    let order = shuffle(words);
    for (let k = 0; k < 5 && words.length > 1 && order.join(' ') === sentence; k++) order = shuffle(words);
    const el = document.createElement('div');
    el.className = 'build';
    el.innerHTML = `${trOf(sentence) ? `<div class="ru ru-prompt">${esc(trOf(sentence))}</div>` : ''}<div class="line"></div><div class="build-row"><div class="bank"></div><button class="linkbtn">показать ответ</button></div>`;
    const line = el.querySelector('.line'), bank = el.querySelector('.bank');
    let solved = false;
    const check = () => {
      el.classList.remove('bad');
      if (bank.children.length) return;
      const got = [...line.children].map(w => w.textContent).join(' ');
      if (got === sentence) { solved = true; el.classList.add('ok'); done(); }
      else el.classList.add('bad');
    };
    order.forEach(w => {
      const b = document.createElement('button');
      b.className = 'w'; b.textContent = w;
      b.onclick = () => { if (solved) return; (b.parentNode === bank ? line : bank).appendChild(b); check(); };
      bank.appendChild(b);
    });
    el.querySelector('.linkbtn').onclick = () => {
      if (solved) return;
      const btns = [...line.children, ...bank.children];
      words.forEach(w => { const b = btns.find(x => x.textContent === w && !x.dataset.used); b.dataset.used = 1; line.appendChild(b); });
      check();
    };
    box.appendChild(el);
  });

  if (task.type === 'match') {
    const wrap = document.createElement('div');
    wrap.className = 'match';
    const L = document.createElement('div'), R = document.createElement('div');
    L.className = R.className = 'match-col';
    let sel = { l: null, r: null };
    const mk = (text, idx, side) => {
      const b = document.createElement('button');
      b.className = 'm'; b.innerHTML = T(text); b.dataset.idx = idx;
      b.onclick = () => {
        if (b.classList.contains('done')) return;
        (side === 'l' ? L : R).querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel'); sel[side] = b;
        if (sel.l && sel.r) {
          const a = sel.l, c = sel.r;
          if (a.dataset.idx === c.dataset.idx) { a.className = c.className = 'm done'; done(); }
          else [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('wrong'); setTimeout(() => x.classList.remove('wrong'), 450); });
          sel = { l: null, r: null };
        }
      };
      return b;
    };
    task.pairs.forEach(([a], i) => L.appendChild(mk(a, i, 'l')));
    shuffle(task.pairs.map(([, b], i) => ({ b, i }))).forEach(({ b, i }) => R.appendChild(mk(b, i, 'r')));
    wrap.append(L, R);
    box.appendChild(wrap);
  }

  if (task.type === 'reveal') task.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'reveal';
    el.innerHTML = `<span class="q">${T(it.q)}</span><button class="opt">Ответ</button><div class="a">${T(it.a)}</div>`;
    const b = el.querySelector('button');
    let counted = false;
    b.onclick = () => {
      const open = el.classList.toggle('open');
      b.textContent = open ? 'Скрыть' : 'Ответ';
      if (open && !counted) { counted = true; done(); }
    };
    box.appendChild(el);
  });
  return d;
}

/* ---------- разговорные активности ---------- */
let runningTimers = [];   // останавливаем при закрытии урока

// кнопка-таймер: клик — старт, ещё клик — пауза, после «Время!» — заново
function makeTimer(sec, cls){
  const b = document.createElement('button');
  b.className = 'timer' + (cls ? ' ' + cls : '');
  let left = sec, id = null;
  const fmt = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
  const draw = () => { b.textContent = left > 0 ? `⏱ ${fmt(left)}` : 'Время! ✓'; };
  const stop = () => { clearInterval(id); runningTimers = runningTimers.filter(x => x !== id); id = null; b.classList.remove('run'); };
  b.onclick = () => {
    if (id) return stop();
    if (left <= 0) { left = sec; b.classList.remove('over'); draw(); }
    b.classList.add('run');
    id = setInterval(() => { left--; draw(); if (left <= 0) { stop(); b.classList.add('over'); b.dispatchEvent(new Event('timeup')); } }, 1000);
    runningTimers.push(id);
  };
  draw();
  return b;
}

// вкладки внутри экрана (уровни, категории)
function makeTabs(labels, onPick){
  const w = document.createElement('div');
  w.className = 'tabs';
  labels.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'stp' + (i ? '' : ' cur');
    b.textContent = l;
    b.onclick = () => { w.querySelectorAll('.stp').forEach(x => x.classList.remove('cur')); b.classList.add('cur'); onPick(i); };
    w.appendChild(b);
  });
  return w;
}

const helper = list => list && list.length ? `<div class="helper">💬 ${list.map(esc).join(' · ')}</div>` : '';
function btn(text, cls, onclick){ const b = document.createElement('button'); b.className = cls || 'btn'; b.textContent = text; b.onclick = onclick; return b; }

function actSteps(a){
  const intro = node(`<div class="show-ic">${a.icon}</div><h2>${esc(a.title)}${ru(a.title)}</h2>
    <p class="show-idea">${T(a.rules)}</p>
    ${a.phrases.length ? `<p class="kicker">Фразы в помощь</p><ul class="show-phrases">${a.phrases.map(p => `<li>${T(p)}</li>`).join('')}</ul>` : ''}`);
  const play = node(`${head(a.icon + ' ' + esc(a.title), '')}`);
  PLAY[a.play.type](a, play);
  return [{ label: 'Правила', node: intro }, { label: 'Играем', node: play }];
}

const PLAY = {
  truths(a, root){
    const area = document.createElement('div');
    const draw = i => {
      area.innerHTML = '';
      if (i === a.play.sets.length) {   // «Твоя очередь» — три пустые карточки
        area.innerHTML = `<p class="big-q">Your turn! Tell me 2 truths and 1 lie.<span class="ru">Твоя очередь! Назови 2 правдивых факта и 1 ложный.</span></p>`;
        const g = document.createElement('div'); g.className = 'facts';
        const states = ['?', '🤔 My guess', '✓ Truth', '✗ Lie'], cls = ['', 'guess', 'truth', 'lie'];
        [1, 2, 3].forEach(n => {
          const c = document.createElement('div'); c.className = 'fact';
          c.innerHTML = `<span class="n">${n}</span><div class="t" contenteditable="true" data-ph="Fact ${n}…"></div>`;
          let k = 0;
          c.appendChild(btn(states[0], 'opt', function(){ k = (k + 1) % states.length; this.textContent = states[k]; c.className = 'fact ' + cls[k]; }));
          g.appendChild(c);
        });
        area.appendChild(g);
        area.insertAdjacentHTML('beforeend', `<p class="muted" style="margin-top:12px">Факты можно вписать прямо в карточки. Кнопка под фактом: догадка → правда → ложь.</p>`);
        return;
      }
      const set = a.play.sets[i];
      area.innerHTML = `<p class="big-q">${esc(set.intro)} Which one is a lie?<span class="ru">Познакомься с Томом. Какой факт — ложь?</span></p>`;
      const g = document.createElement('div'); g.className = 'facts';
      set.facts.forEach(([text, isLie], n) => {
        const c = document.createElement('button'); c.className = 'fact';
        c.innerHTML = `<span class="n">${n + 1}</span><span class="t">${T(text)}</span><span class="verdict"></span>`;
        c.onclick = () => { c.classList.add(isLie ? 'lie' : 'truth'); c.querySelector('.verdict').textContent = isLie ? '✗ LIE!' : '✓ True'; };
        g.appendChild(c);
      });
      area.appendChild(g);
    };
    root.append(makeTabs([...a.play.sets.map(s => 'Tom · ' + s.label), '🙋 Your turn'], draw), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw(0);
  },

  rather(a, root){
    const area = document.createElement('div');
    let set = 0, qi = 0;
    const draw = () => {
      const [x, y] = a.play.sets[set].qs[qi];
      area.innerHTML = `<p class="big-q">Would you rather…<span class="ru">Что бы ты выбрал(а)…</span></p>`;
      const vs = document.createElement('div'); vs.className = 'vs';
      const pick = b => { vs.querySelectorAll('.vs-opt').forEach(o => o.classList.toggle('picked', o === b)); };
      const bx = btn(x, 'vs-opt', function(){ pick(this); }), by = btn(y, 'vs-opt', function(){ pick(this); });
      bx.innerHTML = T(x); by.innerHTML = T(y);
      vs.append(bx, Object.assign(document.createElement('span'), { className: 'vs-or', textContent: 'or' }), by);
      area.appendChild(vs);
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${qi + 1} / ${a.play.sets[set].qs.length}` }),
        btn('Другой вопрос →', 'btn primary', () => { qi = (qi + 1) % a.play.sets[set].qs.length; draw(); }));
      area.appendChild(row);
    };
    root.append(makeTabs(a.play.sets.map(s => s.label), i => { set = i; qi = 0; draw(); }), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw();
  },

  ranking(a, root){
    const area = document.createElement('div');
    const draw = i => {
      const set = a.play.sets[i];
      let ranked = [];
      area.innerHTML = `<p class="big-q">${T(set.title)}</p><p class="muted">Нажимайте по порядку: сначала самое важное. Повторное нажатие убирает из рейтинга.</p>`;

        b.style.order = pos >= 0 ? pos : 99;
      });
      set.items.forEach(v => {
        const b = document.createElement('button'); b.className = 'rank-item'; b.dataset.v = v;

        list.appendChild(b);

      area.appendChild(list);
      area.appendChild(btn('Сбросить', 'btn', () => { ranked = []; paint(); }));
      paint();
    };
    root.append(makeTabs(a.play.sets.map(s => s.label), draw), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));

  },

    const draw = () => {

      area.appendChild(row);

    root.append(makeTabs(a.play.cats.map(c => c.label), i => { cat = i; ci = 0; draw(); }), area);

      const row = document.createElement('div'); row.className = 'play-row';

      timer.addEventListener('timeup', () => { up.hidden = false; });

  picture(a, root){
    const area = document.createElement('div');
    let si = 0, lvl = 0;
    const qs = document.createElement('div');
    const drawQs = () => { qs.innerHTML = `<div class="bubbles">${a.play.questions[lvl].qs.map(q => `<div class="bubble">${T(q)}</div>`).join('')}</div>`; };
    const draw = () => {
      const sc = a.play.scenes[si];

    const done = btn('✓ Готово', 'btn primary', () => {

    });
    const out = document.createElement('div');
    out.style.marginTop = '16px';
    root.append(done, out);
  },
};

function goStep(i){
  if (!lesson) return;
  lesson.cur = Math.max(0, Math.min(i, lesson.steps.length - 1));
  lesson.steps.forEach((s, k) => s.node.classList.toggle('cur', k === lesson.cur));
  const pills = [...$('#steps').children];
  pills.forEach((p, k) => { p.classList.toggle('cur', k === lesson.cur); p.classList.toggle('done', k < lesson.cur); });
  pills[lesson.cur].scrollIntoView({ block: 'nearest', inline: 'center' });
  $('#stepCount').textContent = `${lesson.cur + 1} / ${lesson.steps.length}`;
  $('#stepPrev').style.visibility = lesson.cur === 0 ? 'hidden' : '';
  $('#stepNext').textContent = lesson.cur === lesson.steps.length - 1 ? 'Завершить ✓' : 'Дальше →';
  $('#showScroll').scrollTop = 0;
}

function openShow(t){
  if (!t) return;
  const steps = lessonSteps(t);
  const body = $('#showBody'); body.innerHTML = '';
  steps.forEach(s => body.appendChild(s.node));
  const nav = $('#steps'); nav.innerHTML = '';
  steps.forEach((s, k) => { const b = document.createElement('button'); b.className = 'stp'; b.textContent = s.label; b.onclick = () => goStep(k); nav.appendChild(b); });
  if (lesson) clearInterval(lesson.clockTimer);
  lesson = { topic: t, steps, cur: 0, started: Date.now() };
  const tick = () => { const s = Math.floor((Date.now() - lesson.started) / 1000); $('#clock').textContent = `⏱ ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  tick(); lesson.clockTimer = setInterval(tick, 1000);
  show.classList.add('open');
  document.body.style.overflow = 'hidden';
  goStep(0);
  safeHistory('pushState', { show: true }, '#lesson=' + t.id);   // «Назад» на телефоне закрывает урок
  $('#stepNext').focus();
}

// изменение адреса — только удобство (кнопка «Назад», ссылка); если браузер запрещает, урок всё равно работает
function safeHistory(method, state, hash){
  try { history[method](state, '', hash || ('#/' + currentRoute)); } catch(e){}
}

function closeShowUI(){
  show.classList.remove('open');
  document.body.style.overflow = liveState ? 'hidden' : '';   // если показ открыт поверх Live mode — блокировку скролла не снимаем
  if (lesson) clearInterval(lesson.clockTimer);
  runningTimers.forEach(clearInterval); runningTimers = [];
  lesson = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (location.hash.startsWith('#lesson=')) safeHistory('replaceState', null);   // не перетираем раздел, куда человек уже перешёл
  if (typeof liveOnShowClose === 'function') { const cb = liveOnShowClose; liveOnShowClose = null; cb(); }
}

function closeShow(){
  if (history.state && history.state.show) history.back(); // закроется через popstate
  else closeShowUI();
}

window.addEventListener('popstate', () => { if (show.classList.contains('open')) closeShowUI(); });
$('#showBack').onclick = closeShow;
$('#stepPrev').onclick = () => goStep(lesson.cur - 1);
$('#stepNext').onclick = () => { if (lesson.cur === lesson.steps.length - 1) closeShow(); else goStep(lesson.cur + 1); };
$('#showFs').onclick = () => {
  if (document.fullscreenElement) return document.exitFullscreen().catch(() => {});
  if (!show.requestFullscreen) return toast('Этот браузер не поддерживает полноэкранный режим', true);
  show.requestFullscreen().catch(() => toast('Не удалось включить полноэкранный режим', true));
};
$('#showLink').onclick = async () => {
  const url = location.href.split('#')[0] + '#lesson=' + lesson.topic.id;
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch(e){ ok = fallbackCopy(url); }
  if (ok) toast('Ссылка на урок скопирована — отправьте ученику');
  else toast('Не получилось скопировать ссылку: ' + url, true);
};
document.addEventListener('keydown', e => {
  if (!show.classList.contains('open')) return;
  if (e.key === 'Escape' && !document.fullscreenElement) closeShow();
  if (e.key === 'ArrowRight') goStep(lesson.cur + 1);
  if (e.key === 'ArrowLeft' && lesson.cur > 0) goStep(lesson.cur - 1);
});

const Plans = {
  list(){ return store.get('york-hub-plans', []).slice().sort((a, b) => b.updatedAt - a.updatedAt); },
  get(id){ return this.list().find(p => p.id === id); },
  saveAll(list){ store.set('york-hub-plans', list); },
  create(){
    const p = {
      id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      createdAt: Date.now(), updatedAt: Date.now(),
      student: { name: '', age: '', level: '', goal: '', interests: '', notes: '' },
      blocks: [
        mkBlock('warmup', { title: 'Разминка', questions: ['How are you today?', 'What have you been up to lately?'] }),
        mkBlock('discovery', { title: 'Цели и интересы', questions: ['Why do you want to learn English?', 'What do you enjoy doing in your free time?'] }),
        mkBlock('wrapup', { title: 'Итог и следующий шаг', questions: ['What’s one new thing you learned today?'] }),
      ],
      status: 'draft', report: null,
    };
    const list = this.list(); list.unshift(p); this.saveAll(list);
    return p;
  },
  save(p){ p.updatedAt = Date.now(); const list = this.list().filter(x => x.id !== p.id); list.unshift(p); this.saveAll(list); },
  remove(id){ this.saveAll(this.list().filter(p => p.id !== id)); },
};
function mkBlock(kind, extra){
  return Object.assign({ id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), kind, type: 'custom', title: '', duration: 5, questions: [], note: '', skipped: false }, extra);
}
function itemBlock(kind, item){
  return { id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), kind, type: 'item', refId: item.id, title: item.title, duration: item.play ? 8 : 12, skipped: false };

    blocksEl.querySelectorAll('[data-down]').forEach(b => b.onclick = () => { moveBlock(plan, b.dataset.down, 1); save(); rerenderBlocks(); });
    blocksEl.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { plan.blocks = plan.blocks.filter(x => x.id !== b.dataset.del); save(); rerenderBlocks(); });

function renderBlocksList(plan){
  if (!plan.blocks.length) return '<div class="yb-empty">Пока пусто — добавьте тему или активность.</div>';
  return plan.blocks.map((b, i) => `

      <div class="acts">
        ${i > 0 ? `<button data-up="${esc(b.id)}" title="Выше">↑</button>` : ''}

        <button data-del="${esc(b.id)}" title="Удалить">✕</button>
      </div>
    </div>`).join('');
}
function moveBlock(plan, id, dir){
  const i = plan.blocks.findIndex(b => b.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= plan.blocks.length) return;
  [plan.blocks[i], plan.blocks[j]] = [plan.blocks[j], plan.blocks[i]];
}

        ${x.how ? `<p style="margin:0 0 10px"><b style="color:var(--yb-accent)">How to run:</b> ${esc(x.how)}</p>` : ''}
        ${(x.explanation || x.phrases || []).length ? `<ul class="lv-explain">${(x.explanation || x.phrases).map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
        ${x.mistakes ? `<div style="margin:10px 0 4px"><b style="color:var(--yb-ink3);font-size:11px;text-transform:uppercase">Типичные ошибки</b></div>${Components.Mistakes(x.mistakes)}` : ''}
        ${x.speaking ? `<p style="margin:10px 0 0"><b style="color:var(--yb-accent)">Speaking:</b> ${esc(x.speaking)}</p>` : ''}
      </div>
      <button class="yb-btn on" id="pvAdd" style="width:100%;justify-content:center;margin-top:14px;padding:12px">+ Добавить в урок</button>`;
    $('#pvBack').onclick = drawList;
    $('#pvAdd').onclick = () => { Usage.bump(x.id); onPick(x); closePicker(); };
  };
  searchEl.oninput = drawList;
  drawList();
  bg.classList.add('open'); modal.classList.add('open');
  searchEl.focus();
}
function closePicker(){ $('#pickerBg').classList.remove('open'); $('#picker').classList.remove('open'); }
$('#pickerClose').onclick = closePicker;
$('#pickerBg').onclick = closePicker;

/* ---------- Live Lesson Mode ---------- */
const live = $('#live');
let liveState = null;   // { plan, cur, started, clockTimer }

function openLive(plan){
  liveState = { plan, cur: 0, started: Date.now() };
  $('.live-foot').style.display = '';
  $('.live-side').style.display = '';
  $('#liveStu').textContent = (plan.student.name || 'Урок') + (plan.student.level ? ' · ' + plan.student.level : '');
  live.classList.add('open');
  document.body.style.overflow = 'hidden';
  const tick = () => { const s = Math.floor((Date.now() - liveState.started) / 1000); $('#liveClock').textContent = `⏱ ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  tick(); liveState.clockTimer = setInterval(tick, 1000);
  renderLiveStep();
}
function closeLive(){
  if (!liveState) return;
  clearInterval(liveState.clockTimer);
  live.classList.remove('open');
  document.body.style.overflow = '';
  liveState = null;
}
$('#liveClose').onclick = () => { if (confirm('Выйти из режима урока? Прогресс и заметки уже сохранены.')) closeLive(); };

function renderLiveSidebar(){
  const { plan, cur } = liveState;
  $('#liveSteps').innerHTML = plan.blocks.map((b, i) => `
    <button class="lv-step${i === cur ? ' cur' : ''}${b.skipped ? ' skipped' : ''}${b.visited && i !== cur ? ' done' : ''}" data-i="${i}">
      <span class="dot">${b.skipped ? '–' : (i + 1)}</span>
      <span><div class="kind">${esc(BLOCK_KIND_LABEL[b.kind] || b.kind)}</div><div class="ttl">${esc(b.title || '—')}</div></span>
    </button>`).join('');
  $('#liveSteps').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { liveState.cur = +b.dataset.i; renderLiveStep(); });
}

function renderLiveStep(){
  const { plan, cur } = liveState;
  if (cur >= plan.blocks.length) return openReport();
  const b = plan.blocks[cur];
  b.visited = true;
  renderLiveSidebar();
  const body = $('#liveBody');
  if (b.type === 'item') {
    const item = byId[b.refId];
    if (!item) {
      body.innerHTML = `<div class="empty">Материал не найден — возможно, его переименовали в банке.</div>`;
    } else {
      body.innerHTML = `<p class="lv-block-kind">${esc(BLOCK_KIND_LABEL[b.kind] || b.kind)}</p>
        <h2 class="lv-block-ttl yb-glow">${esc(item.icon || '')} ${esc(item.title)}</h2>
        <div class="yb-card lv-item-card">
          ${item.outcome ? `<p class="outcome">«${esc(item.outcome)}»</p>` : ''}
          ${item.idea ? `<p>${esc(item.idea)}</p>` : ''}
          ${item.goal ? `<p>${esc(item.goal)}</p>` : ''}
          ${item.how ? `<p>${esc(item.how)}</p>` : ''}
          <ul class="lv-explain">${(item.explanation || item.phrases || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul>
          ${item.mistakes ? `<div class="kv" style="color:var(--yb-ink2)"><b style="color:var(--yb-ink3)">Типичные ошибки</b></div>${Components.Mistakes(item.mistakes)}` : ''}
          ${item.speaking ? `<p><b style="color:var(--yb-accent)">Speaking:</b> ${esc(item.speaking)}</p>` : ''}
        </div>
        <button class="yb-btn on" id="liveOpenShow">▶ Открыть интерактивный урок для ученика</button>`;
      body.querySelector('#liveOpenShow').onclick = () => {
        Usage.bump(item.id);
        live.style.visibility = 'hidden';
        liveOnShowClose = () => { live.style.visibility = ''; };
        openShow(item);
      };
    }
  } else {
    const hasBank = !!QUESTION_BANK[b.kind];
    body.innerHTML = `<p class="lv-block-kind">${esc(BLOCK_KIND_LABEL[b.kind] || b.kind)}</p>
      <h2 class="lv-block-ttl yb-glow">${esc(b.title || '')}</h2>
      <ul class="lv-qs" id="liveQs">${(b.questions || []).map(q => `<li>${esc(q)}<button data-rmq="${esc(q)}" title="Убрать вопрос">✕</button></li>`).join('')}</ul>
      ${hasBank ? `<button class="yb-btn" id="liveMoreQ" style="display:block;width:max-content;margin-bottom:18px">🎲 Ещё идеи и вопросы</button>` : ''}
      <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--yb-ink3)">Заметки</label>
      <textarea class="lv-note" id="liveNote" placeholder="Что сказал ученик, на что обратить внимание…">${esc(b.note || '')}</textarea>`;
    body.querySelector('#liveNote').oninput = e => { b.note = e.target.value; Plans.save(plan); };
    body.querySelectorAll('[data-rmq]').forEach(btn => btn.onclick = () => { b.questions = (b.questions || []).filter(q => q !== btn.dataset.rmq); Plans.save(plan); renderLiveStep(); });
    if (hasBank) body.querySelector('#liveMoreQ').onclick = () => {
      const fresh = moreQuestions(b.kind, b.questions || []);
      if (!fresh.length) { toast('Больше новых идей в банке нет для этого блока'); return; }
      b.questions = [...(b.questions || []), ...fresh];
      Plans.save(plan);
      renderLiveStep();
    };
  }
  $('#livePrev').disabled = cur === 0;
  $('#liveNext').textContent = cur === plan.blocks.length - 1 ? 'Завершить урок ✓' : 'Дальше →';
}

$('#livePrev').onclick = () => { if (liveState.cur > 0) { liveState.cur--; renderLiveStep(); } };
$('#liveNext').onclick = () => { liveState.cur++; renderLiveStep(); };
$('#liveSkip').onclick = () => { liveState.plan.blocks[liveState.cur].skipped = true; Plans.save(liveState.plan); liveState.cur++; renderLiveStep(); };
$('#liveAdd').onclick = () => openPicker(item => {
  const b = itemBlock(item.play ? 'activity' : 'topic', item);
  liveState.plan.blocks.splice(liveState.cur + 1, 0, b);
  Plans.save(liveState.plan);
  renderLiveSidebar();
});

/* ---------- Отчёт о пробном ---------- */
function openReport(){
  const { plan } = liveState;
  const topics = plan.blocks.filter(b => !b.skipped && b.type === 'item').map(b => (byId[b.refId] || {}).title).filter(Boolean);
  const r = plan.report || { topics, strengths: '', challenges: '', format: 'SOLO', notes: '' };
  $('.live-side').style.display = 'none';
  $('.live-foot').style.display = 'none';
  $('#liveBody').innerHTML = `<div class="yb-report">
    <p class="lv-block-kind">Отчёт о пробном</p>
    <h2 class="lv-block-ttl yb-glow">${esc(plan.student.name || 'Ученик')}</h2>
    <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--yb-ink3)">Темы урока</label>
    <div class="yb-chips" id="repTopics"></div>
    <div class="yb-field"><label>Сильные стороны</label><textarea id="repStrengths">${esc(r.strengths)}</textarea></div>
    <div class="yb-field"><label>Что даётся сложнее</label><textarea id="repChallenges">${esc(r.challenges)}</textarea></div>
    <div class="yb-field"><label>Рекомендуемый формат</label><div class="yb-fmt"><button class="yb-btn${r.format === 'SOLO' ? ' on' : ''}" data-fmt="SOLO">SOLO</button><button class="yb-btn${r.format === 'CREW' ? ' on' : ''}" data-fmt="CREW">CREW</button></div></div>
    <div class="yb-field"><label>Заметки</label><textarea id="repNotes">${esc(r.notes)}</textarea></div>
    <div class="actions">
      <button class="yb-btn on" id="repSave">✓ Сохранить отчёт</button>
      <button class="yb-btn" id="repCopy">Скопировать как текст</button>
    </div>
  </div>`;
  const chipsEl = $('#repTopics');
  const drawChips = () => {
    chipsEl.innerHTML = r.topics.map((t, i) => `<span class="yb-chip">${esc(t)}<button data-rmv="${i}">✕</button></span>`).join('') || '<span class="muted">—</span>';
    chipsEl.querySelectorAll('[data-rmv]').forEach(b => b.onclick = () => { r.topics.splice(+b.dataset.rmv, 1); drawChips(); });
  };
  drawChips();
  $('#liveBody').querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => { r.format = b.dataset.fmt; $('#liveBody').querySelectorAll('[data-fmt]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#repSave').onclick = () => {
    r.strengths = $('#repStrengths').value; r.challenges = $('#repChallenges').value; r.notes = $('#repNotes').value; r.savedAt = Date.now();
    plan.report = r; plan.status = 'done'; Plans.save(plan);
    toast('Отчёт сохранён');
    closeLive();
    location.hash = '#/builder';
  };
  $('#repCopy').onclick = async () => {
    const text = `Пробный урок — ${plan.student.name || '-'}\nТемы: ${r.topics.join(', ') || '-'}\nСильные стороны: ${$('#repStrengths').value || '-'}\nСложнее даётся: ${$('#repChallenges').value || '-'}\nФормат: ${r.format}\nЗаметки: ${$('#repNotes').value || '-'}`;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch(e){ ok = fallbackCopy(text); }
    toast(ok ? 'Отчёт скопирован' : 'Не получилось скопировать', !ok);
  };
}

/* ======================= "Сегодня у вас": кто залогинен и что у него сегодня ======================= */
// Supabase SDK уже встроен в <head> (та же сборка, что в teacher.html/admin.html). Если учитель уже
// авторизован в кабинете в этом браузере — Supabase хранит сессию в localStorage этого же origin,
// и здесь она подхватится сама, без отдельного экрана логина. Если сессии нет — просто не показываем
// виджет, страница остаётся доступной как раньше (без логина).
const SUPABASE_URL = 'https://uuwtarchkltdmaddndgm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jlcvNafksQ0WhrYCY08anw_ju194-I9';
const SCHOOL_TZ = 'Asia/Yekaterinburg';
let CurrentTeacher = null;   // { profile, todaysTrials } — null, пока не определили/если не залогинен

function fmtDateKey(d){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: SCHOOL_TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(d));
  const g = t => parts.find(p => p.type === t).value;
  return `${g('year')}-${g('month')}-${g('day')}`;
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function loadTodayWidget(){
  try {
    let waited = 0;
    while (!window.__sbLoaded && !window.__sbFailed && waited < 4000) { await sleep(100); waited += 100; }
    if (!window.supabase) return;
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await Promise.race([sb.auth.getSession(), sleep(5000).then(() => ({ data: { session: null } }))]);
    if (!session) return;
    const { data: profile } = await sb.from('profiles').select('id, full_name, timezone').eq('id', session.user.id).single();
    if (!profile) return;
    const { data: lessons } = await sb.from('lessons')
      .select('id, lesson_date, duration_minutes, status, guest_name, student_id, profiles!lessons_student_id_fkey(full_name)')
      .eq('teacher_id', profile.id).eq('is_trial', true).order('lesson_date', { ascending: true });
    const todayKey = fmtDateKey(new Date());
    const todaysTrials = (lessons || []).filter(l => l.status === 'upcoming' && fmtDateKey(l.lesson_date) === todayKey);
    CurrentTeacher = { profile, todaysTrials };
    if ((currentRoute || 'home') === 'home') renderPage();
  } catch(e){ /* тихо: виджет необязателен, страница и так работает */ }
}

function renderTodayWidget(){
  if (!CurrentTeacher || !CurrentTeacher.todaysTrials || !CurrentTeacher.todaysTrials.length) return '';
  const tz = CurrentTeacher.profile.timezone || SCHOOL_TZ;
  const items = CurrentTeacher.todaysTrials.map(l => {
    const time = new Date(l.lesson_date).toLocaleTimeString('ru-RU', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
    const name = l.guest_name || (l.profiles && l.profiles.full_name) || 'Ученик';
    return `<div class="yb-today-item"><span class="t">${esc(time)}</span><span class="n">🌱 ${esc(name)}</span>
      <button class="yb-btn" data-quickplan="${esc(l.id)}" data-qname="${esc(name)}">+ Урок</button></div>`;
  }).join('');
  return `<div class="yb yb-today" id="todayWidget"><span class="yb-today-lbl">Сегодня у вас</span><div class="yb-today-list">${items}</div></div>`;
}

    DB = await loadContent();
  } catch(err) {

  const problems = validate(DB);

  }
})();
