<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YORK! — Конструктор пробного урока</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100vh}
  body{
    font:16px/1.5 'Golos Text',system-ui,sans-serif;color:#F6F8EC;
    background:
      radial-gradient(1100px circle at 15% -10%, rgba(215,239,66,.20), transparent 58%),
      radial-gradient(800px circle at 100% 0%, rgba(143,224,0,.14), transparent 55%),
      linear-gradient(180deg,#0A0C06 0%,#10120A 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  }
  .wrap{max-width:460px}
  .ic{font-size:56px;line-height:1;margin-bottom:18px}
  .badge{display:inline-block;font-family:Unbounded,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:#D7EF42;background:rgba(215,239,66,.12);border:1px solid rgba(215,239,66,.4);border-radius:100px;padding:6px 14px;margin-bottom:16px}
  h1{font-family:Unbounded,sans-serif;font-size:clamp(24px,4vw,32px);line-height:1.25;margin:0 0 14px;text-shadow:0 0 24px rgba(215,239,66,.4)}
  p{color:rgba(246,248,236,.74);margin:0 0 28px;font-size:15px}
  a.btn{font-family:Unbounded,sans-serif;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px;
    border-radius:100px;padding:12px 22px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#F6F8EC;text-decoration:none;transition:transform .15s,background .15s}
  a.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="ic">🛠️</div>
    <span class="badge">Уже в работе!</span>
    <h1>Конструктор пробного урока скоро будет готов</h1>
    <p>Собирать урок под ученика и вести весь пробный с одного экрана — уже тестируем. Немного терпения, и раздел откроется прямо здесь.</p>
    <a class="btn" href="teacher.html">← Назад в кабинет</a>
  </div>
</body>
</html>
