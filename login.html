<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет — YORK!</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#090A09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:#090A09; color:#fff; font-family:'Golos Text',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 14px; -webkit-font-smoothing:antialiased; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(circle at 20% 0%, rgba(215,239,66,.16), transparent 50%),
               radial-gradient(circle at 90% 90%, rgba(215,239,66,.1), transparent 50%);
  }
  a{color:inherit; text-decoration:none;}

  .wrap{width:100%; max-width:400px; text-align:center; position:relative;}
  .logo{font-family:'Unbounded',sans-serif; font-weight:900; font-size:24px; letter-spacing:-.04em; margin-bottom:6px;}
  .logo span{background:#D7EF42; color:#090A09; padding:0 5px; border-radius:7px;}
  .kicker{font-family:'Unbounded',sans-serif; font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#D7EF42; margin:0 0 22px;}

  .chips{
    display:flex; flex-wrap:nowrap; justify-content:center; gap:8px;
    margin-bottom:26px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  @media (max-width:399px){ .chips{justify-content:flex-start;} }
  .chip{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.13); border-radius:100px;
    padding:9px 14px; font-size:12.5px; font-weight:600; color:#fff; white-space:nowrap; flex-shrink:0;
  }

  .roles{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  a.role-card{
    display:flex; align-items:center; gap:12px; text-align:left;
    border-radius:16px; padding:15px 17px;
    transition:transform .15s ease, border-color .15s ease;
  }
  a.role-card:hover{transform:translateY(-2px);}
  a.role-student{
    background:linear-gradient(135deg, rgba(215,239,66,.22), rgba(215,239,66,.03));
    border:1px solid rgba(215,239,66,.38);
  }
  a.role-student:hover{border-color:rgba(215,239,66,.6);}
  a.role-teacher{
    background:linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.13);
  }
  a.role-teacher:hover{border-color:rgba(255,255,255,.3);}
  .role-ic{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .role-student .role-ic{background:#D7EF42;}
  .role-teacher .role-ic{width:34px; height:34px; background:rgba(255,255,255,.1); font-size:15px;}
  .role-body{flex:1; min-width:0;}
  .role-title{display:block; font-family:'Unbounded',sans-serif; font-weight:700; font-size:14px; color:#fff;}
  .role-teacher .role-title{font-weight:600; font-size:13px;}
  .role-sub{display:block; font-size:11px; color:rgba(255,255,255,.5); margin-top:2px;}
  .role-arrow{font-size:16px; flex-shrink:0; color:rgba(255,255,255,.4);}
  .role-student .role-arrow{color:#D7EF42;}

  .admin-link{
    display:inline-block; font-size:11px; font-weight:500; color:rgba(255,255,255,.28);
    margin-bottom:28px; padding:4px;
  }
  .admin-link:hover{color:rgba(255,255,255,.55);}

  .divider{border:none; border-top:1px solid rgba(255,255,255,.1); margin:0 0 22px;}

  .cta-box{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:18px 18px;}
  .cta-box p{margin:0 0 12px; font-size:12.5px; color:rgba(255,255,255,.55);}
  .cta-box a.btn-trial{
    display:inline-block; font-family:'Unbounded',sans-serif; font-weight:700; font-size:13px;
    color:#090A09; background:#fff; border-radius:100px; padding:12px 20px;
    transition:transform .15s ease, background .15s ease;
  }
  .cta-box a.btn-trial:hover{transform:translateY(-2px); background:#D7EF42;}
  @media (prefers-reduced-motion: reduce){ a.role-card, .cta-box a.btn-trial{transition:none;} }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">YORK<span>!</span></div>
  <p class="kicker">Кто заходит?</p>

  <div class="chips">
    <span class="chip">📅 Расписание</span>
    <span class="chip">📝 Домашка</span>
    <span class="chip">💳 Оплата</span>
    <span class="chip">📈 Прогресс</span>
  </div>

  <div class="roles">
    <a class="role-card role-student" href="cabinet.html">
      <span class="role-ic">🎓</span>
      <span class="role-body">
        <span class="role-title">Я ученик</span>
        <span class="role-sub">Войти в свой кабинет</span>
      </span>
      <span class="role-arrow">→</span>
    </a>
    <a class="role-card role-teacher" href="teacher.html">
      <span class="role-ic">📖</span>
      <span class="role-body">
        <span class="role-title">Я учитель</span>
      </span>
      <span class="role-arrow">→</span>
    </a>
  </div>

  <a class="admin-link" href="admin.html">Я админ</a>

  <hr class="divider">

  <div class="cta-box">
    <p>Ещё не ученик?</p>
    <a class="btn-trial" href="https://weyork.online/trial-form.html" target="_blank" rel="noopener">Записаться на бесплатный урок →</a>
  </div>
</div>

</body>
</html>
