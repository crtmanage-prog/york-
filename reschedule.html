<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Перенос занятия · YORK!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --accent:#D2E739; --ink:#1C1C1C; --panel:#F7F8EF; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--panel); color:var(--ink); font-family:'Inter',system-ui,sans-serif; }
  .card { max-width:440px; width:100%; background:#fff; border-radius:24px; padding:32px 24px; text-align:center; box-shadow:0 8px 30px rgba(28,28,28,.08); }
  h1 { font-family:'Unbounded',sans-serif; font-size:22px; margin:0 0 12px; }
  p { line-height:1.55; margin:0 0 24px; }
  .btn { display:inline-block; background:var(--accent); color:var(--ink); text-decoration:none; font-weight:600; padding:14px 28px; border-radius:999px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Перенос занятия</h1>
    <p>Переносы теперь согласует менеджер. Напишите ему, и мы подберём удобное время.</p>
    <a class="btn" href="https://t.me/thearbeiter01" target="_blank" rel="noopener">Написать менеджеру</a>
  </main>
</body>
</html>
