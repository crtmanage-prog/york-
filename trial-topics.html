<script>
/* =====================================================================
   МИНИ-УРОКИ (~15 минут) для режима «Показать ученику»
   Ключ — id темы из TOPICS. Шаги урока собираются так:
   Разминка (warmup) → Тема (idea + phrases) → Схема (visual)
   → Задания (tasks) → Говорим (speak) → Итог (result).
   Любой блок можно не указывать — шаг просто пропустится.

   visual.type:
     compare — две колонки:        cols: [{icon, label, sub, examples:[]}, …]
     formula — цепочка блоков:     parts: [{t, ex}, …]
     scale   — шкала сверху вниз:  steps: [{w, d}, …]
     upgrade — было → стало:       pairs: [[было, стало], …]
     table   — строки-таблица:     rows: [[emoji, текст, текст], …]
     note — подсказка внизу (необязательно)

   tasks[].type:
     choose — выбор варианта:      items: [{pic, q (пропуск — ___), options:[…], a: индекс верного}]
                                   (варианты перемешиваются сами)
     build  — собрать предложение: items: ['Готовое предложение.', …] (слова перемешиваются сами)
     match  — найти пару:          pairs: [[слева, справа], …]
     reveal — сказать и проверить: items: [{q, a}], title — задание
   ===================================================================== */

const LESSONS = {
  /* ---------- A0-A1 ---------- */
  'a0-be-have': {
    warmup: ['How old are you?', 'Do you have a pet?'],
    visual: { type: 'compare', cols: [
      { icon: '🪞', label: 'BE — какой я, кто я', sub: 'am · is · are', examples: ['I am 20.', 'I am tired.', 'She is a teacher.'] },
      { icon: '🎒', label: 'HAVE — что у меня есть', sub: 'have · has', examples: ['I have a sister.', 'I have a car.', 'He has a dog.'] },
    ], note: 'Возраст — через BE: I am 20, а не I have 20.' },
    tasks: [
      { type: 'choose', items: [
        { pic: '🎂', q: 'I ___ 25 years old.', options: ['am', 'have'], a: 0 },
        { pic: '🐶', q: 'I ___ a dog.', options: ['am', 'have'], a: 1 },
        { pic: '😴', q: 'I ___ tired.', options: ['am', 'have'], a: 0 },
        { pic: '👩‍👧', q: 'She ___ two children.', options: ['is', 'has'], a: 1 },
        { pic: '🥶', q: 'We ___ cold.', options: ['are', 'have'], a: 0 },
        { pic: '💡', q: 'I ___ an idea!', options: ['am', 'have'], a: 1 },
      ]},
      { type: 'build', items: ['I am from Ufa.', 'I have a big family.', 'My brother is a doctor.'] },
      { type: 'match', pairs: [['I am hungry.', 'Я голоден.'], ['I have a question.', 'У меня есть вопрос.'], ['I am 30.', 'Мне 30 лет.'], ['I have a cat.', 'У меня есть кошка.']] },
    ],
    speak: [
      { q: 'Tell me 3 things about you.', hint: 'I am… (age, job, feeling)' },
      { q: 'Tell me 3 things you have.', hint: 'I have… (family, pets, things)' },
      { q: 'Describe your friend.', hint: 'He / She is… He / She has…' },
    ],
  },
  'a0-word-order': {
    warmup: ['What do you love?', 'What do you drink in the morning?'],
    visual: { type: 'formula', parts: [
      { t: 'Кто?', ex: 'I' }, { t: 'Действие', ex: 'love' }, { t: 'Что?', ex: 'coffee' }, { t: 'Где / когда?', ex: 'in the morning' },
    ], note: 'В русском порядок свободный: «Кофе я люблю». В английском — всегда по схеме.' },
    tasks: [
      { type: 'choose', items: [
        { pic: '☕', q: 'Как правильно?', options: ['Coffee I love.', 'I love coffee.'], a: 1 },
        { pic: '⚽', q: 'Как правильно?', options: ['I play football on Sundays.', 'On Sundays football I play.'], a: 0 },
        { pic: '🏢', q: 'Как правильно?', options: ['Work I in an office.', 'I work in an office.'], a: 1 },
        { pic: '🍕', q: 'Как правильно?', options: ['My sister likes pizza.', 'Likes my sister pizza.'], a: 0 },

.kicker{font-family:Unbounded,sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px}
.show h2{font-size:clamp(26px,4.4vw,52px);line-height:1.1;margin:0 0 16px;font-weight:700}
.show-ic{font-size:clamp(52px,8vw,96px);line-height:1;margin-bottom:10px}
.show-idea{font-size:clamp(18px,2.3vw,28px);color:var(--ink-2);margin:0 0 24px;max-width:42ch}
.show-phrases{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.show-phrases li{font-size:clamp(20px,3vw,38px);font-weight:600;background:var(--card);border-left:8px solid var(--accent);border-radius:14px;padding:10px 20px;line-height:1.25}
.show-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--card)}
.show-foot .btn{padding:10px 20px;font-size:15px}

/* разминка / говорим */
.bubbles{display:grid;gap:14px}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:18px 24px;font-size:clamp(22px,3.2vw,40px);font-weight:600;border:1.5px solid var(--line);max-width:900px}
.bubble:nth-child(even){justify-self:end;border-radius:22px 22px 6px 22px;background:var(--accent-soft);border-color:var(--accent)}
.speak{display:grid;gap:14px}
.speak-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.speak-card .q{font-size:clamp(19px,2.4vw,28px);font-weight:600}
.speak-card .h{color:var(--ink-2);grid-column:1}
.speak-card .h::before{content:"💡 "}
.timer{grid-row:1 / span 2;grid-column:2;font-family:Unbounded,sans-serif;font-weight:600;border:1.5px solid var(--ink);border-radius:999px;padding:10px 16px;background:transparent;min-width:96px}
.timer.run{background:var(--accent)}
.timer.over{background:var(--ink);color:var(--accent)}
@media (max-width:600px){ .speak-card{grid-template-columns:1fr} .timer{grid-row:auto;grid-column:1;justify-self:start} }

/* схемы */
.note{margin-top:18px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:.92em}
.note::before{content:"💡 "}
.v-compare{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.v-col{background:var(--card);border-radius:var(--r);padding:18px 20px;border-top:8px solid var(--accent)}
.v-col:nth-child(2){border-top-color:var(--ink)}
.v-col .ic{font-size:2.2em;line-height:1}
.v-col h4{font-family:Unbounded,sans-serif;font-size:1em;margin:8px 0 2px}
.v-col .sub{color:var(--ink-3);font-size:.85em;margin-bottom:10px}
.v-col ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.v-col li{background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:600}
.v-formula{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.v-part{flex:1 1 160px;background:var(--card);border-radius:var(--r);padding:14px 16px;position:relative;border:1.5px solid var(--line)}
.v-part:nth-child(odd){background:var(--accent-soft);border-color:var(--accent)}
.v-part b{font-family:Unbounded,sans-serif;font-size:.8em;display:block;color:var(--ink-2);margin-bottom:4px}
.v-part span{font-weight:600;font-size:1.1em}
.v-scale{display:grid;gap:8px;border-left:10px solid;border-image:linear-gradient(var(--accent-soft),var(--ink)) 1;padding-left:16px}
.v-step{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;background:var(--card);border-radius:12px;padding:10px 16px}
.v-step b{font-size:1.15em;min-width:9em}
.v-step span{color:var(--ink-2)}
.v-up{display:grid;gap:10px}
.v-up-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.v-up-row .from{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.v-up-row .arr{font-size:1.3em}
.v-up-row .to{background:var(--accent);border-radius:12px;padding:8px 14px;font-weight:600}
@media (max-width:600px){ .v-up-row{grid-template-columns:1fr} .v-up-row .arr{display:none} }
.v-table{display:grid;gap:8px}
.v-row{display:grid;grid-template-columns:2.2em 1fr 1fr;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:10px 16px}
.v-row .e{font-size:1.5em}
.v-row :nth-child(2){font-weight:600}
.v-row :nth-child(3){color:var(--ink-2)}
@media (max-width:600px){ .v-row{grid-template-columns:2em 1fr} .v-row :nth-child(3){grid-column:2} }

/* задания */
.task-score{display:inline-block;margin-left:10px;font-family:'Golos Text',sans-serif;text-transform:none;letter-spacing:0;background:var(--accent);color:var(--ink);border-radius:999px;padding:2px 10px}
.items{display:grid;gap:12px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;transition:border-color .2s}
.item.ok{border-color:#7FB800}
.item .pic{font-size:1.9em;grid-row:span 2}
.item .q{font-weight:600}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--ink-3);text-align:center;color:var(--ink-3)}
.gap.filled{border-color:#7FB800;color:var(--ink);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--ink);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.95em}
.opt:hover:not(:disabled){background:var(--accent-soft)}
.opt.right{background:#C8EA7A;border-color:#7FB800}
.opt.wrong{background:#FBD9D5;border-color:#D9534F;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.build{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;gap:10px}
.build.ok{border-color:#7FB800}
.build.bad{border-color:#D9534F}
.line{min-height:52px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px;align-items:center}
.build.ok .line{border-bottom-color:#7FB800}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.w{border:1.5px solid var(--ink);background:var(--accent-soft);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.95em}
.line .w{background:var(--card)}
.build.ok .w{background:#C8EA7A;border-color:#7FB800;cursor:default}
.build-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ink-3);text-decoration:underline;font-size:.8em;padding:0}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-col{display:grid;gap:10px;align-content:start}
.m{border:1.5px solid var(--ink);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;text-align:left;font-size:.95em}
.m.sel{background:var(--accent);}
.m.done{background:#C8EA7A;border-color:#7FB800;opacity:.75;cursor:default}
.m.wrong{background:#FBD9D5;border-color:#D9534F;animation:shake .35s}
.reveal{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.reveal .q{font-weight:600}
.reveal .a{width:100%;background:var(--accent-soft);border-radius:10px;padding:8px 14px;font-weight:600;display:none}
.reveal.open .a{display:block;animation:fadein .25s}
.result-big{font-family:Unbounded,sans-serif;font-size:clamp(24px,4vw,46px);line-height:1.2;background:var(--accent);border-radius:var(--r);padding:clamp(18px,3vw,32px);margin:0 0 20px}
.result-big::before{content:"✓ ";}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#B3261E}
/* активности */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.big-q{font-size:clamp(22px,3.2vw,38px);font-weight:600;margin:0 0 16px;line-height:1.25}
.helper{margin-top:22px;background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:10px 16px;color:var(--ink-2);font-size:.9em}
.play-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.play-row .muted{margin-right:auto}
.timer.big{font-size:1.2em;padding:14px 24px}
.facts{display:grid;gap:12px}
.fact{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 20px;text-align:left;font-size:clamp(18px,2.4vw,28px);font-weight:600}
.fact .n{font-family:Unbounded,sans-serif;background:var(--ink);color:var(--accent);border-radius:50%;width:1.8em;height:1.8em;display:grid;place-items:center;font-size:.7em}
.fact .t[contenteditable]{min-height:1.4em;outline:none;border-bottom:2px dashed var(--line)}
.fact .t[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-3)}
.fact .verdict{font-family:Unbounded,sans-serif;font-size:.7em}
.fact.truth{border-color:#7FB800;background:#EEF8D8}
.fact.lie{border-color:#D9534F;background:#FBE3E0}
.fact.guess{border-color:var(--ink);background:var(--accent-soft)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.vs-opt{border:2px solid var(--ink);background:var(--card);border-radius:var(--r);padding:clamp(18px,3vw,36px);font-size:clamp(20px,2.8vw,34px);font-weight:600;line-height:1.2}
.vs-opt:hover{background:var(--accent-soft)}
.vs-opt.picked{background:var(--accent)}
.vs-or{align-self:center;font-family:Unbounded,sans-serif;font-weight:700;font-size:1.2em}
@media (max-width:600px){ .vs{grid-template-columns:1fr} .vs-or{justify-self:center} }
.rank{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.rank-item{display:flex;gap:14px;align-items:center;border:1.5px solid var(--ink);background:var(--card);border-radius:14px;padding:12px 18px;font-size:clamp(19px,2.4vw,28px);font-weight:600;text-align:left}
.rank-item .pos{font-family:Unbounded,sans-serif;width:1.7em;height:1.7em;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:.8em}
.rank-item.on{background:var(--accent-soft)}
.rank-item.on .pos{background:var(--ink);color:var(--accent);border:0}
.sit-card{background:var(--ink);color:#fff;border-radius:var(--r);padding:clamp(20px,4vw,40px)}
.sit-card p{font-size:clamp(22px,3.4vw,42px);font-weight:600;margin:10px 0 18px;line-height:1.2}
.sit-lbl{color:var(--accent);font-family:Unbounded,sans-serif;font-size:.9em}
.sit-role{display:inline-block;background:var(--accent);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85em}
.pic-grid{display:grid;gap:20px}
@media (min-width:900px){ .pic-grid{grid-template-columns:1.2fr 1fr;align-items:start} }
.scene{background:linear-gradient(#E8F4FF,#FFF8E6);border-radius:var(--r);border:1.5px solid var(--line);padding:clamp(16px,3vw,32px);text-align:center;font-size:clamp(40px,7vw,78px);line-height:1.35;display:grid;gap:4px}
.scene div{letter-spacing:.12em}
.pic-grid .bubble{font-size:clamp(18px,2.2vw,26px)}
.clues{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.clue{border:2px dashed var(--ink);background:var(--card);border-radius:var(--r);padding:22px;font-size:clamp(18px,2.2vw,26px);font-weight:600;min-height:110px}
.clue:not(.open){color:var(--ink-3)}
.clue.open{border-style:solid;background:var(--accent-soft);cursor:default;animation:fadein .3s}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side{border-radius:var(--r);padding:18px;display:grid;gap:12px;justify-items:start}
.side h4{margin:0;font-family:Unbounded,sans-serif;font-size:1.1em}
.side.for{background:#EEF8D8;border:1.5px solid #7FB800}
.side.against{background:#FBE3E0;border:1.5px solid #D9534F}
.side .timer{grid-row:auto;grid-column:auto}
@media (max-width:600px){ .sides{grid-template-columns:1fr} }
.exit{display:grid;gap:14px;margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.exit-box{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.exit-box input{font:inherit;border:0;border-bottom:2px solid var(--line);padding:6px 2px;background:transparent;min-width:0}
.exit-box input:focus{outline:none;border-color:var(--accent)}
.exit-mini{background:var(--card);border:1.5px dashed var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:18px}
.exit-mini b{margin-right:8px}
</style>
</head>
<body>
<div class="shell">
  <aside class="app-sidebar" aria-label="Разделы">
    <a class="sb-logo" href="teacher.html" title="Кабинет учителя">Y!</a>
    <button class="tab-btn" data-mode="topics" title="Микро-темы"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button>
    <button class="tab-btn" data-mode="acts" title="Разговорные активности"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></button>
    <a class="tab-btn sb-bottom" href="teacher.html" title="Вернуться в кабинет"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
  </aside>

  <div class="main-col">
    <main class="page">
      <h1 class="panel-title" id="pageTitle">Микро-темы</h1>
      <p class="section-sub" id="pageSub"></p>

      <div id="banners"></div>

      <section class="filters">
        <div class="row" id="levels"><span class="lbl">Уровень</span></div>
        <div class="row" id="situations"><span class="lbl">Ситуация ученика</span></div>
        <input class="search" id="search" type="search" placeholder="Поиск по названию и фразам…" autocomplete="off">
      </section>

      <div class="layout">
        <div>
          <div class="grid" id="grid"></div>
        </div>
        <aside class="aside">
          <h2>Универсальные темы для практики</h2>
          <p class="muted">Подходят после любой микро-темы</p>
          <div class="chips" id="universal"></div>
        </aside>
      </div>
    </main>
  </div>
</div>

<nav class="tabs-mobile" aria-label="Разделы">
  <button data-mode="topics"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Микро-темы</button>
  <button data-mode="acts"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>Активности</button>
  <a href="teacher.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Кабинет</a>
</nav>

<div class="show" id="show" role="dialog" aria-modal="true" aria-label="Урок">
  <div class="show-bar">
    <button class="btn" id="showBack">✕ К списку</button>
    <span class="grow"></span>
    <span class="clock" id="clock" title="Время урока">⏱ 00:00</span>
    <button class="btn" id="showLink" title="Скопировать ссылку, чтобы ученик открыл урок у себя">🔗 Ссылка ученику</button>
    <button class="btn" id="showFs">⛶ Во весь экран</button>
  </div>
  <nav class="steps" id="steps"></nav>
  <div class="show-scroll" id="showScroll"><div class="show-body" id="showBody"></div></div>
  <div class="show-foot">
    <button class="btn" id="stepPrev">← Назад</button>
    <span class="muted" id="stepCount"></span>
    <button class="btn primary" id="stepNext">Дальше →</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = Object.fromEntries([...TOPICS, ...ACTIVITIES].map(t => [t.id, t]));   // темы и активности

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
};

const savedLevel = store.get('york-topics-level');
const state = {
  level: (savedLevel === 'all' || LEVELS.includes(savedLevel)) ? savedLevel : 'A0-A1',
  situation: null,
  query: '',
  mode: store.get('york-topics-mode') === 'acts' ? 'acts' : 'topics',   // topics — микро-темы, acts — активности
};
let visible = [];   // темы, показанные сейчас в списке

/* ---------- фильтры ---------- */
function renderFilters(){
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  $('#pageTitle').textContent = state.mode === 'acts' ? 'Разговорные активности' : 'Микро-темы';
  $('#pageSub').textContent = state.mode === 'acts'
    ? 'Игры и задания для разговора — вставляются в любой пробный урок.'
    : 'Найдите тему по уровню или ситуации ученика и покажите её на экране — это готовый урок на 15 минут.';

  const lv = $('#levels');
  lv.querySelectorAll('.pill').forEach(n => n.remove());
  [['all','Все'], ...LEVELS.map(l => [l,l])].forEach(([val,label]) => {
    const b = document.createElement('button');
    b.className = 'pill level';
    b.textContent = label;
    b.setAttribute('aria-pressed', state.level === val);
    b.onclick = () => { state.level = val; store.set('york-topics-level', val); render(); };
    lv.appendChild(b);
  });

  const st = $('#situations');
  st.style.display = state.mode === 'acts' ? 'none' : '';   // ситуации относятся только к микро-темам
  st.querySelectorAll('.pill').forEach(n => n.remove());
  SITUATION_GUIDE.forEach(s => {
    const b = document.createElement('button');
    b.className = 'pill sit';
    b.textContent = s.label;
    b.setAttribute('aria-pressed', state.situation === s.key);
    b.onclick = () => {
      if (state.situation === s.key) { state.situation = null; }
      else { state.situation = s.key; state.level = 'all'; } // ситуация — сразу все подходящие темы, минуя уровень
      render();
    };
    st.appendChild(b);
  });
}

function computeVisible(){
  const q = state.query.trim().toLowerCase();
  if (state.mode === 'acts') {
    let list = ACTIVITIES;
    if (q) return list.filter(a => (a.title + ' ' + a.goal + ' ' + a.how + ' ' + a.phrases.join(' ')).toLowerCase().includes(q));
    if (state.level !== 'all') list = list.filter(a => a.levels.includes(state.level));
    return list;
  }
  if (q) {
    // поиск — по всем темам, независимо от фильтров
    return TOPICS.filter(t => (t.title + ' ' + t.phrases.join(' ') + ' ' + t.section).toLowerCase().includes(q));
  }
  let list = state.situation
    ? SITUATION_GUIDE.find(s => s.key === state.situation).topics.map(id => byId[id]).filter(Boolean)
    : TOPICS;
  if (state.level !== 'all') list = list.filter(t => t.level === state.level);
  return list;
}

function renderBanners(){

      <div class="hc-value">«${esc(q)}»</div><button class="btn dark reset" data-reset="search">Очистить</button></div>`;
  } else if (state.situation) {
    const s = SITUATION_GUIDE.find(x => x.key === state.situation);
    main = `<div class="hero-card hc-lime"><div class="hc-label">Ситуация ученика</div>
      <div class="hc-value">${esc(s.label)}</div><div class="hc-note">${esc(s.hint)}</div>
      <button class="btn dark reset" data-reset="sit">Сбросить</button></div>`;
  } else if (state.level !== 'all' && state.mode === 'topics') {
    const g = LEVEL_GOALS[state.level];
    main = `<div class="hero-card hc-dark"><div class="hc-label">Цель уровня ${esc(state.level)}</div>
      <div class="hc-value">«${esc(g.goal)}»</div>${g.note ? `<div class="hc-note">${esc(g.note)}</div>` : ''}</div>`;
  } else {

      <div class="hc-value">${state.mode === 'acts' ? 'Разговорить ученика за пару минут' : 'A0-A1 → C1: выберите уровень ученика'}</div></div>`;

  });
}

const levelRange = lv => lv.length === LEVELS.length ? 'Любой уровень' : lv.length > 1 ? `${lv[0]} – ${lv[lv.length - 1]}` : lv[0];

function actCardHTML(a){

    <h3><span class="ic">${a.icon}</span><span>${esc(a.title)}</span></h3>

      <button class="btn primary" data-show="${a.id}">▶ Показать ученику</button>

}

function cardHTML(t){

    <h3><span class="ic">${t.icon}</span><span>${esc(t.title)}</span></h3>

function renderGrid(){
  visible = computeVisible();

      ? 'Для этой ситуации на выбранном уровне тем нет. Выберите «Все» или другой уровень.'

  }

$('#grid').addEventListener('click', e => {

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {

});

$('#universal').innerHTML = UNIVERSAL_TOPICS.map(u => `<span class="chip">${esc(u)}</span>`).join('');

/* ---------- копирование ---------- */
let toastTimer;
function toast(msg, isErr){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), isErr ? 4000 : 1800);
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove();
  return ok;
}

async function copyPhrases(t){
  const text = t.phrases.join('\n');
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e){ ok = fallbackCopy(text); }
  if (ok) toast(`Скопировано фраз: ${t.phrases.length}`);
  else toast('Не получилось скопировать — выделите фразы в карточке вручную', true);
}

/* ---------- мини-урок (режим показа) ---------- */
const show = $('#show');
const TASK_TITLES = { choose: 'Выбери правильный вариант', build: 'Собери предложение', match: 'Найди пару', reveal: 'Скажи сам — потом проверь' };
let lesson = null;   // { topic, steps: [{label, node}], cur, started, clockTimer }

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function node(html){ const d = document.createElement('div'); d.className = 'step'; d.innerHTML = html; return d; }
const head = (kicker, title) => `<p class="kicker">${kicker}</p>${title ? `<h2>${esc(title)}</h2>` : ''}`;

function lessonSteps(t){
  if (t.play) return actSteps(t);
  const L = LESSONS[t.id] || {};
  const steps = [];
  if (L.warmup) steps.push({ label: 'Разминка', node: stepWarmup(L.warmup) });
  steps.push({ label: 'Тема', node: stepIntro(t) });
  if (L.visual) steps.push({ label: 'Схема', node: stepVisual(t, L.visual) });
  (L.tasks || []).forEach((task, i) => steps.push({ label: `Задание ${i + 1}`, node: stepTask(task, i + 1) }));
  if (L.speak) steps.push({ label: 'Говорим', node: stepSpeak(L.speak) });
  steps.push({ label: 'Итог', node: stepResult(t) });
  return steps;
}
const stepCount = t => { if (t.play) return 2; const L = LESSONS[t.id] || {}; return (L.warmup ? 1 : 0) + 1 + (L.visual ? 1 : 0) + (L.tasks || []).length + (L.speak ? 1 : 0) + 1; };

function stepWarmup(qs){
  return node(`${head('Разминка', 'Let’s talk!')}<div class="bubbles">${qs.map(q => `<div class="bubble">${esc(q)}</div>`).join('')}</div>`);
}

function stepIntro(t){
  return node(`<div class="show-ic">${t.icon}</div><h2>${esc(t.title)}</h2>
    <p class="show-idea">${esc(t.idea)}</p>
    <ul class="show-phrases">${t.phrases.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`);
}

function stepVisual(t, v){
  let body = '';
  if (v.type === 'compare') body = `<div class="v-compare">${v.cols.map(c => `<div class="v-col">
      <div class="ic">${c.icon || ''}</div><h4>${esc(c.label)}</h4>${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ''}
      <ul>${c.examples.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if (v.type === 'formula') body = `<div class="v-formula">${v.parts.map(p => `<div class="v-part"><b>${esc(p.t)}</b><span>${esc(p.ex)}</span></div>`).join('')}</div>`;
  if (v.type === 'scale') body = `<div class="v-scale">${v.steps.map(s => `<div class="v-step"><b>${esc(s.w)}</b><span>${esc(s.d)}</span></div>`).join('')}</div>`;
  if (v.type === 'upgrade') body = `<div class="v-up">${v.pairs.map(([a, b]) => `<div class="v-up-row"><span class="from">${esc(a)}</span><span class="arr">→</span><span class="to">${esc(b)}</span></div>`).join('')}</div>`;
  if (v.type === 'table') body = `<div class="v-table">${v.rows.map(r => `<div class="v-row"><span class="e">${r[0]}</span><span>${esc(r[1])}</span><span>${esc(r[2] || '')}</span></div>`).join('')}</div>`;
  return node(`${head('Схема', t.title)}${body}${v.note ? `<div class="note">${esc(v.note)}</div>` : ''}`);
}

function stepTask(task, n){
  const d = node(`${head(`Задание ${n}<span class="task-score" hidden></span>`, task.title || TASK_TITLES[task.type])}<div class="items"></div>`);
  const box = d.querySelector('.items');
  const score = d.querySelector('.task-score');
  const total = task.type === 'match' ? task.pairs.length : task.items.length;
  let doneCount = 0;
  const done = () => { doneCount++; score.hidden = false; score.textContent = `${doneCount} / ${total}` + (doneCount === total ? ' 🎉' : ''); };

  if (task.type === 'choose') task.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<span class="pic">${it.pic || '❔'}</span>
      <div class="q">${esc(it.q).replace(/___/g, '<span class="gap">?</span>')}</div>
      <div class="opts"></div>`;
    const opts = el.querySelector('.opts');
    shuffle(it.options.map((o, i) => ({ o, i }))).forEach(({ o, i }) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o;
      b.onclick = () => {
        if (i !== it.a) { b.classList.add('wrong'); b.disabled = true; return; }
        b.classList.add('right'); el.classList.add('ok');
        opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
        const gaps = el.querySelectorAll('.gap');
        const parts = o.split(' / ');   // «drinks / is drinking» → в два пропуска
        gaps.forEach((g, k) => { g.textContent = gaps.length > 1 ? (parts[k] || o) : o; g.classList.add('filled'); });
        done();
      };
      opts.appendChild(b);
    });
    box.appendChild(el);
  });

  if (task.type === 'build') task.items.forEach(sentence => {
    const words = sentence.split(' ');
    let order = shuffle(words);
    for (let k = 0; k < 5 && words.length > 1 && order.join(' ') === sentence; k++) order = shuffle(words);
    const el = document.createElement('div');
    el.className = 'build';
    el.innerHTML = `<div class="line"></div><div class="build-row"><div class="bank"></div><button class="linkbtn">показать ответ</button></div>`;
    const line = el.querySelector('.line'), bank = el.querySelector('.bank');
    let solved = false;
    const check = () => {
      el.classList.remove('bad');
      if (bank.children.length) return;
      const got = [...line.children].map(w => w.textContent).join(' ');
      if (got === sentence) { solved = true; el.classList.add('ok'); done(); }
      else el.classList.add('bad');
    };
    order.forEach(w => {
      const b = document.createElement('button');
      b.className = 'w'; b.textContent = w;
      b.onclick = () => { if (solved) return; (b.parentNode === bank ? line : bank).appendChild(b); check(); };
      bank.appendChild(b);
    });
    el.querySelector('.linkbtn').onclick = () => {
      if (solved) return;
      const btns = [...line.children, ...bank.children];
      words.forEach(w => { const b = btns.find(x => x.textContent === w && !x.dataset.used); b.dataset.used = 1; line.appendChild(b); });
      check();
    };
    box.appendChild(el);
  });

  if (task.type === 'match') {
    const wrap = document.createElement('div');
    wrap.className = 'match';
    const L = document.createElement('div'), R = document.createElement('div');
    L.className = R.className = 'match-col';
    let sel = { l: null, r: null };
    const mk = (text, idx, side) => {
      const b = document.createElement('button');
      b.className = 'm'; b.textContent = text; b.dataset.idx = idx;
      b.onclick = () => {
        if (b.classList.contains('done')) return;
        (side === 'l' ? L : R).querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel'); sel[side] = b;
        if (sel.l && sel.r) {
          const a = sel.l, c = sel.r;
          if (a.dataset.idx === c.dataset.idx) { a.className = c.className = 'm done'; done(); }
          else [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('wrong'); setTimeout(() => x.classList.remove('wrong'), 450); });
          sel = { l: null, r: null };
        }
      };
      return b;
    };
    task.pairs.forEach(([a], i) => L.appendChild(mk(a, i, 'l')));
    shuffle(task.pairs.map(([, b], i) => ({ b, i }))).forEach(({ b, i }) => R.appendChild(mk(b, i, 'r')));
    wrap.append(L, R);
    box.appendChild(wrap);
  }

  if (task.type === 'reveal') task.items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'reveal';
    el.innerHTML = `<span class="q">${esc(it.q)}</span><button class="opt">Ответ</button><div class="a">${esc(it.a)}</div>`;
    const b = el.querySelector('button');
    let counted = false;
    b.onclick = () => {
      const open = el.classList.toggle('open');
      b.textContent = open ? 'Скрыть' : 'Ответ';
      if (open && !counted) { counted = true; done(); }
    };
    box.appendChild(el);
  });
  return d;
}

function stepSpeak(list){
  const d = node(`${head('Говорим', 'Your turn!')}<div class="speak">${list.map(s => `<div class="speak-card">
      <div class="q">${esc(s.q)}</div><div class="h">${esc(s.hint || '')}</div></div>`).join('')}</div>`);
  d.querySelectorAll('.speak-card').forEach(c => c.appendChild(makeTimer(60)));
  return d;
}

function stepResult(t){
  return node(`${head('Итог', '')}<div class="result-big">${esc(t.result)}</div>
    <div class="exit-mini"><b>🎟️ Exit ticket</b> Назови: 3 новых слова · 1 новую конструкцию · 1 предложение о себе</div>
    <p class="kicker">Продолжаем говорить</p>
    <div class="chips">${UNIVERSAL_TOPICS.map(u => `<span class="chip" style="font-size:1em;padding:8px 16px">${esc(u)}</span>`).join('')}</div>`);
}

/* ---------- разговорные активности ---------- */
let runningTimers = [];   // останавливаем при закрытии урока

// кнопка-таймер: клик — старт, ещё клик — пауза, после «Время!» — заново
function makeTimer(sec, cls){
  const b = document.createElement('button');
  b.className = 'timer' + (cls ? ' ' + cls : '');
  let left = sec, id = null;
  const fmt = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
  const draw = () => { b.textContent = left > 0 ? `⏱ ${fmt(left)}` : 'Время! ✓'; };
  const stop = () => { clearInterval(id); runningTimers = runningTimers.filter(x => x !== id); id = null; b.classList.remove('run'); };
  b.onclick = () => {
    if (id) return stop();
    if (left <= 0) { left = sec; b.classList.remove('over'); draw(); }
    b.classList.add('run');
    id = setInterval(() => { left--; draw(); if (left <= 0) { stop(); b.classList.add('over'); b.dispatchEvent(new Event('timeup')); } }, 1000);
    runningTimers.push(id);
  };
  draw();
  return b;
}

// вкладки внутри экрана (уровни, категории)
function makeTabs(labels, onPick){
  const w = document.createElement('div');
  w.className = 'tabs';
  labels.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'stp' + (i ? '' : ' cur');
    b.textContent = l;
    b.onclick = () => { w.querySelectorAll('.stp').forEach(x => x.classList.remove('cur')); b.classList.add('cur'); onPick(i); };
    w.appendChild(b);
  });
  return w;
}

const helper = list => list && list.length ? `<div class="helper">💬 ${list.map(esc).join(' · ')}</div>` : '';
function btn(text, cls, onclick){ const b = document.createElement('button'); b.className = cls || 'btn'; b.textContent = text; b.onclick = onclick; return b; }

function actSteps(a){
  const intro = node(`<div class="show-ic">${a.icon}</div><h2>${esc(a.title)}</h2>
    <p class="show-idea">${esc(a.rules)}</p>
    ${a.phrases.length ? `<p class="kicker">Фразы в помощь</p><ul class="show-phrases">${a.phrases.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}`);
  const play = node(`${head(a.icon + ' ' + esc(a.title), '')}`);
  PLAY[a.play.type](a, play);
  return [{ label: 'Правила', node: intro }, { label: 'Играем', node: play }];
}

const PLAY = {
  truths(a, root){
    const area = document.createElement('div');
    const draw = i => {
      area.innerHTML = '';
      if (i === a.play.sets.length) {   // «Твоя очередь» — три пустые карточки
        area.innerHTML = `<p class="big-q">Your turn! Tell me 2 truths and 1 lie.</p>`;
        const g = document.createElement('div'); g.className = 'facts';
        const states = ['?', '🤔 My guess', '✓ Truth', '✗ Lie'], cls = ['', 'guess', 'truth', 'lie'];
        [1, 2, 3].forEach(n => {
          const c = document.createElement('div'); c.className = 'fact';
          c.innerHTML = `<span class="n">${n}</span><div class="t" contenteditable="true" data-ph="Fact ${n}…"></div>`;
          let k = 0;
          c.appendChild(btn(states[0], 'opt', function(){ k = (k + 1) % states.length; this.textContent = states[k]; c.className = 'fact ' + cls[k]; }));
          g.appendChild(c);
        });
        area.appendChild(g);
        area.insertAdjacentHTML('beforeend', `<p class="muted" style="margin-top:12px">Факты можно вписать прямо в карточки. Кнопка под фактом: догадка → правда → ложь.</p>`);
        return;
      }
      const set = a.play.sets[i];
      area.innerHTML = `<p class="big-q">${esc(set.intro)} Which one is a lie?</p>`;
      const g = document.createElement('div'); g.className = 'facts';
      set.facts.forEach(([text, isLie], n) => {
        const c = document.createElement('button'); c.className = 'fact';
        c.innerHTML = `<span class="n">${n + 1}</span><span class="t">${esc(text)}</span><span class="verdict"></span>`;
        c.onclick = () => { c.classList.add(isLie ? 'lie' : 'truth'); c.querySelector('.verdict').textContent = isLie ? '✗ LIE!' : '✓ True'; };
        g.appendChild(c);
      });
      area.appendChild(g);
    };
    root.append(makeTabs([...a.play.sets.map(s => 'Tom · ' + s.label), '🙋 Your turn'], draw), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw(0);
  },

  rather(a, root){
    const area = document.createElement('div');
    let set = 0, qi = 0;
    const draw = () => {
      const [x, y] = a.play.sets[set].qs[qi];
      area.innerHTML = `<p class="big-q">Would you rather…</p>`;
      const vs = document.createElement('div'); vs.className = 'vs';
      const pick = b => { vs.querySelectorAll('.vs-opt').forEach(o => o.classList.toggle('picked', o === b)); };
      const bx = btn(x, 'vs-opt', function(){ pick(this); }), by = btn(y, 'vs-opt', function(){ pick(this); });
      vs.append(bx, Object.assign(document.createElement('span'), { className: 'vs-or', textContent: 'or' }), by);
      area.appendChild(vs);
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${qi + 1} / ${a.play.sets[set].qs.length}` }),
        btn('Другой вопрос →', 'btn primary', () => { qi = (qi + 1) % a.play.sets[set].qs.length; draw(); }));
      area.appendChild(row);
    };
    root.append(makeTabs(a.play.sets.map(s => s.label), i => { set = i; qi = 0; draw(); }), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw();
  },

  ranking(a, root){
    const area = document.createElement('div');
    const draw = i => {
      const set = a.play.sets[i];
      let ranked = [];
      area.innerHTML = `<p class="big-q">${esc(set.title)}</p><p class="muted">Нажимайте по порядку: сначала самое важное. Повторное нажатие убирает из рейтинга.</p>`;
      const list = document.createElement('div'); list.className = 'rank';
      const paint = () => list.querySelectorAll('.rank-item').forEach(b => {
        const pos = ranked.indexOf(b.dataset.v);
        b.querySelector('.pos').textContent = pos >= 0 ? pos + 1 : '';
        b.classList.toggle('on', pos >= 0);
        b.style.order = pos >= 0 ? pos : 99;
      });
      set.items.forEach(v => {
        const b = document.createElement('button'); b.className = 'rank-item'; b.dataset.v = v;
        b.innerHTML = `<span class="pos"></span><span>${esc(v)}</span>`;
        b.onclick = () => { ranked = ranked.includes(v) ? ranked.filter(x => x !== v) : [...ranked, v]; paint(); };
        list.appendChild(b);
      });
      area.appendChild(list);
      area.appendChild(btn('Сбросить', 'btn', () => { ranked = []; paint(); }));
      paint();
    };
    root.append(makeTabs(a.play.sets.map(s => s.label), draw), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw(0);
  },

  situations(a, root){
    const area = document.createElement('div');
    let cat = 0, ci = 0;
    const draw = () => {
      const c = a.play.cats[cat].cards[ci];
      area.innerHTML = `<div class="sit-card"><div class="sit-lbl">${esc(a.play.cats[cat].label)}</div><p>${esc(c.s)}</p>
        <div class="sit-role">🎭 Teacher plays: ${esc(c.role)}</div></div>`;
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${ci + 1} / ${a.play.cats[cat].cards.length}` }),
        makeTimer(120), btn('Следующая ситуация →', 'btn primary', () => { ci = (ci + 1) % a.play.cats[cat].cards.length; draw(); }));
      area.appendChild(row);
    };
    root.append(makeTabs(a.play.cats.map(c => c.label), i => { cat = i; ci = 0; draw(); }), area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw();
  },

  minute(a, root){
    const area = document.createElement('div');
    let ti = 0;
    const draw = () => {
      const t = a.play.topics[ti];
      area.innerHTML = `<p class="big-q">${esc(t.t)}</p>
        <ul class="show-phrases">${t.support.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
      const row = document.createElement('div'); row.className = 'play-row';
      const timer = makeTimer(60, 'big');
      const up = document.createElement('div'); up.className = 'v-up'; up.hidden = true;
      up.innerHTML = `<p class="kicker" style="margin-top:8px">Level up — скажи ещё раз вот так</p>` +
        t.upgrade.map(([x, y]) => `<div class="v-up-row"><span class="from">${esc(x)}</span><span class="arr">→</span><span class="to">${esc(y)}</span></div>`).join('');
      timer.addEventListener('timeup', () => { up.hidden = false; });
      row.append(timer, btn('⬆ Level up', 'btn', () => { up.hidden = !up.hidden; }),
        btn('Другая тема →', 'btn primary', () => { ti = (ti + 1) % a.play.topics.length; draw(); }));
      area.append(row, up);
    };
    root.appendChild(area);
    draw();
  },

  picture(a, root){
    const area = document.createElement('div');
    let si = 0, lvl = 0;
    const qs = document.createElement('div');
    const drawQs = () => { qs.innerHTML = `<div class="bubbles">${a.play.questions[lvl].qs.map(q => `<div class="bubble">${esc(q)}</div>`).join('')}</div>`; };
    const draw = () => {
      const sc = a.play.scenes[si];
      area.innerHTML = `<div class="scene" role="img" aria-label="${esc(sc.title)}">${sc.rows.map(r => `<div>${r}</div>`).join('')}</div>`;
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${si + 1} / ${a.play.scenes.length}` }),
        btn('Другая картинка →', 'btn primary', () => { si = (si + 1) % a.play.scenes.length; draw(); }));
      area.appendChild(row);
    };
    const grid = document.createElement('div'); grid.className = 'pic-grid';
    const right = document.createElement('div');
    right.append(makeTabs(a.play.questions.map(q => q.label), i => { lvl = i; drawQs(); }), qs);
    grid.append(area, right);
    root.appendChild(grid);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw(); drawQs();
  },

  detective(a, root){
    const area = document.createElement('div');
    let ci = 0;
    const draw = () => {
      const c = a.play.cases[ci];
      area.innerHTML = '';
      const clues = document.createElement('div'); clues.className = 'clues';
      c.clues.forEach((cl, i) => {
        const b = document.createElement('button'); b.className = 'clue';
        b.innerHTML = `<span>🔍 Clue ${i + 1}</span>`;
        b.onclick = () => { b.classList.add('open'); b.innerHTML = `<span>${esc(cl)}</span>`; };
        clues.appendChild(b);
      });
      area.append(clues);
      area.insertAdjacentHTML('beforeend', `<p class="big-q" style="margin-top:20px">❓ ${esc(c.q)}</p>`);
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `Дело ${ci + 1} / ${a.play.cases.length}` }),
        btn('Следующее дело →', 'btn primary', () => { ci = (ci + 1) % a.play.cases.length; draw(); }));
      area.appendChild(row);
    };
    root.appendChild(area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw();
  },

  debate(a, root){
    const area = document.createElement('div');
    let ti = 0;
    const draw = () => {
      area.innerHTML = `<p class="big-q">«${esc(a.play.topics[ti])}»</p>`;
      const sides = document.createElement('div'); sides.className = 'sides';
      [['👍 For', 'for'], ['👎 Against', 'against']].forEach(([label, cls]) => {
        const s = document.createElement('div'); s.className = 'side ' + cls;
        s.innerHTML = `<h4>${label}</h4>`;
        s.appendChild(makeTimer(60));
        sides.appendChild(s);
      });
      area.appendChild(sides);
      const row = document.createElement('div'); row.className = 'play-row';
      row.append(Object.assign(document.createElement('span'), { className: 'muted', textContent: `${ti + 1} / ${a.play.topics.length}` }),
        btn('Другая тема →', 'btn primary', () => { ti = (ti + 1) % a.play.topics.length; draw(); }));
      area.appendChild(row);
    };
    root.appendChild(area);
    root.insertAdjacentHTML('beforeend', helper(a.phrases));
    draw();
  },

  exit(a, root){
    root.insertAdjacentHTML('beforeend', `<h2>Сегодня ты научился говорить…</h2>
      <div class="exit">
        <div class="exit-box"><b>🆕 3 новых слова</b>
          <input placeholder="1." aria-label="Новое слово 1"><input placeholder="2." aria-label="Новое слово 2"><input placeholder="3." aria-label="Новое слово 3"></div>
        <div class="exit-box"><b>🧩 1 новая конструкция</b><input placeholder="например, I’m really into…" aria-label="Новая конструкция"></div>
        <div class="exit-box"><b>🙋 1 предложение о себе</b><input placeholder="…" aria-label="Предложение о себе"></div>
      </div>`);
    const done = btn('✓ Готово', 'btn primary', () => {
      const vals = [...root.querySelectorAll('input')].map(i => i.value.trim());
      if (!vals.some(Boolean)) return toast('Сначала впишите хотя бы одно слово или фразу', true);
      out.innerHTML = `<div class="result-big">Сегодня ты научился говорить: ${vals.filter(Boolean).map(esc).join(' · ')}</div>`;
    });
    const out = document.createElement('div');
    out.style.marginTop = '16px';
    root.append(done, out);
  },
};

function goStep(i){
  if (!lesson) return;
  lesson.cur = Math.max(0, Math.min(i, lesson.steps.length - 1));
  lesson.steps.forEach((s, k) => s.node.classList.toggle('cur', k === lesson.cur));
  const pills = [...$('#steps').children];
  pills.forEach((p, k) => { p.classList.toggle('cur', k === lesson.cur); p.classList.toggle('done', k < lesson.cur); });
  pills[lesson.cur].scrollIntoView({ block: 'nearest', inline: 'center' });
  $('#stepCount').textContent = `${lesson.cur + 1} / ${lesson.steps.length}`;
  $('#stepPrev').style.visibility = lesson.cur === 0 ? 'hidden' : '';
  $('#stepNext').textContent = lesson.cur === lesson.steps.length - 1 ? 'Завершить ✓' : 'Дальше →';
  $('#showScroll').scrollTop = 0;
}

function openShow(t){
  if (!t) return;
  const steps = lessonSteps(t);
  const body = $('#showBody'); body.innerHTML = '';
  steps.forEach(s => body.appendChild(s.node));
  const nav = $('#steps'); nav.innerHTML = '';
  steps.forEach((s, k) => { const b = document.createElement('button'); b.className = 'stp'; b.textContent = s.label; b.onclick = () => goStep(k); nav.appendChild(b); });
  if (lesson) clearInterval(lesson.clockTimer);
  lesson = { topic: t, steps, cur: 0, started: Date.now() };
  const tick = () => { const s = Math.floor((Date.now() - lesson.started) / 1000); $('#clock').textContent = `⏱ ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  tick(); lesson.clockTimer = setInterval(tick, 1000);
  show.classList.add('open');
  document.body.style.overflow = 'hidden';
  goStep(0);
  safeHistory('pushState', { show: true }, '#lesson=' + t.id);   // «Назад» на телефоне закрывает урок
  $('#stepNext').focus();
}

// изменение адреса — только удобство (кнопка «Назад», ссылка); если браузер запрещает, урок всё равно работает
function safeHistory(method, state, hash){
  try { history[method](state, '', hash || (location.pathname + location.search)); } catch(e){}
}

function closeShowUI(){
  show.classList.remove('open');
  document.body.style.overflow = '';
  if (lesson) clearInterval(lesson.clockTimer);
  runningTimers.forEach(clearInterval); runningTimers = [];
  lesson = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (location.hash) safeHistory('replaceState', null);
}

function closeShow(){
  if (history.state && history.state.show) history.back(); // закроется через popstate
  else closeShowUI();
}

window.addEventListener('popstate', () => { if (show.classList.contains('open')) closeShowUI(); });
$('#showBack').onclick = closeShow;
$('#stepPrev').onclick = () => goStep(lesson.cur - 1);
$('#stepNext').onclick = () => { if (lesson.cur === lesson.steps.length - 1) closeShow(); else goStep(lesson.cur + 1); };
$('#showFs').onclick = () => {
  if (document.fullscreenElement) return document.exitFullscreen().catch(() => {});
  if (!show.requestFullscreen) return toast('Этот браузер не поддерживает полноэкранный режим', true);
  show.requestFullscreen().catch(() => toast('Не удалось включить полноэкранный режим', true));
};
$('#showLink').onclick = async () => {
  const url = location.href.split('#')[0] + '#lesson=' + lesson.topic.id;
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch(e){ ok = fallbackCopy(url); }
  if (ok) toast('Ссылка на урок скопирована — отправьте ученику');
  else toast('Не получилось скопировать ссылку: ' + url, true);
};
document.addEventListener('keydown', e => {
  if (!show.classList.contains('open')) return;
  if (e.key === 'Escape' && !document.fullscreenElement) closeShow();
  if (e.key === 'ArrowRight') goStep(lesson.cur + 1);
  if (e.key === 'ArrowLeft' && lesson.cur > 0) goStep(lesson.cur - 1);
});

render();

// ссылка вида trial-topics.html#lesson=a0-be-have сразу открывает урок
const linked = (location.hash.match(/lesson=([\w-]+)/) || [])[1];
if (linked && byId[linked]) { safeHistory('replaceState', null); openShow(byId[linked]); }
</script>
